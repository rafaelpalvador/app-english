# Gera o APK do Glosa e publica-o numa Release (usado pelo Obtainium).
# Corre quando é enviada uma etiqueta vX.Y.Z, ou à mão em Actions → "Android APK".
name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Juntar o app web e copiá-lo para a app Android
        run: |
          node build.js
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Versão
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Gerar APK
        working-directory: android
        # A chave de assinatura está no próprio repositório (android/assinatura/glosa.jks),
        # como no app de podcast: assim o APK é sempre assinado da mesma forma e o
        # Obtainium consegue atualizá-lo, sem configurar segredos no GitHub.
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/assinatura/glosa.jks
          KEYSTORE_PASSWORD: 7SgbM3y-1hRBVAH86QiLooxtHRSudA6r
          KEY_ALIAS: glosa
          KEY_PASSWORD: 7SgbM3y-1hRBVAH86QiLooxtHRSudA6r
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Dar nome ao APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "glosa-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: glosa-apk
          path: glosa-*.apk

      - name: Publicar a Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: glosa-*.apk
          generate_release_notes: true
