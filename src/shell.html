<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Geist:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap" rel="stylesheet">
<style>
:root{
  /* Glosa: the gloss lives in the margin. Dark ink rail + white reading sheet;
     highlighter yellow marks what you're learning, ultramarine marks what's new. */
  --bg:#ECEFF4; --sheet:#FFFFFF; --surface:#FFFFFF; --surface-2:#F4F6F9;
  --ink:#0F1728; --ink-2:#344055; --muted:#687386; --line:#E0E5EC; --line-2:#C9D1DC;
  --accent:#3446F5; --accent-ink:#FFFFFF; --accent-soft:#E7EAFF;
  --hl1:#FFCF24; --hl2:#FFDD62; --hl3:#FFE99C; --hl4:#FFF3CD;
  --new:#3446F5; --new-bg:#EEF0FF;
  --known:#0F9D63; --bad:#D63F35; --warn:#D98A00;
  --rail:#0D1322; --rail-ink:#E8ECF5; --rail-muted:#8892A7; --rail-line:#1C2539; --rail-hi:#18213A;
  --shadow:0 1px 2px rgba(15,23,40,.05),0 10px 30px -12px rgba(15,23,40,.16);
  --shadow-lg:0 30px 80px -20px rgba(15,23,40,.35);
  --f-d:'Gloock',Georgia,'Times New Roman',serif;
  --f-u:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-r:'Newsreader',Georgia,'Times New Roman',serif;
  --nav:66px; --rad:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#090D15; --sheet:#101725; --surface:#111928; --surface-2:#172033;
    --ink:#E8ECF4; --ink-2:#C2CAD8; --muted:#8B95A8; --line:#212B3F; --line-2:#2E3A53;
    --accent:#8D9CFF; --accent-ink:#0A0E16; --accent-soft:#1C2452;
    --hl1:#A57B00; --hl2:#86660C; --hl3:#655014; --hl4:#433817;
    --new:#8D9CFF; --new-bg:#1A2148;
    --known:#3DD598; --bad:#FF7A70; --warn:#F2B64B;
    --rail:#060910; --rail-line:#151C2B; --rail-hi:#121A2C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#090D15; --sheet:#101725; --surface:#111928; --surface-2:#172033;
  --ink:#E8ECF4; --ink-2:#C2CAD8; --muted:#8B95A8; --line:#212B3F; --line-2:#2E3A53;
  --accent:#8D9CFF; --accent-ink:#0A0E16; --accent-soft:#1C2452;
  --hl1:#A57B00; --hl2:#86660C; --hl3:#655014; --hl4:#433817;
  --new:#8D9CFF; --new-bg:#1A2148;
  --known:#3DD598; --bad:#FF7A70; --warn:#F2B64B;
  --rail:#060910; --rail-line:#151C2B; --rail-hi:#121A2C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
/* reading-sheet themes */
.sheet[data-r="sepia"]{--sheet:#F6EEDC;--ink:#3A2E1F;--ink-2:#5B4A35;--muted:#8A7659;--line:#E4D7BC;--new-bg:#E9E4F5;--hl4:#F7E7B5;color:var(--ink)}
.sheet[data-r="night"]{--sheet:#15171D;--ink:#DAD5C8;--ink-2:#BDB7A8;--muted:#8D887C;--line:#2A2D36;--new:#9AA6FF;--new-bg:#22264A;--hl1:#9C7400;--hl2:#7E620E;--hl3:#5E4B14;--hl4:#3F3518;color:var(--ink)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 15.5px/1.5 var(--f-u);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
input[type=range],input[type=checkbox]{accent-color:var(--accent)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;font-weight:400;text-wrap:balance;line-height:1.08}
p{margin:0}
.d{font-family:var(--f-d);letter-spacing:-.01em}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
kbd{font:600 11px var(--f-u);padding:1px 6px;border-radius:5px;border:1px solid var(--line-2);border-bottom-width:2px;background:var(--surface-2);color:var(--ink-2)}

/* ============ shell ============ */
.shell{display:grid;grid-template-columns:1fr;min-height:100%}
.rail{display:none}
.main{min-width:0;padding-bottom:calc(var(--nav) + 24px)}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{display:inline-flex;align-items:baseline;gap:2px;font:400 27px/1 var(--f-d);letter-spacing:-.02em;text-decoration:none;color:inherit}
.logo i{font-style:normal;position:relative}
.logo i::after{content:"";position:absolute;left:-2px;right:-3px;bottom:2px;height:9px;background:var(--hl1);z-index:-1;border-radius:2px;transform:skewX(-8deg)}
.logo b{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;margin-left:2px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--ink-2)}
.chip svg{flex:none}
.chip.flame{color:#E2581B;border-color:color-mix(in srgb,#E2581B 30%,var(--line))}
.chip.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.ok{color:var(--known);border-color:color-mix(in srgb,var(--known) 35%,var(--line))}
.chip.y{background:var(--hl3);border-color:transparent;color:var(--ink)}
.ibtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);transition:border-color .15s,transform .15s}
.ibtn:hover{border-color:var(--line-2);color:var(--ink)}
.ibtn:active{transform:scale(.96)}
.ibtn.ghost{border-color:transparent;background:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px;color:var(--ink);transition:transform .12s,border-color .15s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{border-color:var(--line-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.pri:hover{box-shadow:0 8px 20px -8px color-mix(in srgb,var(--ink) 60%,transparent)}
.btn.blue{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{height:34px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.xs{height:30px;padding:0 10px;font-size:12.5px;border-radius:9px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.tabbar{position:fixed;z-index:40;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"] .ti{background:var(--hl2);color:var(--ink)}
.ti{display:grid;place-items:center;width:46px;height:28px;border-radius:99px;transition:background .2s}
.tabbar .badge{position:absolute;top:5px;left:calc(50% + 10px)}
.badge{min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;line-height:19px;text-align:center}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:20px 16px 0}

@media (min-width:1000px){
  .shell{grid-template-columns:252px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--rail);color:var(--rail-ink);padding:22px 14px 16px;gap:4px;border-right:1px solid var(--rail-line)}
  .rail .logo{color:#fff;padding:0 10px 18px;font-size:30px}
  .rail .logo i::after{background:#E8B500;opacity:.9}
  .rnav{display:grid;gap:2px}
  .rnav button{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:11px;color:var(--rail-muted);font-weight:500;font-size:14.5px;text-align:left;transition:background .15s,color .15s}
  .rnav button:hover{background:var(--rail-hi);color:var(--rail-ink)}
  .rnav button[aria-current="page"]{background:var(--rail-hi);color:#fff}
  .rnav button[aria-current="page"] svg{color:#FFD43B}
  .rnav .badge{margin-left:auto}
  .rnav .sep{height:1px;background:var(--rail-line);margin:10px 8px}
  .rail-foot{margin-top:auto;display:grid;gap:10px}
  .rcard{border:1px solid var(--rail-line);border-radius:14px;padding:14px;background:linear-gradient(180deg,var(--rail-hi),transparent)}
  .rcard .t{font-size:12px;color:var(--rail-muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  .rcard .big{font:400 30px/1 var(--f-d);color:#fff;margin-top:6px}
  .wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
  .wk span{display:grid;place-items:center;gap:4px;font-size:10px;color:var(--rail-muted)}
  .wk i{width:100%;aspect-ratio:1;border-radius:6px;background:var(--rail-line)}
  .wk i.on{background:#FFD43B}
  .wk i.today{outline:1.5px solid #fff;outline-offset:1px}
  .rail-set{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:11px;color:var(--rail-muted);font-size:14px}
  .rail-set:hover{background:var(--rail-hi);color:#fff}
  .topbar,.tabbar{display:none}
  .main{padding-bottom:40px}
  .wrap{padding:30px 34px 0}
}

/* ============ common blocks ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h3{font:400 22px/1.15 var(--f-d)}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:34px 0 14px}
.sec-h h2{font:400 clamp(24px,3.2vw,30px)/1.1 var(--f-d)}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-h h1{font:400 clamp(36px,6vw,58px)/1 var(--f-d);letter-spacing:-.02em;margin-top:8px}
.page-h p{color:var(--muted);margin-top:10px;max-width:56ch}
.meter{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line);gap:2px}
.meter.thin{height:5px}
.meter i{display:block;height:100%;border-radius:99px}
.m-k{background:var(--known)} .m-l{background:var(--hl1)} .m-n{background:var(--new)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:4px;display:inline-block}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);gap:2px}
.seg button{height:32px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,40,.12)}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.p-new{background:var(--new-bg);color:var(--new)}
.p-l1{background:var(--hl1);color:#1C1400} .p-l2{background:var(--hl2);color:#1C1400} .p-l3{background:var(--hl3);color:#1C1400} .p-l4{background:var(--hl4);color:#1C1400}
.p-k{background:color-mix(in srgb,var(--known) 16%,transparent);color:var(--known)}
.p-i{background:var(--surface-2);color:var(--muted)}
.lvl{display:inline-flex;gap:3px;vertical-align:middle}
.lvl i{width:6px;height:6px;border-radius:2px;background:var(--line-2)}
.lvl i.on{background:var(--hl1)}

/* covers */
.cover{position:relative;overflow:hidden;border-radius:12px;background:var(--line);width:100%}
.cover svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cover .cv-t{position:absolute;left:12px;right:12px;bottom:10px;font:400 18px/1.05 var(--f-d);color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.cover .cv-l{position:absolute;top:10px;left:10px}
.ring-lbl{font:400 26px/1 var(--f-d)}

/* ============ HOJE ============ */
.home-grid{display:grid;gap:16px;grid-template-columns:1fr;margin-top:26px}
@media (min-width:760px){.home-grid{grid-template-columns:repeat(6,1fr)}.span-4{grid-column:span 4}.span-2{grid-column:span 2}.span-3{grid-column:span 3}}
.cont{display:grid;grid-template-columns:92px 1fr;gap:16px;align-items:start;padding:16px}
.cont .cover{aspect-ratio:3/4}
.cont h2{font:400 clamp(26px,3.6vw,36px)/1.05 var(--f-d);margin:6px 0 8px}
.cont .blurb{color:var(--ink-2);font:400 16px/1.5 var(--f-r);font-style:italic;max-width:46ch}
.cont .body{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (min-width:600px){.cont{grid-template-columns:168px 1fr;padding:20px;align-items:stretch}.cont .cover{height:100%;aspect-ratio:auto;min-height:224px}}
.rings{display:flex;align-items:center;gap:18px}
.rings svg{flex:none}
.gl{display:grid;gap:10px;font-size:13.5px}
.gl div{display:flex;align-items:center;gap:8px}
.gl b{margin-left:auto;font-variant-numeric:tabular-nums}
.due-card{position:relative;overflow:hidden;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.due-card .muted{color:color-mix(in srgb,var(--bg) 62%,transparent)}
.due-card .n{font:400 64px/1 var(--f-d);letter-spacing:-.03em}
.due-card .btn{background:var(--hl1);border-color:var(--hl1);color:#1C1400}
.due-card .deck{position:absolute;right:-16px;top:16px;width:120px;height:90px;opacity:.9}
.due-card .deck i{position:absolute;inset:0;border-radius:12px;border:1.5px solid color-mix(in srgb,var(--bg) 40%,transparent);background:color-mix(in srgb,var(--bg) 6%,transparent)}
.due-card .deck i:nth-child(2){transform:rotate(-8deg) translate(-10px,6px)}
.due-card .deck i:nth-child(3){transform:rotate(-16deg) translate(-20px,14px)}
.wod .w-big{font:400 40px/1 var(--f-d);margin:10px 0 4px}
.wod q{display:block;font:italic 400 16px/1.55 var(--f-r);color:var(--ink-2);quotes:none;margin-top:10px}
.wod q mark{background:var(--hl2);color:inherit;border-radius:3px;padding:0 2px}
.mini-list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.mini{display:grid;grid-template-columns:62px 1fr;gap:14px;align-items:center;padding:12px;text-align:left;width:100%}
.mini .cover{aspect-ratio:3/4}
.mini h4{font:400 19px/1.1 var(--f-d)}
.mini:hover{border-color:var(--line-2)}

/* ============ LEITOR ============ */
.reader{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:start}
@media (min-width:1180px){.reader{grid-template-columns:minmax(0,1fr) 372px}}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:clip;transition:background .25s,color .25s}
.r-head{position:relative;padding:22px 20px 18px;display:grid;grid-template-columns:76px 1fr;gap:16px;align-items:end}
.r-head .cover{aspect-ratio:3/4}
.r-head h1{font:400 clamp(30px,5vw,48px)/1 var(--f-d);letter-spacing:-.02em;margin:6px 0 8px}
.r-meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.r-meta span{display:inline-flex;align-items:center;gap:5px}
@media (min-width:700px){.r-head{grid-template-columns:104px 1fr;padding:30px 44px 22px}}
.cov{padding:0 20px 18px}
.cov-top{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:8px;flex-wrap:wrap;color:var(--muted)}
.cov-top b{color:var(--ink);font-weight:600}
@media (min-width:700px){.cov{padding:0 44px 20px}}
.toolbar{position:sticky;top:61px;z-index:15;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:color-mix(in srgb,var(--sheet) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@media (min-width:1000px){.toolbar{top:0;padding:10px 30px}}
.toolbar .seg{background:transparent}
.tdots{display:inline-flex;gap:6px;padding:0 4px}
.tdots button{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-2)}
.tdots button.on{outline:2px solid var(--accent);outline-offset:2px}
.tdots .t-paper{background:#fff}.tdots .t-sepia{background:#F1E5C8}.tdots .t-night{background:#1B1E26}
.play{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 6px;border-radius:99px;background:var(--ink);color:var(--sheet);font-weight:600;font-size:13.5px}
.play .pc{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--hl1);color:#1C1400}
.rprog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0;transition:width .1s}
.tb-sp{flex:1}
@media (max-width:699px){.toolbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:8px 12px}.toolbar::-webkit-scrollbar{display:none}.toolbar>*{flex:none}.toolbar .play{order:-1}.tb-sp{display:none}}
.textwrap{padding:28px 20px 34px}
@media (min-width:700px){.textwrap{padding:40px 44px 48px}}
#text{font-family:var(--f-r);font-size:var(--fs,20px);line-height:var(--lh,1.95);max-width:66ch;color:var(--ink);font-optical-sizing:auto}
#text p{margin:0 0 1.15em}
#text p:first-child::first-letter{font-family:var(--f-d);float:left;font-size:3.5em;line-height:.82;padding:.08em .1em 0 0;color:var(--ink)}
.w{cursor:pointer;border-radius:4px;padding:.04em .08em;margin:0 -.04em;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-color .15s,box-shadow .15s}
.w:hover{box-shadow:inset 0 -2px 0 var(--ink)}
.w.st0{background:var(--new-bg);box-shadow:inset 0 -1.5px 0 color-mix(in srgb,var(--new) 70%,transparent)}
.w.st1{background:linear-gradient(100deg,transparent 0 .2em,var(--hl1) .25em calc(100% - .2em),transparent calc(100% - .15em)),var(--hl1)}
.w.st1,.w.st2,.w.st3,.w.st4{background-size:100% 100%}
.w.st2{background:var(--hl2)} .w.st3{background:var(--hl3)} .w.st4{background:var(--hl4)}
.hl-new .w.st1,.hl-new .w.st2,.hl-new .w.st3,.hl-new .w.st4{background:transparent;box-shadow:inset 0 -2px 0 var(--hl1)}
.hl-none .w.st0,.hl-none .w.st1,.hl-none .w.st2,.hl-none .w.st3,.hl-none .w.st4{background:transparent;box-shadow:none}
.w.x{text-decoration:underline dotted color-mix(in srgb,var(--accent) 80%,transparent);text-decoration-thickness:2px;text-underline-offset:.32em}
.noexpr .w.x{text-decoration:none}
.w.sel{background:var(--ink)!important;color:var(--sheet);box-shadow:none}
.w.spk{background:var(--accent)!important;color:var(--accent-ink);box-shadow:none}
.sent.playing{background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:6px;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 9%,transparent)}
.sbtn{display:inline-grid;place-items:center;width:1.25em;height:1.25em;vertical-align:-.15em;margin-left:.1em;border-radius:6px;color:var(--muted);opacity:.35;transition:opacity .15s,background .15s}

/* gloss */
.gloss{position:fixed;z-index:45;left:0;right:0;bottom:0;max-height:min(70vh,640px);display:flex;flex-direction:column;background:var(--surface);border-top-left-radius:24px;border-top-right-radius:24px;box-shadow:0 -20px 60px -10px rgba(10,15,30,.35);transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;padding-bottom:env(safe-area-inset-bottom,0px)}

.g-handle{display:grid;place-items:center;height:22px;flex:none;cursor:grab;touch-action:none}

.g-scroll{overflow:auto;padding:0 18px 20px;flex:1;overscroll-behavior:contain}
@media (max-width:1179px){.reading-open #text{padding-bottom:40vh}}
@media (min-width:1180px){
  .gloss{position:sticky;top:24px;left:auto;right:auto;bottom:auto;max-height:calc(100vh - 48px);transform:none;visibility:visible;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);transition:none;padding-bottom:0}
  .g-handle{display:none}
  .g-scroll{padding:20px 22px 22px}
  .g-x{display:none}
}
.g-band{height:4px;border-radius:4px;margin-bottom:16px;background:var(--line)}
.g-word{font:400 clamp(36px,5vw,44px)/1 var(--f-d);letter-spacing:-.02em;word-break:break-word}
.g-sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:13.5px;color:var(--muted)}
.g-sub .ipa{font-family:var(--f-r);font-size:16px;color:var(--ink-2)}
.g-tr{font:400 23px/1.25 var(--f-d);margin-top:16px;color:var(--ink)}
.g-tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:18px 0 14px}
.g-tabs button{position:relative;height:38px;font-size:13.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.g-tabs button.on{color:var(--ink)}
.g-tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
.g-expr{display:grid;gap:8px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--ink);font-size:14px;margin-top:14px}
.g-expr b{font-weight:600}
.g-ctx{font:400 16.5px/1.6 var(--f-r);color:var(--ink-2)}
.g-ctx mark{background:var(--hl2);color:var(--ink);border-radius:3px;padding:0 3px}
.g-ctx .tr{display:block;margin-top:8px;font-family:var(--f-u);font-size:14px;color:var(--muted);line-height:1.5}
.g-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ai{display:grid;gap:12px}
.ai-card{position:relative;padding:14px 16px;border-radius:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 9%,var(--surface)),var(--surface) 70%);border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line));font-size:14.5px;line-height:1.6}
.ai-card p+p{margin-top:8px}
.ai-tag{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.ai-q{justify-self:end;max-width:85%;padding:9px 13px;border-radius:14px 14px 4px 14px;background:var(--ink);color:var(--bg);font-size:14px}
.caret{display:inline-block;width:7px;height:1.05em;vertical-align:-.15em;background:var(--accent);margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-2)}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.ask{display:flex;gap:6px;padding:5px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.ask input{flex:1;min-width:0;border:0;background:transparent;padding:0 8px;height:34px;outline:none}
.skel{height:10px;border-radius:5px;background:var(--line);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.note-ta{width:100%;min-height:120px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font:400 15px/1.5 var(--f-r);resize:vertical}
.st-pick{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.st-row{display:grid;grid-template-columns:minmax(52px,auto) repeat(4,minmax(30px,1fr)) minmax(86px,auto);gap:4px;padding:4px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.st-row button{padding:0 8px;height:40px;border-radius:10px;font-size:13px;font-weight:700;color:var(--ink-2);display:grid;place-items:center;position:relative}
.st-row button:hover{background:var(--surface)}
.st-row button.on{box-shadow:0 0 0 2px var(--ink) inset}
.st-row .b0.on{background:var(--new-bg);color:var(--new)}
.st-row .b1{background:var(--hl1);color:#1C1400}.st-row .b2{background:var(--hl2);color:#1C1400}.st-row .b3{background:var(--hl3);color:#1C1400}.st-row .b4{background:var(--hl4);color:#1C1400}
.st-row .b5.on{background:color-mix(in srgb,var(--known) 18%,var(--surface));color:var(--known)}
.st-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.linkbtn{color:var(--muted);font-size:12.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.g-empty{display:grid;gap:16px}
.g-empty .ill{height:120px;border-radius:16px;background:var(--surface-2);position:relative;overflow:hidden;border:1px solid var(--line)}
.keys{display:grid;gap:8px;font-size:13px;color:var(--muted)}
.keys div{display:flex;justify-content:space-between;gap:10px}

/* ============ BIBLIOTECA ============ */

@media (min-width:820px){.feat{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}.feat .cover{aspect-ratio:auto;min-height:340px}.feat .fb{padding:34px 36px}}

.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:220px;flex:1;max-width:340px}

.imp{display:grid;gap:16px;grid-template-columns:1fr;margin-top:14px}
@media (min-width:820px){.imp{grid-template-columns:1.2fr 1fr}}
.drop{display:grid;place-items:center;gap:10px;text-align:center;min-height:200px;padding:24px;border:2px dashed var(--line-2);border-radius:18px;background:var(--surface-2);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .big{font:400 26px/1.1 var(--f-d)}
.srcs{display:grid;gap:8px}
.src{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.src .si{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--surface-2);color:var(--ink-2);flex:none}
.src b{display:block;font-weight:600;font-size:14px}
.src small{color:var(--muted);font-size:12.5px}

/* ============ REVER ============ */
.rv-wrap{max-width:760px;margin:0 auto}
.modes{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin-top:14px}
@media (min-width:640px){.modes{grid-template-columns:repeat(4,1fr)}}
.mode{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left;transition:border-color .15s,transform .15s}
.mode:hover{transform:translateY(-2px)}
.mode.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.mode .mi{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--surface-2)}
.mode.on .mi{background:var(--hl2);color:#1C1400}
.mode b{font-size:14.5px}
.mode small{color:var(--muted);font-size:12.5px;line-height:1.35}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.stat{padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.stat .n{font:400 40px/1 var(--f-d)}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:6px}
.rv-top{display:flex;align-items:center;gap:12px;margin-top:6px}
.segs{display:flex;gap:3px;flex:1}
.segs i{flex:1;height:5px;border-radius:4px;background:var(--line)}
.segs i.d{background:var(--ink)}
.segs i.c{background:var(--accent)}
.flip{perspective:1600px;margin-top:18px}
.flip-in{position:relative;display:grid;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.flip.turn .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:30px 24px;min-height:340px;display:flex;flex-direction:column;gap:18px}
.face.back{transform:rotateY(180deg)}

.face .fw{font:400 clamp(44px,8vw,64px)/1 var(--f-d);letter-spacing:-.02em}
.face .fctx{font:400 20px/1.65 var(--f-r);color:var(--ink-2)}
.face .fctx mark{background:var(--hl2);color:var(--ink);border-radius:4px;padding:0 4px}
.blank{display:inline-block;min-width:5em;border-bottom:2.5px solid var(--accent);margin:0 3px;height:1.1em;vertical-align:-.1em}
.face .ftr{font:400 30px/1.15 var(--f-d)}
.face .fsub{color:var(--muted);font-size:15px}
.face .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.ans{display:flex;gap:8px}
.ans input{flex:1;min-width:0;height:50px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--surface-2);font-size:18px}
.ans input:focus{border-color:var(--accent);outline:none}
.opts{display:grid;gap:8px;grid-template-columns:1fr}

.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:15.5px;font-weight:500;transition:border-color .15s}
.opt:hover{border-color:var(--line-2)}
.opt kbd{flex:none}
.opt.right{border-color:var(--known);background:color-mix(in srgb,var(--known) 12%,var(--surface))}

.verdict{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px}

.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.grades button{display:grid;gap:3px;padding:12px 6px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;text-align:center;transition:transform .12s,border-color .15s}

.grades .g1{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));color:var(--bad)}
.grades .g2{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));color:var(--warn)}
.grades .g3{border-color:color-mix(in srgb,var(--known) 45%,var(--line));color:var(--known)}
.grades .g4{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent)}
.done-hero{text-align:center;display:grid;justify-items:center;gap:12px;padding:34px 20px}

.promo{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

/* ============ PALAVRAS ============ */
.wl{display:grid;gap:0;margin-top:14px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.wr{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) auto;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);text-align:left;width:100%;transition:background .12s}

svg.ch{width:100%;height:auto;display:block;overflow:visible}

.heat-row{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}

.diff{font:400 19px/1.9 var(--f-r)}
.diff span{padding:1px 4px;border-radius:5px}
.diff .ok{background:color-mix(in srgb,var(--known) 13%,transparent)}
.diff .extra{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px}
.diff .miss{background:var(--hl2);color:#1C1400;box-shadow:inset 0 -2px 0 #C79A00}
.score{font:400 40px/1 var(--f-d)}
.rep-stage{display:grid;gap:10px;padding:22px;border-radius:18px;background:var(--surface-2);border:1px solid var(--line);transition:border-color .2s,background .2s}
.rep-stage.listen{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.rep-stage.repeat{border-color:#C79A00;background:var(--hl4)}
.rep-stage.repeat .fsub{color:#5A4A1A}
.rep-txt{font:400 clamp(22px,3.2vw,28px)/1.45 var(--f-r);transition:filter .3s}
.rep-stage.repeat .rep-txt{color:#1C1400}
.rep-bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.rep-bar i{display:block;height:100%;width:0;background:#E2A800;border-radius:6px}
.rep-lbl{font-weight:600;font-size:14px}

/* ============ línguas ============ */
.rail-lang{display:none}
@media (min-width:1000px){.rail-lang{display:flex;align-items:center;gap:10px;height:42px;margin:0 0 14px;padding:0 12px;border-radius:12px;border:1px solid var(--rail-line);color:var(--rail-ink);font-size:14px;font-weight:600;text-align:left}.rail-lang:hover{background:var(--rail-hi)}.rail-lang .lcode{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--rail-muted)}}
#text.nodrop p:first-child::first-letter{float:none;font-size:inherit;font-family:inherit;padding:0;line-height:inherit}
#text[dir="rtl"]{font-family:var(--f-r),'Noto Naskh Arabic','Geeza Pro','Segoe UI',Tahoma,sans-serif;line-height:2.2}
#text.cjk{line-height:2.2;letter-spacing:.02em}
#text.cjk .w{margin:0;padding:.04em .02em}
#text[dir="rtl"] .sbtn{margin-left:0;margin-right:.1em}
.llist{display:grid;gap:6px;max-height:52vh;overflow:auto;margin:0 -4px;padding:0 4px}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.lrow:hover{border-color:var(--line-2)}
.lrow.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.lrow .ln,.lcard .ln{font:400 20px/1.2 var(--f-d)}
.lb{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.lb .pill{height:22px;font-size:11.5px}
.lgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.lcard{display:grid;gap:4px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left}
.lcard.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.lcard .lst{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.lcard .lst b{color:var(--ink);font-weight:700}

/* ============ modal / toast ============ */
.modal{position:fixed;inset:0;z-index:60;background:rgba(6,9,16,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:end center;padding:0;animation:fade .2s}
@media (min-width:640px){.modal{place-items:center;padding:20px}}
@keyframes fade{from{opacity:0}}
.mcard{width:100%;max-width:600px;max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:24px 20px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;box-shadow:var(--shadow-lg);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media (min-width:640px){.mcard{border-radius:24px;padding:28px}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.mcard h2{font:400 30px/1.05 var(--f-d)}
.mhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.field{display:grid;gap:7px}
.field>label,.flbl{font-weight:600;font-size:13.5px}
.field .hint{font-size:12.5px;color:var(--muted)}
.inp,.field select,.field input[type=text],.field input[type=password],.field input[type=number],.field textarea{width:100%;height:42px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2)}
.field textarea{height:auto;min-height:150px;padding:12px;font:400 16px/1.55 var(--f-r);resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.set-sec{display:grid;gap:12px;padding-top:16px;border-top:1px solid var(--line)}
.set-sec h3{font:400 20px/1.1 var(--f-d)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.sw-t{position:relative;width:44px;height:26px;flex:none}
.sw-t input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw-t span{position:absolute;inset:0;border-radius:99px;background:var(--line-2);transition:background .2s;pointer-events:none}
.sw-t span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw-t input:checked+span{background:var(--accent)}
.sw-t input:checked+span::after{transform:translateX(18px)}
.sw-t input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.road{display:grid;gap:10px;font-size:14px}
.road div{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.qopt{display:grid;gap:8px}
.ring-wrap{display:grid;place-items:center;position:relative}
.ring-wrap .c{position:absolute;text-align:center}
.toast{position:fixed;z-index:80;left:50%;bottom:calc(var(--nav) + 20px);transform:translate(-50%,16px);display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s;max-width:calc(100vw - 32px);box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:1000px){.toast{bottom:28px;left:calc(50% + 126px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
