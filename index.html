/* ---------- progresso: novos gráficos ---------- */
const CEFR=[[0,'A1'],[500,'A2'],[1000,'B1'],[2000,'B2'],[4000,'C1'],[8000,'C2']];
/* palavras conhecidas por semana (8 semanas), a partir dos registos diários; null = ainda sem registo */
const GROW=()=>{const t=TD(),h=(S.kh&&S.kh[tl()])||{};const days=Object.keys(h).map(Number).sort((a,b)=>a-b);const out=[];
  for(let w=7;w>=0;w--){const d=t-w*7;if(w===0){out.push(knownCount());continue;}let v=null;days.forEach(x=>{if(x<=d)v=h[x];});out.push(v);}return out;};
function etaHTML(){
  const k=knownCount();let idx=0;CEFR.forEach((x,i)=>{if(k>=x[0])idx=i;});const nx=CEFR[idx+1];if(!nx)return'';
  const g=GROW();const fi=g.findIndex(v=>v!=null);if(fi<0||fi>=g.length-2)return`<div class="eta"><span class="muted">A previsão do próximo nível aparece depois de duas semanas de uso.</span></div>`;
  const rate=(g[g.length-1]-g[fi])/(g.length-1-fi);if(rate<=0)return`<div class="eta"><span class="muted">Marca palavras como conhecidas para veres quando chegas a ${nx[1]}.</span></div>`;const wk=Math.ceil((nx[0]-k)/rate);
  const d=new Date((TD()+wk*7)*DAY);
  return`<div class="eta"><span class="si">${I('target')}</span><span><b>${nx[1]} em cerca de ${wk} semanas</b><br><span class="muted" style="font-size:13px">Ao teu ritmo de ~${Math.round(rate)} palavras novas por semana, por volta de ${MO[d.getUTCMonth()]} de ${d.getUTCFullYear()}.</span></span></div>`;
}
function forecastChart(){
  const t=TD();const c=[0,0,0,0,0,0,0];
  learningList().forEach(l=>{const v=S.vocab[l];if(!v.srs)return;const d=Math.max(0,v.srs.due-t);if(d<7)c[d]++;});
  const mx=Math.max(4,Math.max.apply(null,c));const x0=8,x1=600,y0=22,y1=128,bw=(x1-x0)/7;
  let s=`<svg class="ch" viewBox="0 0 610 150" role="img" aria-label="Cartões a rever nos próximos 7 dias">`;
  s+=`<line class="gl" x1="${x0}" x2="${x1}" y1="${y1}" y2="${y1}"/>`;
  c.forEach((v,i)=>{const h=(v/mx)*(y1-y0),x=x0+i*bw+8,w=bw-16;s+=`<rect class="${i===0?'bt':'b'}" x="${x.toFixed(1)}" y="${(y1-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="5"/><text class="em" x="${(x+w/2).toFixed(1)}" y="${(y1-h-7).toFixed(1)}" text-anchor="middle">${v}</text><text x="${(x+w/2).toFixed(1)}" y="${y1+16}" text-anchor="middle">${i===0?'hoje':i===1?'amanhã':WD[dow(t+i)].slice(0,3)}</text>`;});
  return{svg:s+'</svg>',total:c.reduce((a,b)=>a+b,0),peak:c.indexOf(Math.max.apply(null,c))};
}
function forgetCurve(){
  const B=[[1,1,'1 dia'],[2,3,'2–3 dias'],[4,7,'4–7 dias'],[8,14,'1–2 sem.'],[15,999,'15+ dias']];
  const EB=[33,28,25,23,21];
  const st=B.map(b=>{let n=0,ok=0;(S.log||[]).forEach(r=>{if(r[1]>=b[0]&&r[1]<=b[1]){n++;ok+=r[2];}});return{n:n,p:n?Math.round(ok/n*100):null};});
  const x0=42,x1=590,y0=14,y1=150,X=i=>x0+i*(x1-x0)/(B.length-1),Y=p=>y1-(p/100)*(y1-y0);
  let s=`<svg class="ch" viewBox="0 0 610 178" role="img" aria-label="Percentagem de palavras lembradas por intervalo desde a última revisão">`;
  [0,25,50,75,100].forEach(v=>{s+=`<line class="gl" x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${x0-8}" y="${Y(v)+3}" text-anchor="end">${v}%</text>`;});

function practicePool(){
  const lids=Object.keys(S.texts).concat([cur]).concat(lessonsOf(tl()).map(L=>L.id));const out=[];
  LESSONS.forEach(L=>{if(lids.indexOf(L.id)<0||L.lang!==tl())return;sentsOf(L).forEach(sid=>{const s=SENT[sid];if(!s||!s.pt)return;const n=TOK[sid].filter(t=>t.w).length;if(n>=5&&n<=20&&out.indexOf(sid)<0)out.push(sid);});});
  if(!out.length)lessonsOf(tl()).forEach(L=>sentsOf(L).forEach(sid=>{if(SENT[sid].pt&&out.length<20)out.push(sid);}));
  const ll=learningList();out.sort((a,b)=>(TOK[b].some(t=>t.w&&ll.indexOf(t.l)>=0)?1:0)-(TOK[a].some(t=>t.w&&ll.indexOf(t.l)>=0)?1:0));
  return out;
}
function norm(s){const lg=tl();return segWords(String(s).replace(/[’‘]/g,"'"),lg).filter(t=>t.w).map(t=>lowerL(t.w,lg));}
function diff(target,input){
  const A=norm(target),B=norm(input);const n=A.length,m=B.length;const dp=[];
  for(let i=0;i<=n;i++){dp.push(new Array(m+1).fill(0));}
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const okA=new Array(n).fill(false),okB=new Array(m).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(A[i]===B[j]){okA[i]=okB[j]=true;i++;j++;}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++;}
  return{A:A,B:B,okA:okA,okB:okB,score:n?Math.round(dp[0][0]/n*100):0};
}
function diffHTML(d){
  return`<div class="dlab">A tua resposta</div><div class="diff" dir="auto">${d.B.length?d.B.map((w,k)=>`<span class="${d.okB[k]?'ok':'extra'}">${esc(w)}</span>`).join(' '):'<span class="muted">(vazio)</span>'}</div>
  <div class="dlab">Frase original</div><div class="diff" dir="auto">${d.A.map((w,k)=>`<span class="${d.okA[k]?'ok':'miss'}">${esc(w)}</span>`).join(' ')}</div>`;
}
function verdict(p){return p>=95?['Perfeito','ok']:p>=75?['Quase lá','ok']:p>=45?['Bom começo','warn']:['Vamos rever','bad'];}
function feedback(d,sid){
  const miss=[];d.A.forEach((w,k)=>{if(!d.okA[k]&&miss.indexOf(w)<0)miss.push(w);});
  const lem=w=>{const t=TOK[sid].find(t=>t.w&&lowerL(t.w,tl()).replace(/’/g,"'")===w);return t?t.l:w;};
  const lines=miss.slice(0,5).map(w=>{const l=lem(w);const e=info(l);return`• ${w}${e.pt?' = '+e.pt.split(';')[0]:''}`;});
  let t=d.score>=95?'Está certíssimo. A frase está igual à original.':miss.length?`Faltaram ${miss.length} ${miss.length===1?'palavra':'palavras'} da frase original:\n${lines.join('\n')}`:'Tens todas as palavras, mas há palavras a mais ou fora de ordem.';
  return t;
}

function repRun(){

function detectLang(text){
  const t=String(text).slice(0,6000);const c={};
  const R=[['ja',/[\u3040-\u30ff]/g],['ko',/[\uac00-\ud7af]/g],['zh',/[\u4e00-\u9fff]/g],['ar',/[\u0600-\u06ff]/g],['he',/[\u0590-\u05ff]/g],['ru',/[\u0400-\u04ff]/g],['el',/[\u0370-\u03ff]/g],['th',/[\u0e00-\u0e7f]/g],['hi',/[\u0900-\u097f]/g],['bn',/[\u0980-\u09ff]/g],['ta',/[\u0b80-\u0bff]/g],['ka',/[\u10a0-\u10ff]/g],['hy',/[\u0530-\u058f]/g],['am',/[\u1200-\u137f]/g],['km',/[\u1780-\u17ff]/g],['lo',/[\u0e80-\u0eff]/g],['my',/[\u1000-\u109f]/g],['latin',/[A-Za-zÀ-ɏ]/g]];
  R.forEach(r=>{c[r[0]]=(t.match(r[1])||[]).length;});

  if(best!=='latin')return best;
  const words=t.toLowerCase().split(/[^a-zà-ɏ']+/).filter(Boolean).slice(0,1500);const sc={};
  words.forEach(w=>{Object.keys(STOPS).forEach(k=>{if(STOPS[k].has(w))sc[k]=(sc[k]||0)+1;});});
  if(/[ãõ]/.test(t))sc.pt=(sc.pt||0)+5;if(/ñ|¿|¡/.test(t))sc.es=(sc.es||0)+5;if(/ß/.test(t))sc.de=(sc.de||0)+5;if(/[ğış]/.test(t))sc.tr=(sc.tr||0)+5;if(/[ąęłńśźż]/.test(t))sc.pl=(sc.pl||0)+5;
  let bl='en',bs=0;Object.keys(sc).forEach(k=>{if(sc[k]>bs){bs=sc[k];bl=k;}});
  return bl;
}

/* ---------- ZIP (EPUB, DOCX, ODT) sem bibliotecas ---------- */
async function unzip(buf){
  const dv=new DataView(buf);let e=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break;}}
  if(e<0)throw new Error('O ficheiro não parece um arquivo válido (zip).');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};const td=new TextDecoder();
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),fl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
    files[td.decode(new Uint8Array(buf,p+46,fl))]={method:method,csize:csize,lho:lho};p+=46+fl+xl+cl;
  }
  return{names:Object.keys(files),text:async function(name){
    const f=files[name];if(!f)return null;
    const ln=dv.getUint16(f.lho+26,true),lx=dv.getUint16(f.lho+28,true);const data=new Uint8Array(buf,f.lho+30+ln+lx,f.csize);
    let out;
    if(f.method===0)out=data;
    else if(f.method===8){
      if(typeof DecompressionStream==='undefined')throw new Error('Este navegador não consegue abrir ficheiros comprimidos. Atualiza-o ou usa o Chrome.');
      const st=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));out=new Uint8Array(await new Response(st).arrayBuffer());
    }else throw new Error('Compressão não suportada.');
    return new TextDecoder('utf-8').decode(out);
  }};
}
function xml(s,type){return new DOMParser().parseFromString(s,type||'application/xml');}
function blocksFromDoc(doc){
  doc.querySelectorAll('script,style,nav,header,footer,aside,noscript,svg,figure figcaption').forEach(n=>n.remove());
  const out=[];const B='p,h1,h2,h3,h4,h5,h6,li,blockquote,pre,dd,dt,td';
  const els=doc.querySelectorAll(B);
  if(els.length){els.forEach(el=>{if(el.querySelector(B))return;const t=el.textContent.replace(/\s+/g,' ').trim();if(t)out.push({t:t,h:/^H[1-3]$/.test(el.tagName.toUpperCase())});});}
  else{const t=(doc.body||doc.documentElement).textContent||'';t.split(/\n\s*\n/).forEach(x=>{x=x.replace(/\s+/g,' ').trim();if(x)out.push({t:x});});}
  return out;
}
function paraText(blocks){return blocks.map(b=>b.t).join('\n\n');}

/* ---------- extratores ---------- */
async function extEPUB(buf){
  const z=await unzip(buf);
  const cont=await z.text('META-INF/container.xml');if(!cont)throw new Error('EPUB sem container.xml.');
  const rf=xml(cont).getElementsByTagNameNS('*','rootfile')[0];const opfPath=rf&&rf.getAttribute('full-path');if(!opfPath)throw new Error('EPUB sem ficheiro OPF.');
  const opf=xml(await z.text(opfPath));const dir=opfPath.indexOf('/')>=0?opfPath.slice(0,opfPath.lastIndexOf('/')+1):'';
  const title=((opf.getElementsByTagNameNS('*','title')[0]||{}).textContent||'').trim();
  const langTag=((opf.getElementsByTagNameNS('*','language')[0]||{}).textContent||'').trim();
  const man={};Array.from(opf.getElementsByTagNameNS('*','item')).forEach(it=>{man[it.getAttribute('id')]={href:it.getAttribute('href'),props:it.getAttribute('properties')||'',type:it.getAttribute('media-type')||''};});
  const chapters=[];
  for(const ir of Array.from(opf.getElementsByTagNameNS('*','itemref'))){
    const m=man[ir.getAttribute('idref')];if(!m||/nav/.test(m.props)||!/html/.test(m.type))continue;
    const path=decodeURIComponent((dir+m.href).replace(/\/\.\//g,'/'));
    let src=await z.text(path);if(!src)continue;
    let doc=xml(src,'application/xhtml+xml');if(doc.getElementsByTagName('parsererror').length)doc=xml(src,'text/html');
    const bl=blocksFromDoc(doc);const txt=paraText(bl);if(txt.length<40)continue;
    const h=bl.find(b=>b.h);chapters.push({title:h?h.t.slice(0,80):'',text:txt});
  }
  if(!chapters.length)throw new Error('Não encontrei texto neste EPUB.');
  return{title:title,chapters:chapters,lang:langTag?langTag.split('-')[0].toLowerCase():null};
}
async function extDOCX(buf){
  const z=await unzip(buf);const s=await z.text('word/document.xml');if(!s)throw new Error('DOCX sem documento.');
  const d=xml(s);const out=[];
  Array.from(d.getElementsByTagNameNS('*','p')).forEach(p=>{let t='';p.querySelectorAll('*').forEach(n=>{if(n.localName==='t')t+=n.textContent;else if(n.localName==='tab')t+=' ';else if(n.localName==='br')t+=' ';});t=t.replace(/\s+/g,' ').trim();if(t)out.push(t);});
  const core=await z.text('docProps/core.xml');const title=core?((xml(core).getElementsByTagNameNS('*','title')[0]||{}).textContent||''):'';
  return{title:title.trim(),chapters:[{title:'',text:out.join('\n\n')}]};
}
async function extODT(buf){
  const z=await unzip(buf);const s=await z.text('content.xml');if(!s)throw new Error('ODT sem conteúdo.');
  const d=xml(s);const out=[];
  Array.from(d.getElementsByTagNameNS('*','p')).concat(Array.from(d.getElementsByTagNameNS('*','h'))).forEach(p=>{const t=p.textContent.replace(/\s+/g,' ').trim();if(t)out.push(t);});
  return{title:'',chapters:[{title:'',text:out.join('\n\n')}]};
}
function extHTML(s){const d=xml(s,'text/html');const t=(d.querySelector('title')||{}).textContent||'';return{title:t.trim(),chapters:[{title:'',text:paraText(blocksFromDoc(d))}]};}
function extSubs(s){
  const lines=s.replace(/\r/g,'').split('\n').filter(l=>{l=l.trim();return l&&!/^\d+$/.test(l)&&l.indexOf('-->')<0&&!/^WEBVTT/.test(l)&&!/^(NOTE|STYLE|REGION)\b/.test(l);});
  const txt=lines.map(l=>l.replace(/<[^>]+>/g,'').replace(/\{[^}]+\}/g,'').replace(/^-\s*/,'').trim()).filter(Boolean);
  const out=[];txt.forEach(l=>{if(out.length&&!/[.!?。！？…]["”']?$/.test(out[out.length-1]))out[out.length-1]+=' '+l;else out.push(l);});
  return{title:'',chapters:[{title:'',text:out.join('\n')}]};
}
function extMD(s){
  let fmTitle='';const fm=s.match(/^---\s*\n([\s\S]*?)\n---\s*\n/);if(fm){const tm=fm[1].match(/^title:\s*["']?(.+?)["']?\s*$/m);if(tm)fmTitle=tm[1];s=s.slice(fm[0].length);}
  const t=s.replace(/```[\s\S]*?```/g,'').replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/^#{1,6}\s*/gm,'').replace(/^\s*[-*+]\s+/gm,'').replace(/^\s*>\s?/gm,'').replace(/[*_`~]{1,3}/g,'');
  const h=s.match(/^#\s+(.+)$/m);return{title:fmTitle||(h?h[1].trim():''),chapters:[{title:'',text:t}]};

function extRTF(s){
  let t=s.replace(/\\'([0-9a-f]{2})/gi,(m,h)=>String.fromCharCode(parseInt(h,16))).replace(/\\u(-?\d+)\??/g,(m,n)=>String.fromCharCode((+n+65536)%65536));
  t=t.replace(/\{\\\*[^{}]*\}/g,'').replace(/\{\\(fonttbl|colortbl|stylesheet|info)[\s\S]*?\}\}/g,'').replace(/\\par[d]?\b/g,'\n\n').replace(/\\[a-z]+-?\d* ?/gi,'').replace(/[{}]/g,'');
  t=t.split('\n').filter(l=>!/^[\s;:,.]*$/.test(l)||l==='').join('\n');
  return{title:'',chapters:[{title:'',text:t}]};
}
function loadScriptMod(url){return import(url);}
async function loadPdfjs(){
  if(window.__pdfjs)return window.__pdfjs;
  let lib;
  try{lib=await loadScriptMod(PDFJS_BASE+'pdf.min.mjs');}catch(e){throw new Error('Não consegui carregar o leitor de PDF. Verifica a ligação à internet e tenta outra vez.');}
  try{globalThis.pdfjsWorker=await loadScriptMod(PDFJS_BASE+'pdf.worker.min.mjs');}catch(e){}
  lib.GlobalWorkerOptions.workerSrc=PDFJS_BASE+'pdf.worker.min.mjs';
  window.__pdfjs=lib;return lib;
}
async function extPDF(buf,progress){
  const lib=await loadPdfjs();
  const pdf=await lib.getDocument({data:new Uint8Array(buf),isEvalSupported:false,useSystemFonts:true}).promise;
  let meta={};try{meta=(await pdf.getMetadata()).info||{};}catch(e){}
  const n=Math.min(pdf.numPages,600);const paras=[];let chars=0;
  for(let i=1;i<=n;i++){
    if(progress)progress(i,n);
    const page=await pdf.getPage(i);const tc=await page.getTextContent();
    let line='',lastY=null,lastH=12,buf2=[];
    tc.items.forEach(it=>{
      if(!('str' in it))return;const y=it.transform?it.transform[5]:0;const h=Math.abs(it.height||(it.transform?it.transform[3]:12))||12;
      if(lastY!==null&&Math.abs(y-lastY)>h*1.9){if(line.trim())buf2.push(line.trim());buf2.push('');line='';}
      else if(lastY!==null&&Math.abs(y-lastY)>h*.5){line+=' ';}
      line+=it.str;if(it.hasEOL)line+=' ';lastY=y;lastH=h;
    });
    if(line.trim())buf2.push(line.trim());
    let cur2='';buf2.forEach(l=>{if(l===''){if(cur2.trim())paras.push(cur2.trim());cur2='';}else cur2+=(cur2&&!/-$/.test(cur2)?' ':'')+l.replace(/-$/,'');});
    if(cur2.trim())paras.push(cur2.trim());
    chars+=tc.items.reduce((a,it)=>a+((it.str||'').length),0);
  }
  if(chars<30)throw new Error('Este PDF parece digitalizado (só imagens). Ler texto em imagens (OCR) fica para a versão real.');
  const clean=paras.map(p=>p.replace(/\s+/g,' ').trim()).filter(p=>p&&!/^\d{1,4}$/.test(p));
  return{title:(meta.Title||'').trim(),chapters:[{title:'',text:clean.join('\n\n')}],pages:pdf.numPages};
}
function fmtOf(name){const m=String(name).toLowerCase().match(/\.([a-z0-9]+)$/);return m?m[1]:'txt';}
async function extractFile(f,progress){
  const ext=fmtOf(f.name);
  if(/^(png|jpe?g|webp|gif|heic|bmp|tiff?)$/.test(ext))throw new Error('Imagens precisam de OCR para extrair o texto. Fica para a versão real.');
  if(/^(mp3|m4a|wav|ogg|mp4|webm)$/.test(ext))throw new Error('Áudio e vídeo precisam de transcrição (Whisper). Fica para a versão real.');
  if(ext==='doc')throw new Error('O formato .doc antigo não é suportado. Guarda o ficheiro como .docx no Word e tenta outra vez.');
  if(ext==='mobi'||ext==='azw3')throw new Error('Ficheiros Kindle (.mobi/.azw3) não são suportados. Converte para EPUB com o Calibre e tenta outra vez.');
  if(ext==='pdf')return Object.assign(await extPDF(await f.arrayBuffer(),progress),{fmt:'PDF'});
  if(ext==='epub')return Object.assign(await extEPUB(await f.arrayBuffer()),{fmt:'EPUB'});
  if(ext==='docx')return Object.assign(await extDOCX(await f.arrayBuffer()),{fmt:'Word'});
  if(ext==='odt')return Object.assign(await extODT(await f.arrayBuffer()),{fmt:'OpenDocument'});
  const s=await f.text();
  if(ext==='html'||ext==='htm'||ext==='xhtml')return Object.assign(extHTML(s),{fmt:'HTML'});
  if(ext==='srt'||ext==='vtt')return Object.assign(extSubs(s),{fmt:'Legendas'});
  if(ext==='md'||ext==='markdown')return Object.assign(extMD(s),{fmt:'Markdown'});
  if(ext==='rtf')return Object.assign(extRTF(s),{fmt:'RTF'});
  return{title:'',chapters:[{title:'',text:s}],fmt:'Texto'};
}

/* ---------- frases e partes ---------- */
function splitSentences(text){
  const paras=String(text).replace(/\r/g,'').split(/\n\s*\n|\n(?=[A-ZÀ-Ý"“«—–-])/).map(p=>p.replace(/\s+/g,' ').trim()).filter(Boolean);
  const out=[];
  paras.forEach(p=>{
    const ss=(p.match(/[^.!?。！？؟…]+(?:[.!?。！？؟…]+["”’'»」』)]*|$)/g)||[p]).map(s=>s.trim()).filter(Boolean);
    const merged=[];ss.forEach(s=>{if(merged.length&&(s.length<3||/^(Mr|Mrs|Ms|Dr|Sr|Sra|St|vs|etc|No|p)\.$/i.test(merged[merged.length-1].split(' ').pop())))merged[merged.length-1]+=' '+s;else merged.push(s);});
    const LET=/[A-Za-z0-9\u00C0-\uFFFF]/;
    merged.filter(s=>LET.test(s)).forEach((s,i)=>{if(s.length>600){for(let k=0;k<s.length;k+=400)out.push({en:s.slice(k,k+400),p:i===0&&k===0?1:0});}else out.push({en:s,p:i===0?1:0});});
  });
  return out;
}
function planImport(parsed){
  const parts=[];
  parsed.chapters.forEach((ch,ci)=>{
    const ss=splitSentences(ch.text);if(!ss.length)return;
    for(let k=0;k<ss.length;k+=PART_SENTS){parts.push({title:ch.title,sents:ss.slice(k,k+PART_SENTS)});}
  });
  return parts.slice(0,MAX_PARTS);
}

async function askAI(prompt,o){
  o=o||{};const src=aiProvider();
  if(src==='claude'){
    try{
      if(o.json)return await CAP.sample.json(prompt,{modelTier:o.tier||'quick'});
      const r=await CAP.sample(prompt,{modelTier:o.tier||'quick',cache:false,onText:o.onText?(x=>o.onText(x.text)):undefined});

    try{res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':gemKey()},body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:o.json?{responseMimeType:'application/json'}:{}})});}

    const j=await res.json();const parts=(((j.candidates||[])[0]||{}).content||{}).parts||[];
    const t=parts.map(p=>p.text||'').join('').trim();
    if(o.json){try{return JSON.parse(t.replace(/^```(?:json)?\s*|\s*```$/g,''));}catch(e){throw{code:'bad_json'};}}

Explica esta frase: «${SENT[G.sid].en}»
Contexto: «${ctxPara(G.sid)}»
Responde em ${nat()}, em texto simples sem markdown, com no máximo 110 palavras: a tradução natural, depois a estrutura gramatical mais importante e uma expressão ou palavra que valha a pena guardar.`;
}
function pFollow(k){
  const lg=lgOf(G.sid);
  if(G.kind==='word'){const tk=TOK[G.sid][G.i];
    if(k==='ex')return`Dá 2 frases novas e simples em ${langName(lg)} com a palavra «${label(tk.l)}» no mesmo sentido que em «${SENT[G.sid].en}». Depois de cada uma, a tradução para ${nat()}. Texto simples, sem markdown.`;
    if(k==='fam')return`Lista as formas principais da palavra «${label(tk.l)}» em ${langName(lg)} (conjugação, plural, género ou outras, conforme a classe) e 2 palavras da mesma família, cada uma com a tradução para ${nat()}. Texto simples, no máximo 80 palavras, sem markdown.`;
  }
  return null;
}
function pAsk(q){
  const lg=lgOf(G.sid);const what=G.kind==='word'?`a palavra «${TOK[G.sid][G.i].w}»`:G.kind==='phrase'?`a expressão «${phraseText(G.sid,G.a,G.b)}»`:'esta frase';
  return`És um tutor paciente de ${langName(lg)} para alguém cuja língua materna é ${nat()}. O aluno está a ler ${what}, na frase «${SENT[G.sid].en}» (contexto: «${ctxPara(G.sid)}»).
Pergunta do aluno: ${q}
Responde em ${nat()}, em texto simples sem markdown, com no máximo 120 palavras.`;
}

/* ---------- conversa no painel ---------- */
function realAI(prompt,q,key){
  const g=G;if(!g)return;if(q)g.chat.push({me:q});ensureAI();const src=aiProvider();
  if(key&&S.ai.x[key]){g.chat.push({ai:S.ai.x[key],state:'done',src:src,cached:true});renderGloss();scrollGloss();return;}
  const m={ai:'',state:'load',src:src,n:0};g.chat.push(m);renderGloss();scrollGloss();
  askAI(prompt,{onText:t=>{if(G!==g)return;m.ai=t;m.n=t.length;if(m.state==='load'){m.state='stream';renderGloss();}else{const el=document.getElementById('ai-typing');if(el)el.textContent=t;}scrollGloss();}})
  .then(t=>{m.ai=String(t||m.ai||'').trim();m.state='done';if(key&&m.ai){S.ai.x[key]=m.ai;trimCache();save();}if(G===g){renderGloss();scrollGloss();}})
  .catch(e=>{m.state='done';m.err=true;m.ai=aiErrText(e);if(G===g)renderGloss();});
}

/* ---------- traduções que faltam ---------- */
var LOOKING={},TRANSL={};
function autoLookup(l,sid,i){
  ensureAI();if(LOOKING[l]||S.ai.d[l]||!aiProvider())return;
  const tk=TOK[sid][i],lg=lgOf(sid);LOOKING[l]=1;
  askAI(`Palavra em ${langName(lg)}: «${tk.w}». Frase: «${SENT[sid].en}».
Responde só com JSON, sem texto à volta, neste formato:
{"pt":"tradução curta para ${nat()} com o sentido nesta frase","lemma":"forma base (de dicionário)","pos":"subst., verbo, adj., adv., prep., conj., pron. ou outro","reading":"pronúncia em IPA; para escritas não latinas, a romanização"}`,{json:true})
  .then(o=>{delete LOOKING[l];if(o&&o.pt){S.ai.d[l]={pt:String(o.pt),pos:o.pos?String(o.pos):null,ipa:o.reading?String(o.reading):null,lemma:o.lemma?String(o.lemma):null};save();}if(G&&G.kind==='word'&&TOK[G.sid][G.i].l===l)renderGloss();})
  .catch(e=>{delete LOOKING[l];LOOKING[l+'#err']=aiErrText(e);if(G)renderGloss();});
}
function translateSent(sid){
  ensureAI();if(TRANSL[sid]||SENT[sid].pt||!aiProvider())return;TRANSL[sid]=1;
  askAI(`Traduz para ${nat()} esta frase em ${langName(lgOf(sid))}, de forma natural. Responde só com a tradução, sem aspas nem notas.

${SENT[sid].en}`).then(t=>{delete TRANSL[sid];t=String(t||'').trim();if(t){S.ai.s[sid]=t;SENT[sid].pt=t;save();}if(G&&G.sid===sid)renderGloss();})
  .catch(e=>{delete TRANSL[sid];toast(aiErrText(e));});
}
function applyAITranslations(){ensureAI();Object.keys(S.ai.s).forEach(sid=>{if(SENT[sid]&&!SENT[sid].pt)SENT[sid].pt=S.ai.s[sid];});}

/* ---------- prática: correção pela IA ---------- */
function aiCheckPractice(){
  if(!aiProvider()||PR.mode!=='tr')return;
  const sd=SENT[PR.sid],lg=lgOf(PR.sid),val=PR.val,sid=PR.sid;PR.ai={state:'load'};
  askAI(`Um aluno de ${langName(lg)} (língua materna: ${nat()}) traduziu uma frase.
Frase em ${nat()}: «${sd.pt}»
Tradução de referência: «${sd.en}»
Resposta do aluno: «${val}»
Avalia o sentido e a gramática. Aceita traduções diferentes da referência se estiverem corretas e naturais.
Responde só com JSON: {"score": número de 0 a 100, "correct": true ou false, "feedback": "2 ou 3 frases em ${nat()} a explicar os erros, ou a confirmar que está certo", "better": "a resposta do aluno corrigida, mantendo as palavras dele sempre que possível"}`,{json:true,tier:'default'})
  .then(o=>{if(PR.sid!==sid)return;PR.ai={state:'done',d:o||{}};renderPractice();})
  .catch(e=>{if(PR.sid!==sid)return;PR.ai={state:'err',msg:aiErrText(e)};renderPractice();});
}
function aiPracticeHTML(){
  if(!PR.ai)return null;
  if(PR.ai.state==='load')return`<div class="ai-card" aria-busy="true"><div class="ai-tag">${I('spark',13)} ${aiLabel(aiProvider())} a corrigir</div><div style="display:grid;gap:8px"><div class="skel" style="width:90%"></div><div class="skel" style="width:70%"></div></div></div>`;
  if(PR.ai.state==='err')return`<div class="ai-card"><div class="ai-tag">${I('spark',13)} IA</div>${esc(PR.ai.msg)}</div>`;
  const d=PR.ai.d;const sc=Math.max(0,Math.min(100,Math.round(+d.score||0)));
  return`<div class="ai-card"><div class="row between"><div class="ai-tag" style="margin:0">${I('spark',13)} Correção de ${aiLabel(aiProvider())}</div><span class="pill ${d.correct?'p-k':'p-l2'}">${d.correct?'Certo':'A melhorar'} · ${sc}/100</span></div><p style="margin-top:8px">${esc(d.feedback||'')}</p>${d.better&&!d.correct?`<p style="margin-top:8px"><b>Versão corrigida:</b> <span dir="auto" style="font-family:var(--f-r);font-size:16px">${esc(d.better)}</span></p>`:''}</div>`;
}

/* ---------- voz do Claude ---------- */
function useClaudeVoice(){return !!(CAP.tts&&!TTS_DENIED&&S.settings.voiceSrc!=='device');}
function claudeSay(text,o){
  const opts={voice:S.settings.cvoice||'buttery',rate:Math.max(.7,Math.min(1.5,o.rate||S.settings.rate||1))};
  const L=lessonById(cur);if(L&&!L.imp&&!o.free)opts.language=(o.lang||tl());
  CAP.tts.speak(String(text).slice(0,2000),opts).then(()=>{if(o.end)o.end();},e=>{
    const c=e&&e.code;if(c==='not_granted'){TTS_DENIED=true;toast('Voz do Claude desligada. A usar a voz do dispositivo.');}
    else if(c==='rate_limited')toast('Muitos pedidos de voz seguidos. Espera um pouco.');
    if(o.err)o.err(e);
  });
  return true;
}
function stopClaudeVoice(){try{if(CAP.tts)CAP.tts.stop();}catch(e){}stopAndroidVoice();}

/* ---------- ditado ---------- */
var DICT_ON=false;
function startDictation(onFinal,onState){
  if(!CAP.dict)return false;
  try{CAP.dict.onFinal(({text})=>{if(text)onFinal(text);});CAP.dict.onState(({state,reason})=>{DICT_ON=state==='listening';if(onState)onState(state,reason);});}catch(e){}
  CAP.dict.start().catch(e=>{DICT_ON=false;if(e&&e.code==='not_granted')toast('Sem acesso ao microfone. Podes continuar a escrever.');else if(e&&e.code!=='dismissed')toast('O ditado não está disponível agora.');if(onState)onState('idle','error');});
  return true;
}
function stopDictation(){try{if(CAP.dict)return CAP.dict.stop();}catch(e){}return Promise.resolve();}

/* ---------- downloads ---------- */
function canDownload(){return !!CAP.dl||!inClaude()||inAndroid();}
function saveFile(name,data){
  if(inAndroid()){let r='error';try{r=window.GlosaAndroid.save(name,String(data));}catch(e){}toast(r==='ok'?'Guardado em Transferências':r==='shared'?'Escolhe onde guardar':'Não foi possível guardar o ficheiro.',r==='ok'?'check':null);return;}
  if(CAP.dl){CAP.dl.save({filename:name,data:data}).then(()=>toast('Ficheiro guardado','check'),e=>{if(e&&(e.code==='declined'))return;toast('Não foi possível descarregar aqui.');});return;}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/plain'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}catch(e){toast('Não foi possível descarregar aqui.');}
}

/* ---------- definições ---------- */
function aiSettingsHTML(){
  const s=S.settings,src=aiProvider(),ic=inClaude();
  const aiSub=src==='claude'?'Claude · traduções e explicações reais':src==='gemini'?'Gemini · com a tua chave':ic?(AI_DENIED?'Não deste acesso. Ativa-a nas definições do Claude.':'A ligar ao Claude…'):'Desligada · respostas de exemplo';
  const claudeV=CAP.tts&&s.voiceSrc!=='device';
  const vSub=claudeV?'Vozes naturais do Claude':inAndroid()?'Do Android · mais vozes em Definições do sistema → Texto para voz':'Do dispositivo';
  const sel=(id,opts,v)=>`<select id="${id}" class="li-sel">${opts.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(v)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
  return`<section class="grp"><h4>Voz</h4><div class="list">
    <div class="li"><span>Voz<small>${esc(vSub)}</small></span>${CAP.tts?sel('s-vsrc',[['claude','Claude'],['device','Dispositivo']],claudeV?'claude':'device'):''}</div>
    ${claudeV?`<div class="li"><span>Timbre</span>${sel('s-cvoice',[['buttery','Buttery'],['airy','Airy'],['glassy','Glassy'],['rounded','Rounded']],s.cvoice||'buttery')}</div>`
      :(typeof VOICES!=='undefined'&&VOICES.length?`<div class="li"><span>Voz em inglês</span>${sel('s-voice',[['','Automática']].concat(VOICES.map(v=>[v.name,v.name])),s.voice||'')}</div>`:'')}
    <button class="li li-btn" id="s-vtest"><span class="acc">Ouvir a voz</span>${I('spk',18)}</button>
  </div></section>
  <section class="grp"><h4>Inteligência artificial</h4><div class="list">
    <div class="li"><span>IA<small>${esc(aiSub)}</small></span>${src?`<span class="ok-dot" aria-label="Ligada"></span>`:''}</div>
    ${!ic?`<details class="li-det" ${gemKey()?'':'open'}><summary class="li li-btn"><span>Chave do Gemini (grátis)</span>${I('chev',18)}</summary>
      <div class="li-body"><p class="foot" style="margin:0">Cria uma chave em <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> com a tua conta Google e cola-a aqui. Fica só neste dispositivo.</p>
      <input type="password" id="s-gkey" class="inp" placeholder="AIza…" value="${esc(gemKey())}" autocomplete="off" aria-label="Chave de API">
      <input type="text" id="s-gmodel" class="inp" value="${esc(s.gemModel||'gemini-2.5-flash')}" aria-label="Modelo">
      <div class="row"><button class="btn sm pri" id="s-gsave">Guardar</button><button class="btn sm" id="s-gtest">Testar</button>${gemKey()?'<button class="btn sm" id="s-gdel">Apagar</button>':''}</div></div></details>`:''}
  </div>${CAP.dict?`<p class="foot">O ditado pelo microfone está ativo em Praticar.</p>`:''}</section>`;
}
function bindAISettings(){
  const s=S.settings;const on=(id,ev,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener(ev,fn);};
  on('s-vsrc','change',e=>{s.voiceSrc=e.target.value;save();settingsModal();});
  on('s-cvoice','change',e=>{s.cvoice=e.target.value;save();});
  on('s-voice','change',e=>{s.voice=e.target.value;save();});
  on('s-vtest','click',()=>say(tl()==='en'?'Hello! This is how I sound when I read to you.':(SENT[sentsOf(lessonsOf(tl())[0]||LESSONS[0])[0]]||{}).en||'Hello!'));
  on('s-gsave','click',()=>{setGemKey($('#s-gkey').value.trim());s.gemModel=$('#s-gmodel').value.trim()||'gemini-2.5-flash';save();toast('Guardado','check');settingsModal();});
  on('s-gdel','click',()=>{setGemKey('');toast('Chave apagada');settingsModal();});
  on('s-gtest','click',()=>{setGemKey($('#s-gkey').value.trim());s.gemModel=$('#s-gmodel').value.trim()||'gemini-2.5-flash';save();toast('A testar…');askAI('Responde só com a palavra OK.').then(t=>toast('A IA respondeu: '+String(t).slice(0,40),'check'),e=>toast(aiErrText(e)));});
}

/* ---------- traduções em falta no painel ---------- */
function info(l){
  const r=infoBase(l);
  if(!r.pt&&S.ai&&S.ai.d&&S.ai.d[l]){const a=S.ai.d[l];return{pt:a.pt,pos:a.pos,ipa:a.ipa,ai:null,byAI:true};}
  return r;
}
function noEntryHTML(l,sid,i){
  const src=aiProvider();
  if(src){
    if(LOOKING[l+'#err'])return`<span class="muted" style="font:400 15px/1.5 var(--f-u)">${esc(LOOKING[l+'#err'])}</span>`;
    setTimeout(()=>autoLookup(l,sid,i),0);
    return`<span class="muted" style="font:400 15px/1.5 var(--f-u)">${I('spark',14)} A traduzir com ${aiLabel(src)}…</span>`;
  }
  return`<span class="muted" style="font:400 15px/1.5 var(--f-u)">Sem tradução para esta palavra. ${inClaude()?'A IA do Claude traduz automaticamente quando estiver ligada.':'Adiciona uma chave grátis do Gemini em Definições → IA e voz para traduzir qualquer palavra.'}</span>`;
}
function sentTrHTML(sid,small){
  const src=aiProvider();
  if(src){setTimeout(()=>translateSent(sid),0);return`<span class="muted" style="font:400 ${small?14:15}px/1.5 var(--f-u)">${I('spark',14)} A traduzir com ${aiLabel(src)}…</span>`;}
  return`<span class="muted" style="font:400 ${small?14:15}px/1.5 var(--f-u)">Sem tradução para esta frase. ${inClaude()?'A IA do Claude traduz quando estiver ligada.':'Adiciona uma chave do Gemini em Definições → IA e voz.'}</span>`;
}

/* ---------- app Android (window.GlosaAndroid) ---------- */
var TTSN=0,TTSCB={};
function inAndroid(){try{return !!window.GlosaAndroid;}catch(e){return false;}}
window.__glosaTTS=function(id,st){const o=TTSCB[id];delete TTSCB[id];if(!o)return;if(st==='done'){if(o.end)o.end();}else if(o.err)o.err();};
function androidSay(text,o){
  const lg=o.lang||tl();const id='u'+(++TTSN);TTSCB[id]=o;
  let r='error';try{r=window.GlosaAndroid.speak(String(text),BCP[lg]||lg,Math.max(.5,Math.min(2,o.rate||S.settings.rate||1)),id);}catch(e){}
  if(r==='ok')return true;
  delete TTSCB[id];
  if(r==='nolang')toast('O Android não tem voz para '+langName(lg).toLowerCase()+'. Instala-a em Definições → Sistema → Idiomas → Texto para voz.');
  else if(r==='loading')toast('A voz ainda está a carregar. Tenta outra vez.');
  else toast('A voz não está disponível.');
  return false;
}
function stopAndroidVoice(){try{if(inAndroid())window.GlosaAndroid.stop();}catch(e){}}

/* ---------- expressões (palavras juntas) ---------- */
function pPhraseExplain(){
  const lg=lgOf(G.sid),txt=phraseText(G.sid,G.a,G.b);
  return`És um tutor paciente de ${langName(lg)} para alguém cuja língua materna é ${nat()}.
O aluno juntou estas palavras: «${txt}», na frase «${SENT[G.sid].en}» (contexto: «${ctxPara(G.sid)}»).
Responde em ${nat()}, em texto simples sem markdown, com no máximo 100 palavras e três partes separadas por uma linha em branco:
1) o que quer dizer aqui e se é um phrasal verb, uma expressão fixa ou só palavras soltas;
2) outros sentidos comuns da mesma expressão, se houver;
3) um exemplo curto e novo em ${langName(lg)}, com a tradução.`;
}
function phraseLookup(key,txt,sid){
  ensureAI();if(LOOKING[key]||S.ai.d[key]||!aiProvider())return;LOOKING[key]=1;
  askAI(`Expressão em ${langName(lgOf(sid))}: «${txt}». Frase: «${SENT[sid].en}».
Responde só com JSON, sem texto à volta: {"pt":"tradução curta e natural para ${nat()} com o sentido nesta frase","kind":"phrasal verb, expressão idiomática, colocação ou palavras soltas"}`,{json:true})
  .then(o=>{delete LOOKING[key];if(o&&o.pt){S.ai.d[key]={pt:String(o.pt),pos:o.kind?String(o.kind):'expressão',ipa:null};if(S.vocab[key]&&!S.vocab[key].pt)S.vocab[key].pt=String(o.pt);save();}if(G&&G.kind==='phrase')renderGloss();})
  .catch(e=>{delete LOOKING[key];LOOKING[key+'#err']=aiErrText(e);if(G)renderGloss();});
}
function phraseTrHTML(key,txt,sid){
  const src=aiProvider();
  if(src){if(LOOKING[key+'#err'])return`<span class="muted" style="font:400 15px/1.5 var(--f-u)">${esc(LOOKING[key+'#err'])}</span>`;setTimeout(()=>phraseLookup(key,txt,sid),0);return`<span class="muted" style="font:400 15px/1.5 var(--f-u)">A traduzir com ${aiLabel(src)}…</span>`;}
  return`<span class="muted" style="font:400 15px/1.5 var(--f-u)">Sem tradução para esta combinação. ${inClaude()?'A IA do Claude traduz quando estiver ligada.':'Adiciona uma chave grátis do Gemini em Definições → IA e voz para traduzir expressões.'}</span>`;
}

let started=false;
function start(d){
  if(started)return;started=true;d=d||{};
  if(d.cur&&lessonById(d.cur))cur=d.cur;
  applyTheme();applyAITranslations();initCaps();
  go(d.view||fromHash()||'home',true);
}
try{
  const H=window.claude&&window.claude.hot;
  if(H&&H.snapshot)H.snapshot(()=>({view:view,cur:cur}));
  if(H&&H.ready){H.ready(start);setTimeout(()=>start({}),1500);}
  else start((H&&H.data)||{});
}catch(e){start({});}

</script>
