<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Schibsted+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  /* Glosa — editorial reading room.
     One serif (Newsreader) for display and reading, one grotesk for interface.
     Paper, ink, hairlines; a single cobalt accent; marker yellow only on words being learned. */
  --bg:#F7F7F4; --surface:#FFFFFF; --surface-2:#F0F0EC; --sheet:#FFFFFF;
  --ink:#141413; --ink-2:#3D3D3A; --muted:#86867F; --line:#E4E4DE; --line-2:#CFCFC8;
  --accent:#2A43D4; --accent-ink:#FFFFFF; --accent-soft:#EDF0FB;
  --hl1:#F4D35E; --hl2:#F6DD82; --hl3:#F9E8AE; --hl4:#FCF3D7;
  --new:#2A43D4; --new-bg:#EEF1FB;
  --known:#2E7A52; --bad:#BF3B2B; --warn:#A8721A;
  --f-d:'Newsreader',Georgia,'Times New Roman',serif;
  --f-r:'Newsreader',Georgia,'Times New Roman',serif;
  --f-u:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --nav:64px; --rad:10px;
  --shadow:none; --shadow-lg:0 24px 60px -24px rgba(20,20,19,.28),0 2px 6px rgba(20,20,19,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121211; --surface:#191918; --surface-2:#21211F; --sheet:#171716;
    --ink:#ECECE7; --ink-2:#C6C6C0; --muted:#8E8E87; --line:#2A2A28; --line-2:#3B3B38;
    --accent:#93A3FF; --accent-ink:#121211; --accent-soft:#1F2547;
    --hl1:#7A6416; --hl2:#655318; --hl3:#4F4319; --hl4:#3A3319;
    --new:#93A3FF; --new-bg:#1E2342; --known:#6CC495; --bad:#F08A7C; --warn:#E0B060;
    --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121211; --surface:#191918; --surface-2:#21211F; --sheet:#171716;
  --ink:#ECECE7; --ink-2:#C6C6C0; --muted:#8E8E87; --line:#2A2A28; --line-2:#3B3B38;
  --accent:#93A3FF; --accent-ink:#121211; --accent-soft:#1F2547;
  --hl1:#7A6416; --hl2:#655318; --hl3:#4F4319; --hl4:#3A3319;
  --new:#93A3FF; --new-bg:#1E2342; --known:#6CC495; --bad:#F08A7C; --warn:#E0B060;
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7);
  color-scheme:dark;
}
.sheet[data-r="sepia"]{--sheet:#F5EFE2;--bg:#F5EFE2;--ink:#33291C;--ink-2:#54473A;--muted:#8C7D68;--line:#E3D8C3;--new-bg:transparent;--hl4:#F3E4B8;--surface-2:#EDE4D2;color:var(--ink)}
.sheet[data-r="night"]{--sheet:#131416;--bg:#131416;--ink:#D9D5CB;--ink-2:#B9B4A8;--muted:#8A867C;--line:#26282C;--new:#9AA8FF;--new-bg:transparent;--hl1:#7A6416;--hl2:#655318;--hl3:#4F4319;--hl4:#3A3319;--surface-2:#1C1D20;color:var(--ink)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-u);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
input[type=range],input[type=checkbox]{accent-color:var(--ink)}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px;border-radius:4px}
h1,h2,h3,h4{margin:0;font-weight:400;text-wrap:balance;line-height:1.1}
p{margin:0}
::selection{background:var(--accent-soft)}
.d{font-family:var(--f-d)}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.eyebrow{font:500 11px/1.4 var(--f-u);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
kbd{font:500 10.5px var(--f-u);padding:1px 5px;border-radius:3px;border:1px solid var(--line-2);color:var(--muted);background:transparent}

/* ============ shell ============ */
.shell{min-height:100%}
.rail{display:none}
.main{min-width:0;padding-bottom:calc(var(--nav) + 32px)}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:4px;height:56px;padding:0 12px 0 20px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:saturate(1.2) blur(14px);-webkit-backdrop-filter:saturate(1.2) blur(14px);border-bottom:1px solid var(--line)}
.logo{font:italic 400 26px/1 var(--f-d);letter-spacing:-.01em;text-decoration:none;color:var(--ink);display:inline-flex;align-items:baseline;gap:1px}
.logo .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block;margin-left:2px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:12px;font-weight:500;white-space:nowrap;color:var(--ink-2)}
.chip svg{display:none}
.chip.ok{color:var(--known);border-color:color-mix(in srgb,var(--known) 40%,var(--line))}
.chip.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.chip.y{border-color:color-mix(in srgb,#B8922A 45%,var(--line));color:var(--warn)}
#tb-lang{font-weight:600;letter-spacing:.08em;font-size:11px}
.ibtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink-2);transition:background .15s,color .15s}
.ibtn:hover{background:var(--surface-2);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:8px;border:1px solid var(--line-2);background:transparent;font-weight:500;font-size:14px;color:var(--ink);transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
.btn>svg{display:none}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.pri:hover{background:color-mix(in srgb,var(--ink) 86%,var(--bg))}
.btn.blue{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{height:34px;padding:0 14px;font-size:13.5px}
.btn.xs{height:28px;padding:0 10px;font-size:12.5px;border-radius:6px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.tabbar{position:fixed;z-index:40;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.2) blur(14px);-webkit-backdrop-filter:saturate(1.2) blur(14px);border-top:1px solid var(--line)}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:10.5px;font-weight:500;letter-spacing:.02em}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"]::after{content:"";position:absolute;top:0;left:34%;right:34%;height:1.5px;background:var(--ink)}
.ti{display:grid;place-items:center}
.tabbar .badge{position:absolute;top:8px;left:calc(50% + 8px)}
.badge{min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:600;line-height:17px;text-align:center}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:28px 20px 0}

@media (min-width:1000px){
  .rail{display:flex;align-items:center;gap:28px;position:sticky;top:0;z-index:30;height:64px;padding:0 36px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:saturate(1.2) blur(14px);-webkit-backdrop-filter:saturate(1.2) blur(14px);border-bottom:1px solid var(--line)}
  .rail .logo{order:0;font-size:28px}
  .rnav{order:1;flex:1;display:flex;align-items:center;gap:2px;justify-content:center}
  .rnav button{position:relative;display:flex;align-items:center;gap:6px;height:64px;padding:0 13px;color:var(--muted);font-size:14px;font-weight:500;transition:color .15s}
  .rnav button svg{display:none}
  .rnav button:hover{color:var(--ink)}
  .rnav button[aria-current="page"]{color:var(--ink)}
  .rnav button[aria-current="page"]::after{content:"";position:absolute;left:13px;right:13px;bottom:-1px;height:1.5px;background:var(--ink)}
  .rnav .sep{width:1px;height:16px;background:var(--line-2);margin:0 10px}
  .rnav .badge{min-width:16px;height:16px;line-height:16px;font-size:10px}
  .rail-lang{order:2}
  .rail-foot{order:3;display:flex;align-items:center}
  .topbar,.tabbar{display:none}
  .main{padding-bottom:64px}
  .wrap{padding:52px 40px 0}
}
.rail-lang{display:none}
@media (min-width:1000px){.rail-lang{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);font-size:13px;font-weight:500}.rail-lang:hover{border-color:var(--line-2);color:var(--ink)}.rail-lang svg{width:15px;height:15px}.rail-lang .lcode{font-size:10.5px;font-weight:600;letter-spacing:.1em;color:var(--muted)}}
.rail-set{display:grid;place-items:center;width:36px;height:36px;border-radius:8px;color:var(--ink-2)}
.rail-set:hover{background:var(--surface-2);color:var(--ink)}

/* ============ common ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:22px}
.card.flat{background:transparent}
.card h3{font:400 22px/1.15 var(--f-d);letter-spacing:-.005em}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:56px 0 18px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sec-h h2{font:400 clamp(24px,3vw,30px)/1.1 var(--f-d);letter-spacing:-.01em}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.page-h h1{font:300 clamp(40px,6.4vw,68px)/.98 var(--f-d);letter-spacing:-.025em;margin-top:10px;font-variation-settings:'opsz' 72}
.page-h p{color:var(--ink-2);margin-top:14px;max-width:58ch;font-size:15.5px}
.page-h p b{font-weight:600}
.meter{display:flex;height:3px;border-radius:2px;overflow:hidden;background:var(--line);gap:1px}
.meter.thin{height:2px}
.meter i{display:block;height:100%}
.m-k{background:var(--ink)} .m-l{background:#D9B13B} .m-n{background:color-mix(in srgb,var(--new) 45%,var(--bg))}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;border:1px solid var(--line)}
.seg button{height:30px;padding:0 11px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;white-space:nowrap;color:var(--ink-2);--pc:var(--muted)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pc);flex:none}
.pill svg{display:none}
.p-new{--pc:var(--new);color:var(--new)} .p-l1,.p-l2,.p-l3,.p-l4{--pc:#D9B13B;color:var(--warn)} .p-k{--pc:var(--known);color:var(--known)} .p-i{--pc:var(--line-2);color:var(--muted)}
.lvl{display:inline-flex;gap:2px;vertical-align:middle}
.lvl i{width:10px;height:2px;background:var(--line-2)}
.lvl i.on{background:#D9B13B}
.verdict{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.verdict svg{display:none}
.verdict.ok{color:var(--known)} .verdict.bad{color:var(--bad)}

/* typographic covers */
.cover{position:relative;container-type:inline-size;width:100%;aspect-ratio:2/3;background:var(--cv,#2F2F2C);color:var(--cvi,#EEE);border-radius:3px;overflow:hidden;box-shadow:inset 3px 0 0 rgba(0,0,0,.12),0 1px 2px rgba(20,20,19,.08)}
.cv-in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:11cqw 10cqw 10cqw}
.cv-mark{display:block;width:58%;opacity:.92}
.cv-mark svg{display:block;width:100%;height:auto;overflow:visible}
.cv-title{font:400 13cqw/1.02 var(--f-d);letter-spacing:-.015em;text-wrap:balance;word-break:break-word}
.cv-sub{font:500 5.6cqw/1 var(--f-u);letter-spacing:.16em;text-transform:uppercase;opacity:.72;margin-top:5cqw}
@container (max-width:96px){.cv-title,.cv-sub{display:none}.cv-mark{width:86%;margin:auto}}
.cover .cv-l{display:none}
.cover .done{position:absolute;top:8px;right:8px;height:22px;padding:0 8px;font-size:10.5px;background:var(--surface);color:var(--known);border-color:transparent}

/* ============ HOJE ============ */
.home-grid{display:grid;gap:0;grid-template-columns:1fr;margin-top:44px;border-top:1px solid var(--line)}
.home-grid>.card{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:28px 0}
@media (min-width:760px){
  .home-grid{grid-template-columns:repeat(6,1fr)}
  .span-4{grid-column:span 4}.span-2{grid-column:span 2}.span-3{grid-column:span 3}
  .home-grid>.card.span-2{padding:28px 0 28px 28px;border-left:1px solid var(--line)}
  .home-grid>.card.span-4{padding-right:32px}
  .home-grid>.card.span-2:nth-of-type(3){border-left:0;padding-left:0}
  .home-grid>.card.span-2:nth-of-type(3),.home-grid>.card.span-2:nth-of-type(4){padding-right:28px}
}
.cont{display:grid;grid-template-columns:96px 1fr;gap:20px;align-items:start}
.cont .cover{aspect-ratio:2/3}
.cont h2{font:300 clamp(30px,4vw,44px)/1 var(--f-d);letter-spacing:-.02em;margin:10px 0 10px;font-variation-settings:'opsz' 72}
.cont .blurb{color:var(--ink-2);font:italic 400 17px/1.5 var(--f-r);max-width:46ch}
.cont .body{display:flex;flex-direction:column;gap:14px;min-width:0}
.cont .muted svg{display:none}
@media (min-width:600px){.cont{grid-template-columns:150px 1fr;gap:28px;align-items:stretch}.cont .cover{aspect-ratio:2/3;height:auto}}
.rings{display:flex;align-items:center;gap:20px}
.rings svg{flex:none}
.gl{display:grid;gap:10px;font-size:13px}
.gl div{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.gl b{margin-left:auto;font-weight:500;font-variant-numeric:tabular-nums}
.gl .sw{width:7px;height:7px}
.due-card .n{font:300 76px/1 var(--f-d);letter-spacing:-.04em;font-variation-settings:'opsz' 72}
.due-card .deck{display:none}
.wod .w-big{font:300 44px/1 var(--f-d);letter-spacing:-.02em;margin:12px 0 6px;font-variation-settings:'opsz' 72}
.wod q{display:block;font:italic 400 16px/1.6 var(--f-r);color:var(--ink-2);quotes:none;margin-top:12px}
.wod q mark,.g-ctx mark,.face .fctx mark{background:linear-gradient(transparent 60%,var(--hl2) 60%,var(--hl2) 94%,transparent 94%);color:inherit;padding:0 1px}
.mini-list{display:grid;gap:0;grid-template-columns:1fr;border-top:1px solid var(--line)}
@media (min-width:760px){.mini-list{grid-template-columns:repeat(3,1fr)}.mini-list .mini+.mini{border-left:1px solid var(--line)!important}}
.mini{display:grid;grid-template-columns:56px 1fr;gap:16px;align-items:center;padding:18px 18px 18px 0;text-align:left;width:100%;border:0!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;background:transparent!important}
@media (min-width:760px){.mini{padding:20px 22px}.mini:first-child{padding-left:0}}
.mini .cover{aspect-ratio:2/3}
.mini h4{font:400 20px/1.1 var(--f-d)}
.mini:hover h4{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}

/* ============ LEITOR ============ */
.reader{display:grid;grid-template-columns:minmax(0,1fr);gap:56px;align-items:start}
@media (min-width:1180px){.reader{grid-template-columns:minmax(0,1fr) 340px}}
.sheet{background:transparent;border:0;transition:background .25s,color .25s}
.sheet[data-r="sepia"],.sheet[data-r="night"]{background:var(--sheet);border-radius:6px}
.r-head{display:grid;grid-template-columns:64px 1fr;gap:18px;align-items:end;padding:0 0 22px}
.r-head .cover{aspect-ratio:2/3}
.r-head h1{font:300 clamp(34px,5.4vw,58px)/1 var(--f-d);letter-spacing:-.025em;margin:10px 0 12px;font-variation-settings:'opsz' 72}
.r-meta{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.r-meta span{display:inline-flex;align-items:center;gap:5px}
.r-meta svg{display:none}
@media (min-width:700px){.r-head{grid-template-columns:96px 1fr;gap:26px}}
.sheet[data-r="sepia"] .r-head,.sheet[data-r="night"] .r-head{padding:28px 28px 22px}
.cov{padding:0 0 18px}
.sheet[data-r="sepia"] .cov,.sheet[data-r="night"] .cov,.sheet[data-r="sepia"] .pre,.sheet[data-r="night"] .pre{padding-left:28px;padding-right:28px}
.cov-top{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:10px;flex-wrap:wrap;color:var(--muted)}
.cov-top b{color:var(--ink);font-weight:600}
.cov .legend{margin-top:12px}
.pre{padding:4px 0 24px}
.pre-chips{display:flex;gap:6px 18px;flex-wrap:wrap}
.pchip{display:inline-flex;align-items:baseline;gap:7px;font-size:12.5px;color:var(--muted);padding:2px 0;border-bottom:1px solid var(--line-2);transition:border-color .15s}
.pchip:hover{border-color:var(--ink)}
.pchip b{font:italic 400 17px var(--f-r);color:var(--ink)}
.pchip small{font-size:10.5px;color:var(--accent)}
.toolbar{position:sticky;top:56px;z-index:15;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sheet[data-r="sepia"] .toolbar,.sheet[data-r="night"] .toolbar{background:color-mix(in srgb,var(--sheet) 92%,transparent);padding:10px 28px}
@media (min-width:1000px){.toolbar{top:64px}}
.toolbar .seg{border-color:transparent}
.tdots{display:inline-flex;gap:6px;padding:0 4px}
.tdots button{width:18px;height:18px;border-radius:50%;border:1px solid var(--line-2)}
.tdots button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--ink)}
.tdots .t-paper{background:#fff}.tdots .t-sepia{background:#EFE3C8}.tdots .t-night{background:#1B1D22}
.flowbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.play{display:inline-flex;align-items:center;gap:9px;height:34px;padding:0 14px 0 4px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink);font-weight:500;font-size:13px;background:transparent}
.play:hover{background:var(--surface-2)}
.play .pc{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg)}
.rprog{position:absolute;left:0;bottom:-1px;height:1.5px;background:var(--ink);width:0;transition:width .1s}
.tb-sp{flex:1}
@media (max-width:699px){.toolbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;top:56px}.toolbar::-webkit-scrollbar{display:none}.toolbar>*{flex:none}.toolbar .play{order:-1}.tb-sp{display:none}}
.textwrap{padding:44px 0 40px}
.sheet[data-r="sepia"] .textwrap,.sheet[data-r="night"] .textwrap{padding:44px 28px 40px}
#text{font-family:var(--f-r);font-size:var(--fs,20px);line-height:var(--lh,1.9);max-width:62ch;color:var(--ink);font-optical-sizing:auto;font-weight:400}
#text p{margin:0 0 1.2em}
#text p:first-child::first-letter{font-family:var(--f-d);font-weight:300;float:left;font-size:3.9em;line-height:.8;padding:.06em .08em 0 0;color:var(--ink)}
.w{cursor:pointer;border-radius:2px;padding:0 .02em;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .15s,color .15s}
.w:hover{background-color:var(--surface-2)}
.w.st0{background:linear-gradient(var(--new),var(--new)) 0 92%/100% 1px no-repeat}
.w.st1{background:linear-gradient(transparent 56%,var(--hl1) 56%,var(--hl1) 94%,transparent 94%)}
.w.st2{background:linear-gradient(transparent 56%,var(--hl2) 56%,var(--hl2) 94%,transparent 94%)}
.w.st3{background:linear-gradient(transparent 56%,var(--hl3) 56%,var(--hl3) 94%,transparent 94%)}
.w.st4{background:linear-gradient(transparent 56%,var(--hl4) 56%,var(--hl4) 94%,transparent 94%)}
.hl-new .w.st1,.hl-new .w.st2,.hl-new .w.st3,.hl-new .w.st4{background:none}
.hl-none .w.st0,.hl-none .w.st1,.hl-none .w.st2,.hl-none .w.st3,.hl-none .w.st4{background:none}
.w.x{text-decoration:underline dotted color-mix(in srgb,var(--accent) 70%,transparent);text-decoration-thickness:1.5px;text-underline-offset:.3em}
.noexpr .w.x{text-decoration:none}
.w.sel{background:var(--ink)!important;color:var(--bg);border-radius:2px}
.w.spk{background:var(--accent)!important;color:var(--accent-ink)}
.sent.playing{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.sbtn{display:inline-grid;place-items:center;width:.95em;height:.95em;vertical-align:-.1em;margin-left:.06em;border-radius:3px;color:var(--muted);opacity:.28;transition:opacity .15s}
.sent:hover .sbtn,.sbtn:focus-visible{opacity:.7}
.sbtn:hover{opacity:1;color:var(--accent)}

.nosbtn .sbtn{display:none}
.r-end{margin-top:36px;padding-top:28px;border-top:1px solid var(--line);display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.r-end p{color:var(--muted);font-size:13.5px;max-width:46ch}
.r-end p b{color:var(--known)!important;font-weight:600}

/* gloss: a margin note */
.gloss{position:fixed;z-index:45;left:0;right:0;bottom:0;max-height:min(72vh,660px);display:flex;flex-direction:column;background:var(--surface);border-top:1px solid var(--line);border-top-left-radius:16px;border-top-right-radius:16px;box-shadow:0 -24px 60px -24px rgba(20,20,19,.3);transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s;padding-bottom:env(safe-area-inset-bottom,0px)}
.gloss.open{transform:none;visibility:visible;transition-delay:0s}
.g-handle{display:grid;place-items:center;height:22px;flex:none;cursor:grab;touch-action:none}
.g-handle i{width:36px;height:3px;border-radius:3px;background:var(--line-2)}
.g-scroll{overflow:auto;padding:4px 22px 24px;flex:1;overscroll-behavior:contain}
@media (max-width:1179px){.reading-open #text{padding-bottom:42vh}}
@media (min-width:1180px){
  .gloss{position:sticky;top:96px;left:auto;right:auto;bottom:auto;max-height:calc(100vh - 120px);transform:none;visibility:visible;background:transparent;border:0;border-left:1px solid var(--line);border-radius:0;box-shadow:none;transition:none;padding-bottom:0}
  .g-handle{display:none}
  .g-scroll{padding:0 0 0 28px}
  .g-x{display:none}
}
.g-band{display:none}
.g-word{font:300 42px/1 var(--f-d);letter-spacing:-.02em;word-break:break-word;font-variation-settings:'opsz' 72}
.g-sub{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}
.g-sub .ipa{font:italic 400 16px var(--f-r);color:var(--ink-2)}
.g-sub .pill::before{display:none}
.g-tr{font:italic 400 23px/1.3 var(--f-r);margin-top:16px;color:var(--ink)}
.g-tr svg{display:none}
.g-tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:24px 0 16px}
.g-tabs button{position:relative;height:36px;font-size:12.5px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:6px;letter-spacing:.01em}
.g-tabs button svg{display:none}
.g-tabs button:hover{color:var(--ink)}
.g-tabs button.on{color:var(--ink)}
.g-tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1.5px;background:var(--ink)}
.g-expr{display:grid;gap:10px;padding:12px 0 12px 14px;border-left:2px solid var(--accent);font-size:13.5px;margin-top:16px;color:var(--ink-2)}
.g-expr b{font-weight:600;color:var(--ink)}
.g-ctx{font:400 17px/1.65 var(--f-r);color:var(--ink-2)}
.g-ctx .tr{display:block;margin-top:10px;font:italic 400 15px/1.55 var(--f-r);color:var(--muted)}
.g-ctx .tr svg{display:none}
.g-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.ai{display:grid;gap:16px}
.ai-card{position:relative;padding:2px 0 2px 16px;border-left:2px solid var(--accent);font-size:14px;line-height:1.65;color:var(--ink-2);background:none;border-radius:0}
.ai-card p+p{margin-top:8px}
.ai-card b{color:var(--ink);font-weight:600}
.ai-tag{display:flex;align-items:center;gap:6px;font:500 10.5px/1 var(--f-u);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.ai-tag svg{display:none}
.ai-q{justify-self:end;max-width:88%;padding:0;font:italic 400 16px/1.5 var(--f-r);color:var(--ink);text-align:right}
.ai-q::before{content:"— "}
.caret{display:inline-block;width:1px;height:1.05em;vertical-align:-.15em;background:var(--accent);margin-left:1px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.chips{display:flex;gap:6px 14px;flex-wrap:wrap}
.chips button{font-size:12.5px;font-weight:500;color:var(--ink-2);padding:3px 0;border-bottom:1px solid var(--line-2)}
.chips button:hover{color:var(--accent);border-color:var(--accent)}
.ask{display:flex;gap:6px;align-items:center;padding:4px 4px 4px 0;border-bottom:1px solid var(--line-2)}
.ask:focus-within{border-color:var(--ink)}
.ask input{flex:1;min-width:0;border:0;background:transparent;height:34px;outline:none;font:italic 400 16px var(--f-r)}
.ask .btn{height:30px;width:30px;padding:0;border-radius:50%;background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ask .btn>svg{display:block}
.skel{height:8px;border-radius:2px;background:var(--line);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.note-ta{width:100%;min-height:120px;padding:12px 0;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;font:italic 400 16px/1.6 var(--f-r);resize:vertical;outline:none}
.st-pick{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.st-row{display:grid;grid-template-columns:minmax(48px,auto) repeat(4,minmax(28px,1fr)) minmax(80px,auto);gap:0;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.st-row button{position:relative;height:38px;padding:0 8px;font-size:12.5px;font-weight:500;color:var(--ink-2);border-left:1px solid var(--line);display:grid;place-items:center}
.st-row button:first-child{border-left:0}
.st-row button:hover{background:var(--surface-2)}
.st-row .b1::after,.st-row .b2::after,.st-row .b3::after,.st-row .b4::after{content:"";position:absolute;left:30%;right:30%;bottom:7px;height:3px;border-radius:2px}
.st-row .b1::after{background:var(--hl1)}.st-row .b2::after{background:var(--hl2)}.st-row .b3::after{background:var(--hl3)}.st-row .b4::after{background:var(--hl4)}
.st-row button.on{background:var(--ink);color:var(--bg)}
.st-row .b0.on{background:var(--new);color:#fff}
.st-row .b5.on{background:var(--known);color:#fff}
.st-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.linkbtn{color:var(--muted);font-size:12px;font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.linkbtn:hover{color:var(--ink)}
.g-empty{display:grid;gap:18px}
.g-empty h3{font:300 26px/1.15 var(--f-d)!important}
.g-empty .ill{display:none}
.keys{display:grid;gap:9px;font-size:12.5px;color:var(--muted);padding-top:16px;border-top:1px solid var(--line)}
.keys div{display:flex;justify-content:space-between;gap:10px}

/* ============ BIBLIOTECA ============ */
.feat{display:grid;grid-template-columns:1fr;gap:28px;margin-top:44px;padding:0;border:0;background:transparent}
.feat .cover{aspect-ratio:2/3;max-width:240px}
.feat .fb{display:flex;flex-direction:column;gap:16px;justify-content:center;padding:0}
.feat h2{font:300 clamp(36px,5vw,60px)/.98 var(--f-d);letter-spacing:-.025em;font-variation-settings:'opsz' 72}
.feat .blurb{font:italic 400 19px/1.5 var(--f-r);color:var(--ink-2);max-width:42ch}
@media (min-width:760px){.feat{grid-template-columns:240px 1fr;gap:48px;align-items:center}.feat .cover{max-width:none}}
.lib-tools{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:44px}
.search{display:flex;align-items:center;gap:8px;height:38px;padding:0 2px;border-bottom:1px solid var(--line-2);min-width:220px;flex:1;max-width:340px}
.search:focus-within{border-color:var(--ink)}
.search svg{color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:14px}
.shelf{display:grid;gap:36px 24px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
@media (min-width:760px){.shelf{grid-template-columns:repeat(auto-fill,minmax(176px,1fr))}}
.book{display:flex;flex-direction:column;gap:12px;text-align:left;padding:0;border:0;background:none;width:100%}
.book .cover{aspect-ratio:2/3;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.book:hover .cover{transform:translateY(-3px);box-shadow:inset 3px 0 0 rgba(0,0,0,.12),0 18px 30px -18px rgba(20,20,19,.45)}
.book h4{font:400 19px/1.15 var(--f-d)}
.book .bm{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.book .bm b{font-weight:600}
.book .row .chip{height:22px;font-size:11px;padding:0 8px}
.imp{display:grid;gap:28px;grid-template-columns:1fr;margin-top:6px}
@media (min-width:820px){.imp{grid-template-columns:1.1fr 1fr}}
.drop{display:grid;place-items:center;gap:10px;text-align:center;min-height:200px;padding:28px;border:1px dashed var(--line-2);border-radius:var(--rad);background:transparent;transition:border-color .15s,background .15s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--ink);background:var(--surface)}
.drop>span:first-child{border:0!important;background:transparent!important;color:var(--muted)}
.drop .big{font:300 26px/1.1 var(--f-d)}
.srcs{display:grid;gap:0;border-top:1px solid var(--line)}
.src{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-top:0;border-radius:0}
.src .si{display:grid;place-items:center;width:30px;height:30px;color:var(--muted);flex:none;background:transparent}
.src b{display:block;font-weight:500;font-size:14px}
.src small{color:var(--muted);font-size:12.5px}

/* ============ REVER ============ */
.rv-wrap{max-width:720px;margin:0 auto}
.modes{display:grid;gap:0;grid-template-columns:repeat(2,1fr);margin-top:14px;border:1px solid var(--line);border-radius:var(--rad);overflow:hidden}
@media (min-width:640px){.modes{grid-template-columns:repeat(4,1fr)}}
.mode{display:flex;flex-direction:column;gap:6px;padding:18px;text-align:left;background:transparent;border-left:1px solid var(--line);transition:background .15s}
.mode:first-child{border-left:0}
@media (max-width:639px){.modes .mode:nth-child(3){border-left:0}.modes .mode:nth-child(n+3){border-top:1px solid var(--line)}}
.mode:hover{background:var(--surface)}
.mode.on{background:var(--ink);color:var(--bg)}
.mode.on small{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.mode .mi{color:inherit;opacity:.8;margin-bottom:6px}
.mode b{font:400 19px/1.1 var(--f-d)}
.mode small{color:var(--muted);font-size:12.5px;line-height:1.4}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:36px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:20px 20px 20px 0;background:transparent;border:0}
.stat+.stat{border-left:1px solid var(--line);padding-left:20px}
.stat .n{font:300 46px/1 var(--f-d);letter-spacing:-.03em;font-variation-settings:'opsz' 72}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:8px}
.rv-top{display:flex;align-items:center;gap:14px;margin-top:6px}
.segs{display:flex;gap:2px;flex:1}
.segs i{flex:1;height:2px;background:var(--line)}
.segs i.d{background:var(--ink)}
.segs i.c{background:var(--accent)}
.flip{perspective:1800px;margin-top:22px}
.flip-in{position:relative;display:grid;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.flip.turn .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:36px 28px;min-height:360px;display:flex;flex-direction:column;gap:20px}
.face.back{transform:rotateY(180deg)}
@media (min-width:640px){.face{padding:48px 56px;min-height:400px}}
.face .fw{font:300 clamp(48px,8vw,72px)/1 var(--f-d);letter-spacing:-.03em;font-variation-settings:'opsz' 72}
.face .fctx{font:400 20px/1.65 var(--f-r);color:var(--ink-2)}
.blank{display:inline-block;min-width:5em;border-bottom:1.5px solid var(--ink);margin:0 3px;height:1.1em;vertical-align:-.1em}
.face .ftr{font:italic 400 32px/1.15 var(--f-r)}
.face .fsub{color:var(--muted);font:italic 400 16px/1.5 var(--f-r)}
.face .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.ans{display:flex;gap:8px;align-items:flex-end}
.ans input{flex:1;min-width:0;height:50px;padding:0 2px;border:0;border-bottom:1.5px solid var(--line-2);background:transparent;font:italic 400 22px var(--f-r);outline:none}
.ans input:focus{border-color:var(--ink)}
.opts{display:grid;gap:0;grid-template-columns:1fr;border-top:1px solid var(--line)}
@media (min-width:560px){.opts{grid-template-columns:1fr 1fr}.opts .opt:nth-child(even){border-left:1px solid var(--line)}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:15px 12px;border-bottom:1px solid var(--line);background:transparent;font:400 17px/1.3 var(--f-r);transition:background .15s}
.opt:hover{background:var(--surface-2)}
.opt.right{background:color-mix(in srgb,var(--known) 10%,transparent);color:var(--known)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 8%,transparent);color:var(--bad);text-decoration:line-through}
.qopt{display:grid;gap:0;border-top:1px solid var(--line)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:18px;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.grades button{display:grid;gap:3px;padding:14px 6px;border-left:1px solid var(--line);background:transparent;font-weight:600;font-size:13.5px;text-align:center;transition:background .15s}
.grades button:first-child{border-left:0}
.grades button:hover{background:var(--surface-2)}
.grades button small{font-weight:400;color:var(--muted);font-size:11.5px}
.grades .g1{color:var(--bad)}.grades .g2{color:var(--warn)}.grades .g3{color:var(--known)}.grades .g4{color:var(--accent)}
.done-hero{text-align:center;display:grid;justify-items:center;gap:14px;padding:48px 24px;border:0;background:transparent}
.done-hero h2{font:300 clamp(36px,5vw,52px)/1 var(--f-d);letter-spacing:-.02em}
.done-hero>span:first-child{background:transparent!important;color:var(--ink)!important}
.promo{display:flex;gap:8px 14px;flex-wrap:wrap;justify-content:center}

/* ============ PALAVRAS ============ */
.wl{display:grid;gap:0;margin-top:22px;border-top:1px solid var(--ink)}
.wr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:20px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);text-align:left;width:100%;transition:background .12s}
.wr:hover{background:linear-gradient(90deg,transparent,var(--surface-2) 30%,transparent)}
.wr .ww{font:400 22px/1.1 var(--f-d)}
.wr .wt{color:var(--ink-2);font:italic 400 15px var(--f-r)}
.wr .wc{color:var(--muted);font:400 14px/1.4 var(--f-r);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr .wd{display:grid;justify-items:end;gap:6px;font-size:12px;color:var(--muted)}
.wr .muted svg{display:none}
@media (max-width:640px){.wr{grid-template-columns:1fr auto}.wr .mid{display:none}}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}

/* ============ PROGRESSO ============ */
.kpis{display:grid;gap:0;grid-template-columns:repeat(2,1fr);margin-top:44px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@media (min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{display:grid;gap:4px;position:relative;overflow:hidden;border:0!important;border-radius:0!important;background:transparent!important;padding:24px 22px 18px 0!important}
.kpi+.kpi{border-left:1px solid var(--line)!important;padding-left:22px!important}
@media (max-width:899px){.kpi:nth-child(3){border-left:0!important;padding-left:0!important}.kpi:nth-child(n+3){border-top:1px solid var(--line)!important}}
.kpi .n{font:300 clamp(36px,4vw,48px)/1 var(--f-d);letter-spacing:-.03em;font-variation-settings:'opsz' 72}
.kpi .l{font-size:12px;color:var(--muted);letter-spacing:.02em}
.kpi .dl{font-size:12px;font-weight:500;color:var(--known)}
.kpi svg{margin-top:12px}
.pgrid{display:grid;gap:0;grid-template-columns:1fr;margin-top:0}
.pgrid>.card{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:32px 0}
@media (min-width:900px){.pgrid{grid-template-columns:repeat(2,1fr)}.pspan{grid-column:span 2}.pgrid>.card.pr{padding-left:32px;border-left:1px solid var(--line)}.pgrid>.card.pl{padding-right:32px}}
svg.ch{width:100%;height:auto;display:block;overflow:visible}
svg.ch text{fill:var(--muted);font:400 10px var(--f-u)}
svg.ch .gl{stroke:var(--line);stroke-width:1}
svg.ch .b{fill:var(--line-2)}
svg.ch .bt{fill:var(--ink)}
svg.ch .ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
svg.ch .ar{fill:url(#ga)}
svg.ch .pt{fill:var(--bg);stroke:var(--ink);stroke-width:1.6}
svg.ch text.em{fill:var(--ink);font-weight:600;font-size:11px}
svg.ch .gs1{stop-color:var(--ink);stop-opacity:.08}
svg.ch .gs2{stop-color:var(--ink);stop-opacity:0}
.heat-row{display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:3px;overflow-x:auto;padding-bottom:4px;max-width:100%}
.heat i{width:14px;height:14px;border-radius:2px;background:var(--line)}
.heat i.h1{background:color-mix(in srgb,var(--ink) 20%,var(--bg))}
.heat i.h2{background:color-mix(in srgb,var(--ink) 42%,var(--bg))}
.heat i.h3{background:color-mix(in srgb,var(--ink) 66%,var(--bg))}
.heat i.h4{background:var(--ink)}
.heat i.td{outline:1.5px solid var(--accent);outline-offset:1px}
.heat-st{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;flex:1;min-width:260px;align-self:center}
.heat-st .n{font:300 40px/1 var(--f-d);letter-spacing:-.02em}
.heat-st .l{font-size:12px;color:var(--muted);margin-top:6px}
.hl-leg{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.hl-leg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.hl-leg i:nth-of-type(2){background:color-mix(in srgb,var(--ink) 20%,var(--bg))!important}
.hl-leg i:nth-of-type(3){background:color-mix(in srgb,var(--ink) 42%,var(--bg))!important}

/* tokenização para qualquer língua */
function segWords(text,lang){
  const out=[];
  const push=(w,isW)=>{if(isW)out.push({w:w});else if(out.length&&out[out.length-1].p!=null)out[out.length-1].p+=w;else out.push({p:w});};
  try{
    if(typeof Intl!=='undefined'&&Intl.Segmenter){const sg=new Intl.Segmenter(lang,{granularity:'word'});for(const s of sg.segment(text))push(s.segment,!!s.isWordLike);return out;}
  }catch(e){}
  let re;try{re=new RegExp("([\\p{L}\\p{M}\\p{N}]+(?:['’][\\p{L}]+)*)|([^\\p{L}\\p{M}\\p{N}]+)","gu");}catch(e){re=/([A-Za-zÀ-ÿ]+)|([^A-Za-zÀ-ÿ]+)/g;}
  let m;while((m=re.exec(text))){if(m[1]&&NOSPACE[lang])Array.from(m[1]).forEach(ch=>push(ch,true));else push(m[1]||m[2],!!m[1]);}
  return out;
}
function lowerL(w,lang){try{return w.toLocaleLowerCase(lang);}catch(e){return w.toLowerCase();}}
function buildTokAny(sid){
  const lang=SENT_LANG[sid]||'en';
  if(lang==='en'){buildTok(sid);return;}
  const toks=segWords(SENT[sid].en,lang);const words=[];
  toks.forEach((t,i)=>{if(t.w){t.l='@'+lang+':'+lowerL(t.w,lang);words.push(i);}});
  EXPR.forEach((x,xi)=>{
    if(x.s!==sid)return;
    for(let a=0;a+x.w.length<=words.length;a++){
      let ok=true;for(let b=0;b<x.w.length;b++){if(lowerL(toks[words[a+b]].w,lang)!==x.w[b]){ok=false;break;}}
      if(ok){for(let b=0;b<x.w.length;b++)toks[words[a+b]].x=xi;break;}
    }
  });
  TOK[sid]=toks;
}
function langOfKey(l){
  if(l.charAt(0)==='@')return l.slice(1,l.indexOf(':'));
  if(l.indexOf('phrase:')===0){const v=typeof S!=='undefined'&&S.vocab[l];return v&&v.ctx?(SENT_LANG[v.ctx.sid]||'en'):'en';}
  return 'en';
}

function rings(list,size){
  const sz=size||120,c=sz/2,sw=Math.max(2.5,Math.round(sz*.035*10)/10),step=sw+Math.max(5,Math.round(sz*.06));let s=`<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" role="img" aria-label="Metas de hoje">`;
  list.forEach((it,i)=>{const r=c-sw/2-1-i*step,C=2*Math.PI*r,p=Math.max(0,Math.min(1,it.p));
    s+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:var(--line)" stroke-width="${sw}"/>`;
    s+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:${it.c}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${c} ${c})"/>`;});
  return s+'</svg>';
}
function ring1(p,size,color,inner){const sz=size||140,c=sz/2,r=c-9,C=2*Math.PI*r;return`<div class="ring-wrap"><svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:var(--line)" stroke-width="3"/><circle cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:${color||'var(--ink)'}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${(C*Math.max(0,Math.min(1,p))).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${c} ${c})"/></svg><div class="c">${inner||''}</div></div>`;}

function fmt(n){return(Math.round(n*10)/10).toLocaleString('pt-PT');}
function spark(vals,w,h){
  const mx=Math.max.apply(null,vals.concat([1])),mn=0;const pts=vals.map((v,i)=>[i*(w/(vals.length-1)),h-3-((v-mn)/(mx-mn||1))*(h-8)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const l=pts[pts.length-1];
  const gid='sg'+Math.floor(Math.random()*1e6);
  return`<svg class="ch" viewBox="0 0 ${w} ${h}" aria-hidden="true"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="gs1"/><stop offset="1" class="gs2"/></linearGradient></defs><path d="${d} L${w} ${h} L0 ${h}Z" fill="url(#${gid})"/><path class="ln" d="${d}" style="stroke-width:2"/><circle class="pt" cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" r="3.2"/></svg>`;
}

function aiMain(){

  if(!e.pt&&!x)return'Esta palavra não tem entrada na demo. Na versão real, a IA recebe a frase e o parágrafo à volta e explica aqui o sentido neste contexto, com um exemplo ao teu nível.';
  let t=e.pt?`Neste texto, «${tk.w}» quer dizer «${e.pt.split(';')[0]}».`:`«${tk.w}» faz parte de uma expressão.`;
  if(e.ai)t+='\n\n'+e.ai;
  else if(isBasic(l))t+='\n\nÉ uma palavra muito frequente. Vale a pena reconhecê-la sem traduzir.';
  if(!e.ai&&!isBasic(l)&&tl()!=='en')t+='\n\nNa versão real, a IA explica esta palavra em contexto para qualquer língua.';
  if(x)t+=`\n\nFaz parte da expressão «${x.w.join(' ')}» = ${x.pt}. Lê-a como um bloco.`;

  return t;
}
function aiFollow(k){
  if(G.kind!=='word'){
    if(k==='words'){const o=[];TOK[G.sid].forEach(t=>{if(t.w&&status(t.l)!==5&&status(t.l)!==-1&&o.indexOf(t.l)<0)o.push(t.l);});return o.length?'Palavras que ainda estás a aprender nesta frase:\n'+o.map(l=>`• ${l}: ${info(l).pt||'sem entrada'}`).join('\n'):'Já conheces todas as palavras desta frase.';}
    if(k==='slow'){say(SENT[G.sid].en,{rate:.7});return'A ler a frase a 70% da velocidade. Repete em voz alta logo a seguir (shadowing): ajuda a fixar o ritmo.';}
  }
  const tk=TOK[G.sid][G.i],l=tk.l,e=info(l);
  if(k==='ex'){
    const o=[];Object.keys(SENT).forEach(sid=>{if(sid===G.sid||!TOK[sid])return;if(TOK[sid].some(t=>t.w&&t.l===l))o.push(sid);});
    if(!o.length)return`«${l}» só aparece neste texto. Na versão real, a IA cria uma frase nova com esta palavra e só com vocabulário que já conheces.`;
    return'Noutro texto da tua biblioteca:\n\n'+o.slice(0,2).map(sid=>`«${SENT[sid].en}»\n→ ${SENT[sid].pt||'(sem tradução)'}`).join('\n\n');
  }

  return'';

var ALLV=[];
function voicesFor(lg){const b=(lg||'en').split('-')[0].toLowerCase();return ALLV.filter(v=>String(v.lang).toLowerCase().replace('_','-').split('-')[0]===b);}

function pickVoice(lg){lg=lg||'en';if(lg!=='en'){const vs=voicesFor(lg);const pref=BCP[lg];return vs.find(v=>pref&&String(v.lang).replace('_','-').toLowerCase()===pref.toLowerCase())||vs[0]||null;}if(S.settings.voice){const v=VOICES.find(x=>x.name===S.settings.voice);if(v)return v;}return VOICES.find(v=>/en[-_]GB/i.test(v.lang))||VOICES[0]||null;}
function say(text,o){
  o=o||{};
  if(useClaudeVoice())return claudeSay(text,o);
  try{
    if(!('speechSynthesis' in window))throw new Error('no tts');
    const lg=o.lang||tl();const u=new SpeechSynthesisUtterance(text);u.lang=BCP[lg]||lg;u.rate=o.rate||S.settings.rate||1;const v=pickVoice(lg);if(v)u.voice=v;else if(lg!=='en'&&ALLV.length&&!o.quiet)toast('Este dispositivo não tem voz para '+langName(lg).toLowerCase()+'. Instala uma nas definições do sistema.');
    u.onend=()=>{if(o.end)o.end();};u.onerror=()=>{if(o.err)o.err();};if(o.bd)u.onboundary=o.bd;
    speechSynthesis.cancel();speechSynthesis.speak(u);return true;
  }catch(e){toast('A voz não está disponível neste navegador.');return false;}
}

const R={phase:'start',q:[],i:0,mode:'flip',rev:false,res:null,opts:null,done:0,ok:0,total:0,promo:[],turn:false};
const MODES=[['flip','Virar','flip','Vês a palavra e a frase, lembras-te do significado.'],['cloze','Lacuna','cloze','Escreves a palavra que falta na frase.'],['choice','Escolha','choice','Escolhes a tradução certa entre quatro.'],['listen','Ouvir','ear','Ouves a palavra e escreves o que ouviste.']];
function startReview(){R.recent=[];R.pauseShown=false;R.q=dueList();R.i=0;R.rev=false;R.res=null;R.opts=null;R.done=0;R.ok=0;R.total=R.q.length;R.promo=[];R.phase=R.q.length?'card':'end';renderReview();}
function applyGrade(c,g){
  if(g===1){c.lapses++;c.reps=0;c.ivl=0;c.ease=Math.max(1.3,c.ease-0.2);c.due=TD();return;}
  if(g===2){c.ivl=Math.max(1,Math.round((c.ivl||1)*1.2));c.ease=Math.max(1.3,c.ease-0.15);}
  else if(g===3){c.ivl=c.reps===0?1:c.reps===1?3:Math.round(c.ivl*c.ease);}
  else{c.ivl=c.reps===0?3:Math.max(4,Math.round((c.ivl||1)*c.ease*1.3));c.ease+=0.1;}
  c.reps++;c.due=TD()+c.ivl;
}
function ivlLabel(c,g){const k=JSON.parse(JSON.stringify(c));applyGrade(k,g);return g===1?'<10 min':k.ivl+(k.ivl===1?' dia':' dias');}
function grade(g){
  const l=R.q[R.i];const v=S.vocab[l];
  const since=v.srs.last!=null?Math.max(0,TD()-v.srs.last):(v.srs.ivl||0);
  (S.log=S.log||[]).push([TD(),since,g>=2?1:0,l]);v.srs.last=TD();
  R.recent=(R.recent||[]).concat([g]).slice(-6);
  applyGrade(v.srs,g);
  if(g===1){R.q.push(l);if(v.st>1)v.st--;}
  else if(g>=3&&v.srs.ivl>=3){v.st=Math.min(5,v.st+1);if(v.st===5){R.promo.push(l);toast('«'+label(l)+'» passou a conhecida','check');}}
  R.done++;if(g>=3)R.ok++;R.i++;R.rev=false;R.res=null;R.opts=null;
  logDay('r',1);
  if(R.i>=R.q.length)R.phase='end';
  else if(!R.pauseShown&&R.recent.length>=5&&R.recent.filter(x=>x===1).length>=4){R.pauseShown=true;R.phase='pause';}
  renderReview();
}
function distractors(correct){
  const pool=[];const src=tl()==='en'?DICT:Object.assign({},...Object.keys(DICTX).map(k=>DICTX[k]));Object.keys(src).forEach(k=>{const p=src[k].pt;if(p)pool.push(p.split(/[;,(]/)[0].trim());});
  const c=String(correct||'—').split(/[;,(]/)[0].trim();const out=[];let guard=0;
  while(out.length<3&&guard++<300){const p=pool[Math.floor(Math.random()*pool.length)];if(p&&p!==c&&out.indexOf(p)<0)out.push(p);}
  const all=out.concat([c]);for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=all[i];all[i]=all[j];all[j]=t;}
  return{c:c,all:all};
}

  for(let v=0;v<=mx;v+=100){const y=y1-(v/mx)*(y1-y0);s+=`<line class="gl" x1="${x0}" x2="${x1}" y1="${y}" y2="${y}"/><text x="${x0-8}" y="${y+3}" text-anchor="end">${v}</text>`;}
  const gl=S.settings.goal.r;const gy=y1-(Math.min(gl,mx)/mx)*(y1-y0);
  vals.forEach((v,i)=>{const hh=(v/mx)*(y1-y0),x=x0+i*bw+5,w=bw-10,last=i===13;s+=`<rect class="${last?'bt':'b'}" x="${x.toFixed(1)}" y="${(y1-hh).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(hh,0).toFixed(1)}" rx="4"/><text x="${(x+w/2).toFixed(1)}" y="${y1+16}" text-anchor="middle">${WD[dow(t-13+i)].charAt(0).toUpperCase()}</text>`;if(last)s+=`<text class="em" x="${(x+w/2).toFixed(1)}" y="${(y1-hh-7).toFixed(1)}" text-anchor="middle">${Math.round(v)}</text>`;});
  s+=`<line x1="${x0}" x2="${x1}" y1="${gy}" y2="${gy}" style="stroke:var(--known)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${x1}" y="${gy-6}" text-anchor="end" style="fill:var(--known);font-weight:600">meta ${gl}</text>`;
  return s+'</svg>';
}
function lineChart(){
  const vals=[470,505,538,561,590,612,628,knownCount()];
  const mn=Math.floor((Math.min.apply(null,vals)-30)/50)*50,mx=Math.ceil((Math.max.apply(null,vals)+20)/50)*50;
  const x0=40,x1=596,y0=14,y1=150;
  const pts=vals.map((v,i)=>[x0+i*(x1-x0)/(vals.length-1),y1-((v-mn)/(mx-mn))*(y1-y0)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const last=pts[pts.length-1];
  let s=`<svg class="ch" viewBox="0 0 610 176" role="img" aria-label="Palavras conhecidas nas últimas 8 semanas"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="gs1"/><stop offset="1" class="gs2"/></linearGradient></defs>`;
  for(let v=mn;v<=mx;v+=50){const y=y1-((v-mn)/(mx-mn))*(y1-y0);s+=`<line class="gl" x1="${x0}" x2="${x1}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${x0-8}" y="${(y+3).toFixed(1)}" text-anchor="end">${v}</text>`;}
  s+=`<path class="ar" d="${d} L${x1} ${y1} L${x0} ${y1}Z"/><path class="ln" d="${d}"/>`;

  s+=`<circle class="pt" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="5"/><text class="em" x="${(last[0]-10).toFixed(1)}" y="${(last[1]-12).toFixed(1)}" text-anchor="end">${vals[vals.length-1]}</text>`;

function heatmap(){
  const t=TD();const wd=(dow(t)+6)%7;const start=t-wd-14*7;let s='';
  const vals=[];for(let d=start;d<=t;d++)vals.push((S.days[d]||{w:0}).w);
  for(let d=start;d<=t-wd+6;d++){
    if(d>t){s+='<i style="background:transparent"></i>';continue;}
    const w=(S.days[d]||{w:0}).w;const c=w<=0?'':w<120?'h1':w<220?'h2':w<300?'h3':'h4';
    s+=`<i class="${c} ${d===t?'td':''}" title="${dateLabel(d)}: ${Math.round(w)} palavras"></i>`;
  }
  return`<div class="heat" role="img" aria-label="Atividade das últimas 15 semanas">${s}</div>`;
}
function heatStats(){
  const t=TD();let act=0,best=0,run=0,tot=0;
  for(let d=t-104;d<=t;d++){if(active(d)){act++;run++;best=Math.max(best,run);}else run=0;tot+=(S.days[d]||{w:0}).w;}

}

}

const CEFR=[[0,'A1'],[500,'A2'],[1000,'B1'],[2000,'B2'],[4000,'C1'],[8000,'C2']];
const GROW=()=>{const k=knownCount();return tl()==='en'?[470,505,538,561,590,612,628,k]:[.55,.62,.68,.74,.8,.87,.94,1].map(f=>Math.round(k*f));};

  const k=knownCount();let idx=0;CEFR.forEach((x,i)=>{if(k>=x[0])idx=i;});const nx=CEFR[idx+1];if(!nx)return'';

}
function forecastChart(){
  const t=TD();const c=[0,0,0,0,0,0,0];
  learningList().forEach(l=>{const v=S.vocab[l];if(!v.srs)return;const d=Math.max(0,v.srs.due-t);if(d<7)c[d]++;});
  const mx=Math.max(4,Math.max.apply(null,c));const x0=8,x1=600,y0=22,y1=128,bw=(x1-x0)/7;

  c.forEach((v,i)=>{const h=(v/mx)*(y1-y0),x=x0+i*bw+8,w=bw-16;s+=`<rect class="${i===0?'bt':'b'}" x="${x.toFixed(1)}" y="${(y1-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="5"/><text class="em" x="${(x+w/2).toFixed(1)}" y="${(y1-h-7).toFixed(1)}" text-anchor="middle">${v}</text><text x="${(x+w/2).toFixed(1)}" y="${y1+16}" text-anchor="middle">${i===0?'hoje':i===1?'amanhã':WD[dow(t+i)].slice(0,3)}</text>`;});
  return{svg:s+'</svg>',total:c.reduce((a,b)=>a+b,0),peak:c.indexOf(Math.max.apply(null,c))};

function forgetCurve(){
  const B=[[1,1,'1 dia'],[2,3,'2–3 dias'],[4,7,'4–7 dias'],[8,14,'1–2 sem.'],[15,999,'15+ dias']];
  const EB=[33,28,25,23,21];
  const st=B.map(b=>{let n=0,ok=0;(S.log||[]).forEach(r=>{if(r[1]>=b[0]&&r[1]<=b[1]){n++;ok+=r[2];}});return{n:n,p:n?Math.round(ok/n*100):null};});
  const x0=42,x1=590,y0=14,y1=150,X=i=>x0+i*(x1-x0)/(B.length-1),Y=p=>y1-(p/100)*(y1-y0);
  let s=`<svg class="ch" viewBox="0 0 610 178" role="img" aria-label="Percentagem de palavras lembradas por intervalo desde a última revisão">`;
  [0,25,50,75,100].forEach(v=>{s+=`<line class="gl" x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${x0-8}" y="${Y(v)+3}" text-anchor="end">${v}%</text>`;});
  s+=`<path d="${EB.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p).toFixed(1)).join(' ')}" fill="none" style="stroke:var(--muted)" stroke-width="1.8" stroke-dasharray="5 5"/>`;
  const pts=st.map((x,i)=>x.p==null?null:[X(i),Y(x.p),x]).filter(Boolean);
  if(pts.length>1)s+=`<path class="ar" style="fill:url(#ga2)" d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')} L${pts[pts.length-1][0].toFixed(1)} ${y1} L${pts[0][0].toFixed(1)} ${y1}Z"/><path class="ln" d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}"/>`;
  pts.forEach(p=>{s+=`<circle class="pt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5"/><text class="em" x="${p[0].toFixed(1)}" y="${(p[1]-11).toFixed(1)}" text-anchor="middle">${p[2].p}%</text>`;});
  B.forEach((b,i)=>{s+=`<text x="${X(i).toFixed(1)}" y="${y1+18}" text-anchor="${i===0?'start':i===B.length-1?'end':'middle'}">${b[2]}</text>`;});
  s+=`<defs><linearGradient id="ga2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="gs1"/><stop offset="1" class="gs2"/></linearGradient></defs></svg>`;
  const tot=st.reduce((a,b)=>a+b.n,0);
  const last=st.filter(x=>x.p!=null).slice(-1)[0];
  return{svg:s,tot:tot,last:last?last.p:0};
}

function mistakesHTML(){

function practicePool(){
  const lids=Object.keys(S.texts).concat([cur]).concat(lessonsOf(tl()).map(L=>L.id));const out=[];
  LESSONS.forEach(L=>{if(lids.indexOf(L.id)<0||L.lang!==tl())return;sentsOf(L).forEach(sid=>{const s=SENT[sid];if(!s||!s.pt)return;const n=TOK[sid].filter(t=>t.w).length;if(n>=5&&n<=20&&out.indexOf(sid)<0)out.push(sid);});});
  if(!out.length)lessonsOf(tl()).forEach(L=>sentsOf(L).forEach(sid=>{if(SENT[sid].pt&&out.length<20)out.push(sid);}));

/* ---------- ZIP (EPUB, DOCX, ODT) sem bibliotecas ---------- */
async function unzip(buf){
  const dv=new DataView(buf);let e=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break;}}
  if(e<0)throw new Error('O ficheiro não parece um arquivo válido (zip).');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};const td=new TextDecoder();
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),fl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
    files[td.decode(new Uint8Array(buf,p+46,fl))]={method:method,csize:csize,lho:lho};p+=46+fl+xl+cl;
  }
  return{names:Object.keys(files),text:async function(name){
    const f=files[name];if(!f)return null;
    const ln=dv.getUint16(f.lho+26,true),lx=dv.getUint16(f.lho+28,true);const data=new Uint8Array(buf,f.lho+30+ln+lx,f.csize);
    let out;
    if(f.method===0)out=data;
    else if(f.method===8){
      if(typeof DecompressionStream==='undefined')throw new Error('Este navegador não consegue abrir ficheiros comprimidos. Atualiza-o ou usa o Chrome.');
      const st=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));out=new Uint8Array(await new Response(st).arrayBuffer());
    }else throw new Error('Compressão não suportada.');
    return new TextDecoder('utf-8').decode(out);
  }};
}
function xml(s,type){return new DOMParser().parseFromString(s,type||'application/xml');}
function blocksFromDoc(doc){
  doc.querySelectorAll('script,style,nav,header,footer,aside,noscript,svg,figure figcaption').forEach(n=>n.remove());
  const out=[];const B='p,h1,h2,h3,h4,h5,h6,li,blockquote,pre,dd,dt,td';
  const els=doc.querySelectorAll(B);
  if(els.length){els.forEach(el=>{if(el.querySelector(B))return;const t=el.textContent.replace(/\s+/g,' ').trim();if(t)out.push({t:t,h:/^H[1-3]$/.test(el.tagName.toUpperCase())});});}
  else{const t=(doc.body||doc.documentElement).textContent||'';t.split(/\n\s*\n/).forEach(x=>{x=x.replace(/\s+/g,' ').trim();if(x)out.push({t:x});});}

}

async function extEPUB(buf){
  const z=await unzip(buf);

  const rf=xml(cont).getElementsByTagNameNS('*','rootfile')[0];const opfPath=rf&&rf.getAttribute('full-path');if(!opfPath)throw new Error('EPUB sem ficheiro OPF.');
  const opf=xml(await z.text(opfPath));const dir=opfPath.indexOf('/')>=0?opfPath.slice(0,opfPath.lastIndexOf('/')+1):'';
  const title=((opf.getElementsByTagNameNS('*','title')[0]||{}).textContent||'').trim();
  const langTag=((opf.getElementsByTagNameNS('*','language')[0]||{}).textContent||'').trim();
  const man={};Array.from(opf.getElementsByTagNameNS('*','item')).forEach(it=>{man[it.getAttribute('id')]={href:it.getAttribute('href'),props:it.getAttribute('properties')||'',type:it.getAttribute('media-type')||''};});

    const m=man[ir.getAttribute('idref')];if(!m||/nav/.test(m.props)||!/html/.test(m.type))continue;

    const bl=blocksFromDoc(doc);const txt=paraText(bl);if(txt.length<40)continue;

}
async function extDOCX(buf){

async function extODT(buf){

}
function extHTML(s){const d=xml(s,'text/html');const t=(d.querySelector('title')||{}).textContent||'';return{title:t.trim(),chapters:[{title:'',text:paraText(blocksFromDoc(d))}]};}
function extSubs(s){

function extMD(s){

function loadScriptMod(url){return import(url);}
async function loadPdfjs(){

async function extPDF(buf,progress){

      if(lastY!==null&&Math.abs(y-lastY)>h*1.9){if(line.trim())buf2.push(line.trim());buf2.push('');line='';}

function fmtOf(name){const m=String(name).toLowerCase().match(/\.([a-z0-9]+)$/);return m?m[1]:'txt';}
async function extractFile(f,progress){

  if(/^(mp3|m4a|wav|ogg|mp4|webm)$/.test(ext))throw new Error('Áudio e vídeo precisam de transcrição (Whisper). Fica para a versão real.');

  if(ext==='mobi'||ext==='azw3')throw new Error('Ficheiros Kindle (.mobi/.azw3) não são suportados. Converte para EPUB com o Calibre e tenta outra vez.');

/* ---------- frases e partes ---------- */
function splitSentences(text){
  const paras=String(text).replace(/\r/g,'').split(/\n\s*\n|\n(?=[A-ZÀ-Ý"“«—–-])/).map(p=>p.replace(/\s+/g,' ').trim()).filter(Boolean);
  const out=[];
  paras.forEach(p=>{
    const ss=(p.match(/[^.!?。！？؟…]+(?:[.!?。！？؟…]+["”’'»」』)]*|$)/g)||[p]).map(s=>s.trim()).filter(Boolean);
    const merged=[];ss.forEach(s=>{if(merged.length&&(s.length<3||/^(Mr|Mrs|Ms|Dr|Sr|Sra|St|vs|etc|No|p)\.$/i.test(merged[merged.length-1].split(' ').pop())))merged[merged.length-1]+=' '+s;else merged.push(s);});
    const LET=/[A-Za-z0-9\u00C0-\uFFFF]/;
    merged.filter(s=>LET.test(s)).forEach((s,i)=>{if(s.length>600){for(let k=0;k<s.length;k+=400)out.push({en:s.slice(k,k+400),p:i===0&&k===0?1:0});}else out.push({en:s,p:i===0?1:0});});
  });
  return out;
}
function planImport(parsed){
  const parts=[];
  parsed.chapters.forEach((ch,ci)=>{
    const ss=splitSentences(ch.text);if(!ss.length)return;
    for(let k=0;k<ss.length;k+=PART_SENTS){parts.push({title:ch.title,sents:ss.slice(k,k+PART_SENTS)});}
  });
  return parts.slice(0,MAX_PARTS);
}

  setModal(`<div class="mhead"><div><div class="eyebrow">Os teus dados</div><h2 style="margin-top:6px">Cópia de segurança</h2></div><button class="ibtn" data-close aria-label="Fechar">${I('x')}</button></div>

  <div class="field"><label for="bk-t">Cópia atual · ${kb} KB</label><textarea id="bk-t" class="inp" style="height:120px;padding:12px;font:12px/1.5 ui-monospace,Menlo,monospace" readonly>${esc(data)}</textarea></div>
  <div class="row"><button class="btn pri" id="bk-copy">Copiar cópia</button>${canDownload()?'<button class="btn" id="bk-dl">Descarregar .json</button>':''}</div>
  <div class="set-sec"><h3>Restaurar</h3><p class="muted" style="font-size:13.5px">Abre um ficheiro .json ou cola a cópia abaixo. Substitui os dados atuais.</p>
  <label class="btn sm" for="bk-file" style="justify-self:start">${I('upload',16)} Abrir ficheiro .json<input type="file" id="bk-file" accept=".json,application/json,text/plain" hidden></label>
  <textarea id="bk-in" class="inp" style="height:90px;padding:12px;font:12px/1.5 ui-monospace,Menlo,monospace" placeholder="Cola aqui uma cópia…" aria-label="Cópia para restaurar"></textarea>
  <div class="row"><button class="btn" id="bk-restore">Restaurar cópia</button></div></div>`,'Cópia de segurança');
  $('#bk-copy').onclick=()=>{const ta=$('#bk-t');const fb=()=>{ta.focus();ta.select();toast('Selecionado. Copia com Ctrl+C.');};try{navigator.clipboard.writeText(ta.value).then(()=>toast('Cópia copiada','check'),fb);}catch(e){fb();}};
  const bdl=$('#bk-dl');if(bdl)bdl.onclick=()=>saveFile('glosa-copia-'+new Date().toISOString().slice(0,10)+'.json',$('#bk-t').value);
  $('#bk-file').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)f.text().then(t=>{$('#bk-in').value=t;toast('Ficheiro carregado. Toca em «Restaurar cópia».');});});
  $('#bk-restore').onclick=()=>restoreBackup($('#bk-in').value);
}
function restoreBackup(txt){
  let o;try{o=JSON.parse(txt);}catch(e){toast('Este texto não é uma cópia válida do Glosa.');return;}
  if(!o||typeof o!=='object'||!o.vocab||!o.settings||!o.days){toast('Esta cópia não tem os dados do Glosa.');return;}
  for(let i=LESSONS.length-1;i>=0;i--){if(/^(u|rev)/.test(LESSONS[i].id))LESSONS.splice(i,1);}
  const d=defaults();delete o.app;delete o.v;delete o.date;S=Object.assign(d,o);S.settings=Object.assign(defaults().settings,o.settings||{});
  (S.imported||[]).forEach(registerImported);applyAITranslations();
  cur=lessonById(S.last)?S.last:'t1';G=null;save();applyTheme();closeModal();go('home');toast('Cópia restaurada','check');
}


/* =========================================================
   IA e voz reais
   - Dentro do Claude: IA do Claude (sample), vozes do Claude (tts),
     ditado pelo microfone (dictation) e downloads.
   - Fora do Claude (ex.: GitHub Pages): Gemini com a chave do próprio
     utilizador, voz do dispositivo e downloads normais.
   - Sem nada disto: respostas de exemplo pré-escritas.
   ========================================================= */
var CAP={sample:null,tts:null,dict:null,dl:null};
var AI_DENIED=false,TTS_DENIED=false;
function inClaude(){try{return !!(window.claude&&typeof window.claude.use==='function');}catch(e){return false;}}
function initCaps(){
  if(!inClaude())return;
  [['sample','sample'],['tts','tts'],['dictation','dict'],['downloads','dl']].forEach(p=>{
    try{window.claude.use(p[0]).then(ns=>{CAP[p[1]]=ns||null;onCapsChange();},()=>{});}catch(e){}
  });
}
function onCapsChange(){
  try{
    if(view==='read'&&G)renderGloss();
    if(view==='practice')renderPractice();
    if(modalOn==='Definições'){const a=document.activeElement;if(!a||!/INPUT|TEXTAREA|SELECT/.test(a.tagName))settingsModal();}
  }catch(e){}
}
function gemKey(){try{return localStorage.getItem('glosa-gemini-key')||'';}catch(e){return'';}}
function setGemKey(k){try{if(k)localStorage.setItem('glosa-gemini-key',k);else localStorage.removeItem('glosa-gemini-key');}catch(e){}}
function aiProvider(){if(CAP.sample&&!AI_DENIED)return'claude';if(!inClaude()&&gemKey())return'gemini';return null;}
function aiLabel(src){return src==='claude'?'Claude':src==='gemini'?'Gemini':'Glosa IA · exemplo';}
function ensureAI(){S.ai=S.ai||{};S.ai.d=S.ai.d||{};S.ai.x=S.ai.x||{};S.ai.s=S.ai.s||{};}
function trimCache(){ensureAI();const k=Object.keys(S.ai.x);if(k.length>400)k.slice(0,k.length-400).forEach(x=>delete S.ai.x[x]);}
function nat(){return langName(S.settings.native||'pt');}

async function askAI(prompt,o){
  o=o||{};const src=aiProvider();
  if(src==='claude'){
    try{
      if(o.json)return await CAP.sample.json(prompt,{modelTier:o.tier||'quick'});
      const r=await CAP.sample(prompt,{modelTier:o.tier||'quick',cache:false,onText:o.onText?(x=>o.onText(x.text)):undefined});
      return r.text;
    }catch(e){if(e&&e.code==='not_granted')AI_DENIED=true;throw e;}
  }
  if(src==='gemini'){
    const model=(S.settings.gemModel||'gemini-2.5-flash').trim();
    let res;
    try{res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':gemKey()},body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:o.json?{responseMimeType:'application/json'}:{}})});}
    catch(e){throw{code:'network'};}
    if(!res.ok)throw{code:'http_'+res.status};
    const j=await res.json();const parts=(((j.candidates||[])[0]||{}).content||{}).parts||[];
    const t=parts.map(p=>p.text||'').join('').trim();
    if(o.json){try{return JSON.parse(t.replace(/^```(?:json)?\s*|\s*```$/g,''));}catch(e){throw{code:'bad_json'};}}
    if(o.onText)o.onText(t);
    return t;
  }
  throw{code:'no_ai'};
}
function aiErrText(e){
  const c=e&&e.code||'';
  if(c==='not_granted')return'Não deste acesso à IA. As respostas de exemplo continuam disponíveis. Podes ligar a IA de novo nas definições do Claude.';
  if(c==='rate_limited')return'Muitos pedidos seguidos. Espera um minuto e tenta outra vez.';
  if(c==='http_400'||c==='http_401'||c==='http_403')return'A chave do Gemini não foi aceite. Confirma-a em Definições → IA e voz.';
  if(c==='http_404')return'Esse modelo do Gemini não existe. Muda o nome do modelo em Definições → IA e voz.';
  if(c==='http_429')return'Chegaste ao limite gratuito do Gemini por agora. Tenta mais tarde.';
  if(c==='network')return'Sem ligação à internet.';
  return'A IA não respondeu. Tenta outra vez daqui a pouco.';
}

/* ---------- contexto e pedidos ---------- */
function ctxPara(sid){
  const L=LESSONS.find(x=>sentsOf(x).indexOf(sid)>=0);if(!L)return SENT[sid].en;
  const p=L.paras.find(p=>p.indexOf(sid)>=0)||[sid];return p.map(s=>SENT[s].en).join(' ').slice(0,1200);
}
function lgOf(sid){return SENT_LANG[sid]||'en';}
function pWordExplain(){
  const tk=TOK[G.sid][G.i],lg=lgOf(G.sid);
  return`És um tutor paciente de ${langName(lg)} para alguém cuja língua materna é ${nat()}.
Explica a palavra «${tk.w}» (forma base: ${label(tk.l)}) no sentido que tem nesta frase.
Frase: «${SENT[G.sid].en}»
Parágrafo: «${ctxPara(G.sid)}»
Responde em ${nat()}, em texto simples sem markdown, com no máximo 90 palavras e três partes separadas por uma linha em branco:
1) o que quer dizer aqui;
2) uma nota útil de gramática ou de uso;
3) um exemplo curto e novo em ${langName(lg)}, com a tradução.`;
}
function pSentExplain(){
  const lg=lgOf(G.sid);
  return`És um tutor paciente de ${langName(lg)} para alguém cuja língua materna é ${nat()}.
Explica esta frase: «${SENT[G.sid].en}»
Contexto: «${ctxPara(G.sid)}»
Responde em ${nat()}, em texto simples sem markdown, com no máximo 110 palavras: a tradução natural, depois a estrutura gramatical mais importante e uma expressão ou palavra que valha a pena guardar.`;
}
function pFollow(k){
  const lg=lgOf(G.sid);
  if(G.kind==='word'){const tk=TOK[G.sid][G.i];
    if(k==='ex')return`Dá 2 frases novas e simples em ${langName(lg)} com a palavra «${label(tk.l)}» no mesmo sentido que em «${SENT[G.sid].en}». Depois de cada uma, a tradução para ${nat()}. Texto simples, sem markdown.`;
    if(k==='fam')return`Lista as formas principais da palavra «${label(tk.l)}» em ${langName(lg)} (conjugação, plural, género ou outras, conforme a classe) e 2 palavras da mesma família, cada uma com a tradução para ${nat()}. Texto simples, no máximo 80 palavras, sem markdown.`;
  }
  return null;
}
function pAsk(q){
  const lg=lgOf(G.sid);const what=G.kind==='word'?`a palavra «${TOK[G.sid][G.i].w}»`:G.kind==='phrase'?`a expressão «${phraseText(G.sid,G.a,G.b)}»`:'esta frase';
  return`És um tutor paciente de ${langName(lg)} para alguém cuja língua materna é ${nat()}. O aluno está a ler ${what}, na frase «${SENT[G.sid].en}» (contexto: «${ctxPara(G.sid)}»).
Pergunta do aluno: ${q}
Responde em ${nat()}, em texto simples sem markdown, com no máximo 120 palavras.`;
}

/* ---------- conversa no painel ---------- */
function realAI(prompt,q,key){
  const g=G;if(!g)return;if(q)g.chat.push({me:q});ensureAI();const src=aiProvider();
  if(key&&S.ai.x[key]){g.chat.push({ai:S.ai.x[key],state:'done',src:src,cached:true});renderGloss();scrollGloss();return;}
  const m={ai:'',state:'load',src:src,n:0};g.chat.push(m);renderGloss();scrollGloss();
  askAI(prompt,{onText:t=>{if(G!==g)return;m.ai=t;m.n=t.length;if(m.state==='load'){m.state='stream';renderGloss();}else{const el=document.getElementById('ai-typing');if(el)el.textContent=t;}scrollGloss();}})
  .then(t=>{m.ai=String(t||m.ai||'').trim();m.state='done';if(key&&m.ai){S.ai.x[key]=m.ai;trimCache();save();}if(G===g){renderGloss();scrollGloss();}})
  .catch(e=>{m.state='done';m.err=true;m.ai=aiErrText(e);if(G===g)renderGloss();});
}

/* ---------- traduções que faltam ---------- */
var LOOKING={},TRANSL={};
function autoLookup(l,sid,i){
  ensureAI();if(LOOKING[l]||S.ai.d[l]||!aiProvider())return;
  const tk=TOK[sid][i],lg=lgOf(sid);LOOKING[l]=1;
  askAI(`Palavra em ${langName(lg)}: «${tk.w}». Frase: «${SENT[sid].en}».
Responde só com JSON, sem texto à volta, neste formato:
{"pt":"tradução curta para ${nat()} com o sentido nesta frase","lemma":"forma base (de dicionário)","pos":"subst., verbo, adj., adv., prep., conj., pron. ou outro","reading":"pronúncia em IPA; para escritas não latinas, a romanização"}`,{json:true})
  .then(o=>{delete LOOKING[l];if(o&&o.pt){S.ai.d[l]={pt:String(o.pt),pos:o.pos?String(o.pos):null,ipa:o.reading?String(o.reading):null,lemma:o.lemma?String(o.lemma):null};save();}if(G&&G.kind==='word'&&TOK[G.sid][G.i].l===l)renderGloss();})
  .catch(e=>{delete LOOKING[l];LOOKING[l+'#err']=aiErrText(e);if(G)renderGloss();});
}
function translateSent(sid){
  ensureAI();if(TRANSL[sid]||SENT[sid].pt||!aiProvider())return;TRANSL[sid]=1;
  askAI(`Traduz para ${nat()} esta frase em ${langName(lgOf(sid))}, de forma natural. Responde só com a tradução, sem aspas nem notas.

${SENT[sid].en}`).then(t=>{delete TRANSL[sid];t=String(t||'').trim();if(t){S.ai.s[sid]=t;SENT[sid].pt=t;save();}if(G&&G.sid===sid)renderGloss();})
  .catch(e=>{delete TRANSL[sid];toast(aiErrText(e));});
}
function applyAITranslations(){ensureAI();Object.keys(S.ai.s).forEach(sid=>{if(SENT[sid]&&!SENT[sid].pt)SENT[sid].pt=S.ai.s[sid];});}

/* ---------- prática: correção pela IA ---------- */
function aiCheckPractice(){
  if(!aiProvider()||PR.mode!=='tr')return;

Frase em ${nat()}: «${sd.pt}»
Tradução de referência: «${sd.en}»
Resposta do aluno: «${val}»
Avalia o sentido e a gramática. Aceita traduções diferentes da referência se estiverem corretas e naturais.
Responde só com JSON: {"score": número de 0 a 100, "correct": true ou false, "feedback": "2 ou 3 frases em ${nat()} a explicar os erros, ou a confirmar que está certo", "better": "a resposta do aluno corrigida, mantendo as palavras dele sempre que possível"}`,{json:true,tier:'default'})
  .then(o=>{if(PR.sid!==sid)return;PR.ai={state:'done',d:o||{}};renderPractice();})

function aiPracticeHTML(){

/* ---------- voz do Claude ---------- */
function useClaudeVoice(){return !!(CAP.tts&&!TTS_DENIED&&S.settings.voiceSrc!=='device');}
function claudeSay(text,o){
  const opts={voice:S.settings.cvoice||'buttery',rate:Math.max(.7,Math.min(1.5,o.rate||S.settings.rate||1))};
  const L=lessonById(cur);if(L&&!L.imp&&!o.free)opts.language=(o.lang||tl());
  CAP.tts.speak(String(text).slice(0,2000),opts).then(()=>{if(o.end)o.end();},e=>{
    const c=e&&e.code;if(c==='not_granted'){TTS_DENIED=true;toast('Voz do Claude desligada. A usar a voz do dispositivo.');}
    else if(c==='rate_limited')toast('Muitos pedidos de voz seguidos. Espera um pouco.');
    if(o.err)o.err(e);
  });
  return true;
}
function stopClaudeVoice(){try{if(CAP.tts)CAP.tts.stop();}catch(e){}}

/* ---------- ditado ---------- */
var DICT_ON=false;
function startDictation(onFinal,onState){
  if(!CAP.dict)return false;
  try{CAP.dict.onFinal(({text})=>{if(text)onFinal(text);});CAP.dict.onState(({state,reason})=>{DICT_ON=state==='listening';if(onState)onState(state,reason);});}catch(e){}
  CAP.dict.start().catch(e=>{DICT_ON=false;if(e&&e.code==='not_granted')toast('Sem acesso ao microfone. Podes continuar a escrever.');else if(e&&e.code!=='dismissed')toast('O ditado não está disponível agora.');if(onState)onState('idle','error');});
  return true;
}
function stopDictation(){try{if(CAP.dict)return CAP.dict.stop();}catch(e){}return Promise.resolve();}

/* ---------- downloads ---------- */
function canDownload(){return !!CAP.dl||!inClaude();}
function saveFile(name,data){
  if(CAP.dl){CAP.dl.save({filename:name,data:data}).then(()=>toast('Ficheiro guardado','check'),e=>{if(e&&(e.code==='declined'))return;toast('Não foi possível descarregar aqui.');});return;}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/plain'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}catch(e){toast('Não foi possível descarregar aqui.');}
}

    setTimeout(()=>autoLookup(l,sid,i),0);
    return`<span class="muted" style="font:400 15px/1.5 var(--f-u)">${I('spark',14)} A traduzir com ${aiLabel(src)}…</span>`;
  }
  return`<span class="muted" style="font:400 15px/1.5 var(--f-u)">Sem tradução para esta palavra. ${inClaude()?'A IA do Claude traduz automaticamente quando estiver ligada.':'Adiciona uma chave grátis do Gemini em Definições → IA e voz para traduzir qualquer palavra.'}</span>`;
}
function sentTrHTML(sid,small){
  const src=aiProvider();
  if(src){setTimeout(()=>translateSent(sid),0);return`<span class="muted" style="font:400 ${small?14:15}px/1.5 var(--f-u)">${I('spark',14)} A traduzir com ${aiLabel(src)}…</span>`;}
  return`<span class="muted" style="font:400 ${small?14:15}px/1.5 var(--f-u)">Sem tradução para esta frase. ${inClaude()?'A IA do Claude traduz quando estiver ligada.':'Adiciona uma chave do Gemini em Definições → IA e voz.'}</span>`;
}

let started=false;
function start(d){
  if(started)return;started=true;d=d||{};
  if(d.cur&&lessonById(d.cur))cur=d.cur;
  applyTheme();applyAITranslations();initCaps();
  go(d.view||fromHash()||'home',true);
}
try{
  const H=window.claude&&window.claude.hot;
  if(H&&H.snapshot)H.snapshot(()=>({view:view,cur:cur}));
  if(H&&H.ready){H.ready(start);setTimeout(()=>start({}),1500);}
  else start((H&&H.data)||{});
}catch(e){start({});}

</script>
