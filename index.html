:root{
  /* Glosa — identidade "glosa interlinear".
     Uma glosa é a nota escrita por cima de uma palavra, nos manuscritos.
     Tinta de lápis-lazúli sobre papel azulado, glosas em ouro.
     Azul = palavra nova, ouro = a aprender, sem cor = conhecida. */
  --bg:#E9ECF4; --surface:#FFFFFF; --surface-2:#F3F4F9; --sheet:#FFFFFF; --fill:rgba(26,32,84,.06); --fill-2:rgba(26,32,84,.11);
  --ink:#161B44; --ink-2:#3B416E; --muted:#71769E; --line:rgba(26,32,84,.10); --line-2:rgba(26,32,84,.2);
  --accent:#2F3FD0; --accent-ink:#FFFFFF; --accent-soft:rgba(47,63,208,.10);
  --gold:#E9B32A; --gold-ink:#8C6300;
  --hl1:rgba(233,179,42,.55); --hl2:rgba(233,179,42,.40); --hl3:rgba(233,179,42,.27); --hl4:rgba(233,179,42,.15);
  --new:#2F3FD0; --new-bg:rgba(47,63,208,.12);
  --known:#1B8466; --bad:#C8364A; --warn:#8C6300;
  --f-u:-apple-system,BlinkMacSystemFont,'Segoe UI Variable','Segoe UI',Roboto,'Helvetica Neue',system-ui,sans-serif;
  --f-d:'Lora','Iowan Old Style',Georgia,serif;
  --f-serif:'Lora','Iowan Old Style',Georgia,serif;
  --f-r:var(--f-serif);
  --nav:60px; --rad:24px;
  --ease:cubic-bezier(.32,.72,0,1);
  --bar:rgba(233,236,244,.82);
  --shadow:none;
  --shadow-lg:0 30px 80px -20px rgba(22,27,68,.35),0 0 0 1px rgba(26,32,84,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0F29; --surface:#151A3C; --surface-2:#1C2249; --sheet:#121736; --fill:rgba(190,198,255,.08); --fill-2:rgba(190,198,255,.15);
    --ink:#E9EBFA; --ink-2:#C4C8EA; --muted:#8D92BE; --line:rgba(190,198,255,.12); --line-2:rgba(190,198,255,.24);
    --accent:#8B97FF; --accent-ink:#0B0F29; --accent-soft:rgba(139,151,255,.16);
    --gold:#F2C64E; --gold-ink:#F2C64E;
    --hl1:rgba(242,198,78,.45); --hl2:rgba(242,198,78,.32); --hl3:rgba(242,198,78,.22); --hl4:rgba(242,198,78,.12);
    --new:#9FA9FF; --new-bg:rgba(139,151,255,.22); --known:#4FCB9F; --bad:#FF7A8A; --warn:#F2C64E;
    --bar:rgba(11,15,41,.82); --shadow-lg:0 30px 80px -16px rgba(0,0,0,.7),0 0 0 1px rgba(190,198,255,.1);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0B0F29; --surface:#151A3C; --surface-2:#1C2249; --sheet:#121736; --fill:rgba(190,198,255,.08); --fill-2:rgba(190,198,255,.15);
    --ink:#E9EBFA; --ink-2:#C4C8EA; --muted:#8D92BE; --line:rgba(190,198,255,.12); --line-2:rgba(190,198,255,.24);
    --accent:#8B97FF; --accent-ink:#0B0F29; --accent-soft:rgba(139,151,255,.16);
    --gold:#F2C64E; --gold-ink:#F2C64E;
    --hl1:rgba(242,198,78,.45); --hl2:rgba(242,198,78,.32); --hl3:rgba(242,198,78,.22); --hl4:rgba(242,198,78,.12);
    --new:#9FA9FF; --new-bg:rgba(139,151,255,.22); --known:#4FCB9F; --bad:#FF7A8A; --warn:#F2C64E;
    --bar:rgba(11,15,41,.82); --shadow-lg:0 30px 80px -16px rgba(0,0,0,.7),0 0 0 1px rgba(190,198,255,.1);
    color-scheme:dark;
}
.sheet[data-r="sepia"]{--sheet:#F4ECDC;--bg:#F4ECDC;--ink:#33281A;--ink-2:#54462F;--muted:#8E7F66;--line:rgba(90,70,40,.15);--surface-2:#EAE0CB;--fill:rgba(120,90,40,.09);--bar:rgba(244,236,220,.86);--new-bg:rgba(47,63,208,.11);--gold-ink:#7A5400;color:var(--ink);background:var(--sheet)}
.sheet[data-r="night"]{--sheet:#06081A;--bg:#06081A;--ink:#DCDEF0;--ink-2:#B9BCD8;--muted:#7E82A8;--line:rgba(190,198,255,.1);--surface-2:#141938;--fill:rgba(190,198,255,.07);--bar:rgba(6,8,26,.86);--new:#9FA9FF;--new-bg:rgba(139,151,255,.2);--gold-ink:#F2C64E;--hl1:rgba(242,198,78,.42);--hl2:rgba(242,198,78,.3);--hl3:rgba(242,198,78,.2);--hl4:rgba(242,198,78,.11);color:var(--ink);background:var(--sheet)}

/* ============ shell ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.47 var(--f-u);letter-spacing:-.011em;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
input[type=range],input[type=checkbox]{accent-color:var(--accent)}
a{color:var(--accent);text-decoration:none}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;font-weight:700;text-wrap:balance;line-height:1.12;letter-spacing:-.022em}
p{margin:0}
::selection{background:var(--accent-soft)}
.d{font-family:var(--f-d)}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.eyebrow{font:600 13px/1.3 var(--f-u);letter-spacing:-.005em;color:var(--muted);text-transform:none}
kbd{font:500 11px var(--f-u);padding:1px 6px;border-radius:5px;background:var(--fill);color:var(--muted)}

.shell{min-height:100%}
.rail{display:none}
.main{min-width:0;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 32px)}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:2px;height:calc(52px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 10px 0 20px;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--line)}
.logo{font:700 22px/1 var(--f-d);letter-spacing:-.03em;text-decoration:none;color:var(--ink);display:inline-flex;align-items:baseline}
.logo .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;margin-left:2px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;background:var(--fill);font-size:13px;font-weight:500;white-space:nowrap;color:var(--ink-2)}
.chip svg{display:none}
.chip.ok{color:var(--known);background:color-mix(in srgb,var(--known) 14%,transparent)}
.chip.acc{color:var(--accent);background:var(--accent-soft)}
.chip.y{color:var(--warn);background:var(--hl4)}
#tb-lang{font-weight:600;font-size:12px;letter-spacing:.04em}
.ibtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;color:var(--accent);transition:background .2s,transform .2s var(--ease)}
.ibtn:hover{background:var(--fill)}
.ibtn:active{transform:scale(.92)}
.mhead .ibtn,.g-x{color:var(--muted);background:var(--fill);width:32px;height:32px}
.mhead .ibtn svg,.g-x svg{width:16px;height:16px;stroke-width:2.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:12px;background:var(--fill);font-weight:600;font-size:16px;color:var(--accent);transition:background .2s,transform .2s var(--ease),opacity .2s;white-space:nowrap;letter-spacing:-.01em}
.btn>svg{display:none}
.btn:hover{background:var(--fill-2)}
.btn:active{transform:scale(.97)}
.btn.pri,.btn.blue{background:var(--accent);color:#fff}
.btn.pri:hover,.btn.blue:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn.danger{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.btn.sm{height:36px;padding:0 15px;font-size:15px;border-radius:10px}
.btn.xs{height:30px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.35;pointer-events:none}
.tabbar{position:fixed;z-index:40;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(5,1fr);background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--line);transition:transform .35s var(--ease)}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:500;letter-spacing:0}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button:active .ti{transform:scale(.88)}
.ti{display:grid;place-items:center;transition:transform .2s var(--ease)}
.tabbar .badge{position:absolute;top:5px;left:calc(50% + 6px)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:600;line-height:18px;text-align:center}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:24px 20px 0}
.view:not([hidden]){animation:vin .32s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(6px)}}

@media (min-width:1000px){
  .rail{display:flex;align-items:center;gap:24px;position:sticky;top:0;z-index:30;height:56px;padding:0 28px;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--line)}
  .rail .logo{order:0;font-size:22px}
  .rnav{order:1;flex:1;display:flex;align-items:center;gap:2px;justify-content:center}
  .rnav button{position:relative;display:flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:999px;color:var(--ink-2);font-size:14px;font-weight:500;transition:background .2s,color .2s}
  .rnav button svg{display:none}
  .rnav button:hover{background:var(--fill)}
  .rnav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
  .rnav .sep{width:1px;height:16px;background:var(--line-2);margin:0 8px}
  .rnav .badge{min-width:16px;height:16px;line-height:16px;font-size:10px}
  .rail-lang{order:2}
  .rail-foot{order:3;display:flex;align-items:center}
  .topbar,.tabbar{display:none}
  .main{padding-bottom:64px}
  .wrap{padding:44px 40px 0}
}
.rail-lang{display:none}
@media (min-width:1000px){.rail-lang{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;background:var(--fill);color:var(--ink-2);font-size:13px;font-weight:500}.rail-lang:hover{background:var(--fill-2)}.rail-lang svg{width:15px;height:15px}.rail-lang .lcode{font-size:11px;font-weight:600;color:var(--muted)}}
.rail-set{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;color:var(--ink-2)}
.rail-set:hover{background:var(--fill)}

/* ============ common ============ */
.card{background:var(--surface);border:0;border-radius:var(--rad);padding:22px;box-shadow:var(--shadow)}
.card.flat{background:var(--surface);box-shadow:none}
.card h3{font:700 21px/1.2 var(--f-d);letter-spacing:-.02em}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:44px 0 14px}
.sec-h h2{font:700 clamp(22px,3vw,28px)/1.15 var(--f-d);letter-spacing:-.025em}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.page-h h1{font:700 clamp(34px,5.6vw,56px)/1.04 var(--f-d);letter-spacing:-.035em;margin-top:6px}
.page-h p{color:var(--muted);margin-top:10px;max-width:58ch;font-size:17px}
.page-h p b{font-weight:600;color:var(--ink)}
.meter{display:flex;height:4px;border-radius:4px;overflow:hidden;background:var(--fill);gap:2px}
.meter.thin{height:3px}
.meter i{display:block;height:100%;border-radius:4px}
.m-k{background:var(--known)} .m-l{background:#FFCC00} .m-n{background:var(--new)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:4px;display:inline-block}
.seg{display:inline-flex;gap:0;padding:2px;border-radius:9px;background:var(--fill);position:relative}
.seg button{height:30px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;transition:background .25s var(--ease),box-shadow .25s var(--ease)}
.seg button.on{background:var(--surface);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
:root[data-theme="dark"] .seg button.on{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button.on{background:#636366}}
.seg.full{display:flex}.seg.full button{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--ink-2)}
.pill::before{display:none}
.pill svg{display:none}
.p-new{background:var(--new-bg);color:var(--new)} .p-l1,.p-l2,.p-l3,.p-l4{background:var(--hl3);color:var(--warn)} .p-k{background:color-mix(in srgb,var(--known) 14%,transparent);color:var(--known)} .p-i{color:var(--muted)}
.lvl{display:inline-flex;gap:2px;vertical-align:middle}
.lvl i{width:8px;height:8px;border-radius:50%;background:var(--fill-2)}
.lvl i.on{background:#FFCC00}
.verdict{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.verdict svg{display:none}
.verdict.ok{color:var(--known)} .verdict.bad{color:var(--bad)}
.empty-state{display:grid;justify-items:center;text-align:center;gap:12px;padding:72px 12px}
.empty-state h2{font:700 24px/1.2 var(--f-d)}
.empty-state p{color:var(--muted);max-width:40ch}

/* covers */
.cover{position:relative;container-type:inline-size;width:100%;aspect-ratio:2/3;background:var(--cv,#2F2F2C);color:var(--cvi,#EEE);border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 16px -6px rgba(0,0,0,.25)}
.cv-in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:11cqw 10cqw 10cqw}
.cv-mark{display:block;width:58%;opacity:.92}
.cv-mark svg{display:block;width:100%;height:auto;overflow:visible}
.cv-title{font:700 12.5cqw/1.05 var(--f-d);letter-spacing:-.02em;text-wrap:balance;word-break:break-word}
.cv-sub{font:600 5.6cqw/1 var(--f-u);letter-spacing:.06em;text-transform:uppercase;opacity:.72;margin-top:5cqw}
@container (max-width:96px){.cv-title,.cv-sub{display:none}.cv-mark{width:86%;margin:auto}}
.cover .cv-l{display:none}
.cover .done{position:absolute;top:8px;right:8px;height:22px;padding:0 8px;font-size:11px;background:var(--surface);color:var(--known)}

/* ============ HOJE ============ */
.demo-bar{display:flex;gap:14px 24px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:32px;padding:16px 0 16px 18px;border-left:2px solid #D9B13B;font-size:14px;color:var(--ink-2)}
.demo-bar b{color:var(--ink);font-weight:600}
.home-grid{display:grid;gap:0;grid-template-columns:1fr;margin-top:44px;border-top:1px solid var(--line)}
.home-grid>.card{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:28px 0}
@media (min-width:760px){
  .home-grid{grid-template-columns:repeat(6,1fr)}
  .span-4{grid-column:span 4}.span-2{grid-column:span 2}.span-3{grid-column:span 3}
  .home-grid>.card.span-2{padding:28px 0 28px 28px;border-left:1px solid var(--line)}
  .home-grid>.card.span-4{padding-right:32px}
  .home-grid>.card.span-2:nth-of-type(3){border-left:0;padding-left:0}
  .home-grid>.card.span-2:nth-of-type(3),.home-grid>.card.span-2:nth-of-type(4){padding-right:28px}
}
.cont{display:grid;grid-template-columns:96px 1fr;gap:20px;align-items:start}
.cont .cover{aspect-ratio:2/3}
.cont h2{font:700 clamp(30px,4vw,44px)/1 var(--f-d);letter-spacing:-.02em;margin:10px 0 10px}
.cont .blurb{color:var(--ink-2);font:400 17px/1.5 var(--f-r);max-width:46ch}
.cont .body{display:flex;flex-direction:column;gap:14px;min-width:0}
.cont .muted svg{display:none}
@media (min-width:600px){.cont{grid-template-columns:150px 1fr;gap:28px;align-items:stretch}.cont .cover{aspect-ratio:2/3;height:auto}}
.rings{display:flex;align-items:center;gap:20px}
.rings svg{flex:none}
.gl{display:grid;gap:10px;font-size:13px}
.gl div{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.gl b{margin-left:auto;font-weight:500;font-variant-numeric:tabular-nums}
.gl .sw{width:7px;height:7px}
.due-card .n{font:700 76px/1 var(--f-d);letter-spacing:-.04em}
.due-card .deck{display:none}
.wod .w-big{font:700 44px/1 var(--f-d);letter-spacing:-.02em;margin:12px 0 6px}
.wod q{display:block;font:400 16px/1.6 var(--f-r);color:var(--ink-2);quotes:none;margin-top:12px}
.wod q mark,.g-ctx mark,.face .fctx mark{background:linear-gradient(transparent 60%,var(--hl2) 60%,var(--hl2) 94%,transparent 94%);color:inherit;padding:0 1px}
.mini-list{display:grid;gap:0;grid-template-columns:1fr;border-top:1px solid var(--line)}
@media (min-width:760px){.mini-list{grid-template-columns:repeat(3,1fr)}.mini-list .mini+.mini{border-left:1px solid var(--line)!important}}
.mini{display:grid;grid-template-columns:56px 1fr;gap:16px;align-items:center;padding:18px 18px 18px 0;text-align:left;width:100%;border:0!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;background:transparent!important}
@media (min-width:760px){.mini{padding:20px 22px}.mini:first-child{padding-left:0}}
.mini .cover{aspect-ratio:2/3}
.mini h4{font:600 20px/1.1 var(--f-d)}
.mini:hover h4{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}

/* ============ LEITOR ============ */
/* immersive on phones: the app chrome steps aside, the reader has its own bars */
@media (max-width:999px){
  body.in-read .topbar{display:none}
  body.in-read .tabbar{transform:translateY(110%)}
  body.in-read .main{padding-bottom:0}
}
.reader{display:grid;grid-template-columns:minmax(0,1fr);align-items:start;min-height:100vh}
@media (min-width:1180px){.reader{grid-template-columns:minmax(0,1fr) 360px;gap:0 28px;max-width:1180px;margin:0 auto;padding:0 28px}}
.sheet{background:var(--bg);color:var(--ink);min-height:100vh;transition:background .3s,color .3s}
.rbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;height:calc(52px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 8px 0;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 transparent;transition:box-shadow .2s}
.r-scrolled .rbar{box-shadow:0 .5px 0 var(--line)}
@media (min-width:1000px){.rbar{top:56px;padding-top:0}}
.rb-i{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--accent);transition:background .2s,transform .2s var(--ease)}
.rb-i:active{transform:scale(.9);background:var(--fill)}
.rb-prog{flex:1;height:4px;border-radius:4px;background:var(--fill);overflow:hidden;margin:0 6px}
.rb-prog i{display:block;height:100%;width:100%;background:var(--known);border-radius:4px;transform-origin:left;transform:scaleX(0);transition:transform .25s linear}
.rcol{max-width:680px;margin:0 auto;padding:12px 20px calc(140px + env(safe-area-inset-bottom,0px))}
.r-head{display:grid;grid-template-columns:62px 1fr;gap:16px;align-items:center;padding:8px 0 18px}
.r-head .cover{border-radius:7px}
.rh-t{min-width:0}
.r-head h1{font:700 clamp(22px,4.2vw,30px)/1.15 var(--f-d);letter-spacing:-.025em;overflow-wrap:anywhere}
.r-meta{font-size:14px;color:var(--muted);margin-top:5px}
.cov{padding:0 0 14px}
.cov-top{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:8px;flex-wrap:wrap;color:var(--muted)}
.cov-top b{color:var(--ink);font-weight:600}
.cov-top .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 5px 1px 10px;vertical-align:middle}
.dot.d0{background:var(--new)}.dot.d2{background:#FFCC00}
.pre{padding:6px 0 4px}
.pre-h{font:600 13px var(--f-u);color:var(--muted);margin-bottom:8px}
.pre-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 4px;scroll-snap-type:x proximity}
.pre-chips::-webkit-scrollbar{display:none}
.pchip{flex:none;scroll-snap-align:start;display:inline-flex;align-items:baseline;gap:7px;padding:8px 13px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font-size:13px;color:var(--muted);transition:transform .2s var(--ease)}
.sheet[data-r="sepia"] .pchip,.sheet[data-r="night"] .pchip{background:var(--surface-2);box-shadow:none}
.pchip:active{transform:scale(.96)}
.pchip b{font:600 16px var(--f-u);color:var(--ink)}
.pchip small{font-size:11px;color:var(--accent);font-weight:600}
.textwrap{padding:22px 0 20px}

/* the text */
#text{font-family:var(--f-u);font-size:var(--fs,20px);line-height:var(--lh,1.85);color:var(--ink);letter-spacing:-.005em;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#text.serif{font-family:var(--f-serif);letter-spacing:0}
#text p{margin:0 0 1em;content-visibility:auto;contain-intrinsic-size:auto 160px}
.w{cursor:pointer;border-radius:.24em;padding:.04em .1em;margin:0 -.1em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.w.st0{background:var(--new-bg)}
.w.st1{background:var(--hl1)}.w.st2{background:var(--hl2)}.w.st3{background:var(--hl3)}.w.st4{background:var(--hl4)}
.hl-new .w.st1,.hl-new .w.st2,.hl-new .w.st3,.hl-new .w.st4{background:none}
.hl-none .w.st0,.hl-none .w.st1,.hl-none .w.st2,.hl-none .w.st3,.hl-none .w.st4{background:none}

.w.sel{background:var(--accent)!important;color:#fff}
.w.spk{box-shadow:inset 0 -.14em 0 var(--accent)}
.w.pend{background:var(--accent-soft)!important;box-shadow:inset 0 -.12em 0 var(--accent)}
.w.dr{background:var(--accent)!important;color:#fff}
@media (hover:hover){.w:hover{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 55%,transparent)}}

/* sentences: LingQ-like blocks with the translation underneath */
.sent{border-radius:14px;transition:background .25s}
.lay-sent p{margin:0}
.lay-sent .sent{display:block;padding:10px 14px;margin:0 -14px 6px}
.lay-sent p+p{margin-top:18px}
.sent.act,.sent.playing{background:var(--fill)}
.str{display:none;margin-top:4px;font:italic 400 calc(var(--fs,20px)*.8)/1.45 var(--f-u);color:var(--muted);letter-spacing:0;cursor:pointer;-webkit-user-select:text;user-select:text}
.trs .str:not(:empty),.sent.rev .str:not(:empty){display:block}
.str.wait{display:block!important;height:.9em;width:62%;border-radius:6px;background:var(--fill);animation:pulse 1.1s ease-in-out infinite}
.sbtn{display:inline-grid;place-items:center;width:1.5em;height:1.5em;vertical-align:-.3em;margin-left:.15em;border-radius:50%;color:var(--muted);opacity:.55;transition:opacity .2s,background .2s}
.sbtn svg{width:.8em;height:.8em}
.sbtn:hover{opacity:1;color:var(--accent);background:var(--fill)}
.trs .sbtn{display:none}
.sent.rev .sbtn{opacity:1;color:var(--accent)}
.flow .sbtn,.flow .str{display:none!important}
.lay-page .str{font-size:calc(var(--fs,20px)*.75)}
.lay-page .sent.rev .str{display:block;margin:2px 0 8px}

.r-end{margin-top:36px;display:grid;gap:14px;text-align:center}
.r-end p{color:var(--muted);font-size:14px;max-width:44ch;margin:0 auto}

.phr{border-radius:.24em;-webkit-box-decoration-break:clone;box-decoration-break:clone;background:var(--hl2);padding:.04em 0}
.phr.ph1{background:var(--hl1)}.phr.ph3{background:var(--hl3)}.phr.ph4{background:var(--hl4)}
.phr.ph5{background:none;text-decoration:underline dotted var(--line-2);text-underline-offset:.28em}
.phr .w{background:none!important}
.phr .w.x{text-decoration:none}
.hl-none .phr,.hl-new .phr{background:none}

/* floating dock */
.dock{position:fixed;z-index:35;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:10px;transition:transform .35s var(--ease),opacity .25s}
.reading-open .dock{transform:translate(-50%,140%);opacity:0;pointer-events:none}
@media (min-width:1180px){.dock{left:calc(50% - 194px)}.reading-open .dock{transform:translateX(-50%);opacity:1;pointer-events:auto}}
.dock>button,.dk-grp{height:56px;border-radius:28px;background:var(--bar);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);box-shadow:0 8px 28px -6px rgba(0,0,0,.22),0 0 0 .5px var(--line)}
.dock>button{width:56px;display:grid;place-items:center;color:var(--ink);transition:transform .2s var(--ease),background .2s}
.dock>button:active,.dk-grp button:active{transform:scale(.9)}
.dk-play{background:var(--accent)!important;color:#fff!important}
.dk-play svg{width:22px;height:22px}
.dk-grp{display:flex;align-items:center;padding:0 6px}
.dk-grp button{position:relative;display:grid;place-items:center;width:52px;height:44px;border-radius:22px;color:var(--ink-2);transition:background .2s,color .2s,transform .2s var(--ease)}
.dk-grp button.on{color:var(--accent);background:var(--accent-soft)}
.dk-grp .badge{position:absolute;top:2px;right:4px;background:var(--accent)}
.dk-grp button[disabled]{opacity:.4}
.dk-fin{color:var(--known)!important}

/* gloss: bottom sheet on phones, floating card on desktop */
.g-join{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--muted)}
.g-join>span{margin-right:2px}
.gloss{position:fixed;z-index:45;left:0;right:0;bottom:0;max-height:min(74vh,680px);display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px -10px rgba(0,0,0,.25),0 0 0 .5px var(--line);transform:translateY(105%);visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s;padding-bottom:env(safe-area-inset-bottom,0px);will-change:transform}
.gloss.open{transform:none;visibility:visible;transition-delay:0s}
.g-handle{display:grid;place-items:center;height:22px;flex:none;cursor:grab;touch-action:none}
.g-handle i{width:36px;height:5px;border-radius:3px;background:var(--fill-2)}
.g-scroll{overflow:auto;padding:2px 22px 26px;flex:1;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
@media (max-width:1179px){.reading-open .rcol{padding-bottom:48vh}}
@media (min-width:1180px){
  .gloss{position:sticky;top:132px;left:auto;right:auto;bottom:auto;max-height:calc(100vh - 156px);margin-top:24px;transform:none;visibility:visible;border-radius:20px;box-shadow:var(--shadow-lg);transition:none;padding-bottom:0}
  .g-handle{display:none}
  .g-scroll{padding:22px 24px 24px}
  .g-x{display:none}
}
.g-band{display:none}
.g-word{font:700 32px/1.1 var(--f-d);letter-spacing:-.03em;word-break:break-word}
.g-sub{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.g-sub .ipa{font:400 15px var(--f-u);color:var(--ink-2)}
.g-tr{font:600 20px/1.3 var(--f-u);margin-top:12px;color:var(--ink);letter-spacing:-.015em}
.g-tr svg{display:none}
.g-tabs{display:flex;gap:2px;padding:2px;border-radius:9px;background:var(--fill);margin:20px 0 14px}
.g-tabs button{flex:1;height:30px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .25s var(--ease)}
.g-tabs button svg{display:none}
.g-tabs button.on{background:var(--surface);box-shadow:0 3px 8px rgba(0,0,0,.12);font-weight:600}
:root[data-theme="dark"] .g-tabs button.on{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .g-tabs button.on{background:#636366}}
.g-expr{display:grid;gap:8px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:14px;margin-top:14px;color:var(--ink-2)}
.g-expr b{font-weight:600;color:var(--ink)}
.g-ctx{font:400 17px/1.55 var(--f-u);color:var(--ink)}
.g-ctx .tr{display:block;margin-top:8px;font:italic 400 15px/1.5 var(--f-u);color:var(--muted)}
.g-ctx .tr svg{display:none}
.g-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.g-row .btn,.g-join .btn{height:32px;padding:0 12px;font-size:14px;border-radius:9px}
.ai{display:grid;gap:14px}
.ai-card{position:relative;padding:14px 16px;border-radius:14px;background:var(--fill);font-size:15px;line-height:1.55;color:var(--ink)}
.ai-card p+p{margin-top:8px}
.ai-card b{font-weight:600}
.ai-tag{display:flex;align-items:center;gap:6px;font:600 12px/1 var(--f-u);color:var(--accent);margin-bottom:8px}
.ai-tag svg{display:block;width:13px;height:13px}
.ai-q{justify-self:end;max-width:85%;padding:9px 14px;border-radius:18px 18px 4px 18px;background:var(--accent);color:#fff;font:400 15px/1.4 var(--f-u)}
.caret{display:inline-block;width:2px;height:1.05em;vertical-align:-.15em;background:var(--accent);margin-left:1px;border-radius:1px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{font-size:14px;font-weight:500;color:var(--accent);padding:7px 12px;border-radius:999px;background:var(--accent-soft)}
.ask{display:flex;gap:6px;align-items:center;padding:4px 4px 4px 14px;border-radius:22px;background:var(--fill)}
.ask input{flex:1;min-width:0;border:0;background:transparent;height:36px;outline:none;font:400 16px var(--f-u)}
.ask .btn{height:32px;width:32px;padding:0;border-radius:50%;background:var(--accent);color:#fff}
.ask .btn>svg{display:block}
.skel{height:10px;border-radius:5px;background:var(--fill);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.note-ta{width:100%;min-height:120px;padding:12px 14px;border:0;border-radius:12px;background:var(--fill);font:400 16px/1.5 var(--f-u);resize:vertical;outline:none}
.st-pick{margin-top:22px}
.st-pick .eyebrow{margin-bottom:8px}
.st-row{display:grid;grid-template-columns:minmax(52px,auto) repeat(4,minmax(30px,1fr)) minmax(92px,auto);gap:2px;padding:2px;border-radius:12px;background:var(--fill)}
.st-row button{position:relative;height:42px;padding:0 8px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink-2);display:grid;place-items:center;transition:background .2s,color .2s,transform .15s var(--ease)}
.st-row button:active{transform:scale(.94)}
.st-row .b1,.st-row .b2,.st-row .b3,.st-row .b4{color:var(--ink)}
.st-row .b1::after,.st-row .b2::after,.st-row .b3::after,.st-row .b4::after{content:"";position:absolute;left:28%;right:28%;bottom:6px;height:4px;border-radius:2px}
.st-row .b1::after{background:var(--hl1)}.st-row .b2::after{background:var(--hl2)}.st-row .b3::after{background:var(--hl3)}.st-row .b4::after{background:var(--hl4)}
.st-row button.on{background:#FFCC00;color:#1D1D1F}
.st-row button.on::after{display:none}
.st-row .b0.on{background:var(--new);color:#fff}
.st-row .b5.on{background:var(--known);color:#fff}
.st-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.linkbtn{color:var(--accent);font-size:14px;font-weight:500}
.linkbtn:hover{opacity:.75}
.g-empty{display:grid;gap:16px}
.g-empty h3{font:600 20px/1.3 var(--f-d)!important}
.g-empty .ill{display:none}
.keys{display:grid;gap:9px;font-size:13px;color:var(--muted);padding-top:16px;border-top:.5px solid var(--line)}
.keys div{display:flex;justify-content:space-between;gap:10px}

/* ============ BIBLIOTECA ============ */
.feat{display:grid;grid-template-columns:1fr;gap:28px;margin-top:44px;padding:0;border:0;background:transparent}
.feat .cover{aspect-ratio:2/3;max-width:240px}
.feat .fb{display:flex;flex-direction:column;gap:16px;justify-content:center;padding:0}
.feat h2{font:700 clamp(36px,5vw,60px)/.98 var(--f-d);letter-spacing:-.025em}
.feat .blurb{font:400 19px/1.5 var(--f-r);color:var(--ink-2);max-width:42ch}
@media (min-width:760px){.feat{grid-template-columns:240px 1fr;gap:48px;align-items:center}.feat .cover{max-width:none}}
.lib-tools{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:44px}
.search{display:flex;align-items:center;gap:8px;height:38px;padding:0 2px;border-bottom:1px solid var(--line-2);min-width:220px;flex:1;max-width:340px}
.search:focus-within{border-color:var(--ink)}
.search svg{color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:14px}
.shelf{display:grid;gap:36px 24px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
@media (min-width:760px){.shelf{grid-template-columns:repeat(auto-fill,minmax(176px,1fr))}}
.book{display:flex;flex-direction:column;gap:12px;text-align:left;padding:0;border:0;background:none;width:100%}
.book .cover{aspect-ratio:2/3;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.book:hover .cover{transform:translateY(-3px);box-shadow:inset 3px 0 0 rgba(0,0,0,.12),0 18px 30px -18px rgba(20,20,19,.45)}
.book h4{font:600 19px/1.15 var(--f-d)}
.book .bm{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.book .bm b{font-weight:600}
.book .row .chip{height:22px;font-size:11px;padding:0 8px}
.imp{display:grid;gap:28px;grid-template-columns:1fr!important;margin-top:6px}
@media (min-width:820px){.imp{grid-template-columns:1.1fr 1fr}}
.drop{display:grid;place-items:center;gap:10px;text-align:center;min-height:200px;padding:28px;border:1px dashed var(--line-2);border-radius:var(--rad);background:transparent;transition:border-color .15s,background .15s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--ink);background:var(--surface)}
.drop>span:first-child{border:0!important;background:transparent!important;color:var(--muted)}
.drop .big{font:700 26px/1.1 var(--f-d)}
.srcs{display:grid;gap:0;border-top:1px solid var(--line)}
.src{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-top:0;border-radius:0}
.src .si{display:grid;place-items:center;width:30px;height:30px;color:var(--muted);flex:none;background:transparent}
.src b{display:block;font-weight:500;font-size:14px}
.src small{color:var(--muted);font-size:12.5px}

/* ============ REVER ============ */
.rv-wrap{max-width:720px;margin:0 auto}
.modes{display:grid;gap:0;grid-template-columns:repeat(2,1fr);margin-top:14px;border:1px solid var(--line);border-radius:var(--rad);overflow:hidden}
@media (min-width:640px){.modes{grid-template-columns:repeat(4,1fr)}}
.mode{display:flex;flex-direction:column;gap:6px;padding:18px;text-align:left;background:transparent;border-left:1px solid var(--line);transition:background .15s}
.mode:first-child{border-left:0}
@media (max-width:639px){.modes .mode:nth-child(3){border-left:0}.modes .mode:nth-child(n+3){border-top:1px solid var(--line)}}
.mode:hover{background:var(--surface)}
.mode.on{background:var(--ink);color:var(--bg)}
.mode.on small{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.mode .mi{color:inherit;opacity:.8;margin-bottom:6px}
.mode b{font:600 19px/1.1 var(--f-d)}
.mode small{color:var(--muted);font-size:12.5px;line-height:1.4}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:36px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:20px 20px 20px 0;background:transparent;border:0}
.stat+.stat{border-left:1px solid var(--line);padding-left:20px}
.stat .n{font:700 46px/1 var(--f-d);letter-spacing:-.03em}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:8px}
.rv-top{display:flex;align-items:center;gap:14px;margin-top:6px}
.segs{display:flex;gap:2px;flex:1}
.segs i{flex:1;height:2px;background:var(--line)}
.segs i.d{background:var(--ink)}
.segs i.c{background:var(--accent)}
.flip{perspective:1800px;margin-top:22px}
.flip-in{position:relative;display:grid;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.flip.turn .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:36px 28px;min-height:360px;display:flex;flex-direction:column;gap:20px}
.face.back{transform:rotateY(180deg)}
@media (min-width:640px){.face{padding:48px 56px;min-height:400px}}
.face .fw{font:700 clamp(48px,8vw,72px)/1 var(--f-d);letter-spacing:-.03em}
.face .fctx{font:400 20px/1.65 var(--f-r);color:var(--ink-2)}
.blank{display:inline-block;min-width:5em;border-bottom:1.5px solid var(--ink);margin:0 3px;height:1.1em;vertical-align:-.1em}
.face .ftr{font:400 32px/1.15 var(--f-r)}
.face .fsub{color:var(--muted);font:400 16px/1.5 var(--f-r)}
.face .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.ans{display:flex;gap:8px;align-items:flex-end}
.ans input{flex:1;min-width:0;height:50px;padding:0 2px;border:0;border-bottom:1.5px solid var(--line-2);background:transparent;font:400 22px var(--f-r);outline:none}
.ans input:focus{border-color:var(--ink)}
.opts{display:grid;gap:0;grid-template-columns:1fr;border-top:1px solid var(--line)}
@media (min-width:560px){.opts{grid-template-columns:1fr 1fr}.opts .opt:nth-child(even){border-left:1px solid var(--line)}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:15px 12px;border-bottom:1px solid var(--line);background:transparent;font:400 17px/1.3 var(--f-r);transition:background .15s}
.opt:hover{background:var(--surface-2)}
.opt.right{background:color-mix(in srgb,var(--known) 10%,transparent);color:var(--known)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 8%,transparent);color:var(--bad);text-decoration:line-through}
.qopt{display:grid;gap:0;border-top:1px solid var(--line)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:18px;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.grades button{display:grid;gap:3px;padding:14px 6px;border-left:1px solid var(--line);background:transparent;font-weight:600;font-size:13.5px;text-align:center;transition:background .15s}
.grades button:first-child{border-left:0}
.grades button:hover{background:var(--surface-2)}
.grades button small{font-weight:400;color:var(--muted);font-size:11.5px}
.grades .g1{color:var(--bad)}.grades .g2{color:var(--warn)}.grades .g3{color:var(--known)}.grades .g4{color:var(--accent)}
.done-hero{text-align:center;display:grid;justify-items:center;gap:14px;padding:48px 24px;border:0;background:transparent}
.done-hero h2{font:700 clamp(36px,5vw,52px)/1 var(--f-d);letter-spacing:-.02em}
.done-hero>span:first-child{background:transparent!important;color:var(--ink)!important}
.promo{display:flex;gap:8px 14px;flex-wrap:wrap;justify-content:center}

/* ============ PALAVRAS ============ */
.wl{display:grid;gap:0;margin-top:22px;border-top:1px solid var(--ink)}
.wr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:20px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);text-align:left;width:100%;transition:background .12s}
.wr:hover{background:linear-gradient(90deg,transparent,var(--surface-2) 30%,transparent)}
.wr .ww{font:600 22px/1.1 var(--f-d)}
.wr .wt{color:var(--ink-2);font:400 15px var(--f-r)}
.wr .wc{color:var(--muted);font:400 14px/1.4 var(--f-r);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr .wd{display:grid;justify-items:end;gap:6px;font-size:12px;color:var(--muted)}
.wr .muted svg{display:none}
@media (max-width:640px){.wr{grid-template-columns:1fr auto}.wr .mid{display:none}}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}

/* ============ PROGRESSO ============ */
.kpis{display:grid;gap:0;grid-template-columns:repeat(2,1fr);margin-top:44px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@media (min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{display:grid;gap:4px;position:relative;overflow:hidden;border:0!important;border-radius:0!important;background:transparent!important;padding:24px 22px 18px 0!important}
.kpi+.kpi{border-left:1px solid var(--line)!important;padding-left:22px!important}
@media (max-width:899px){.kpi:nth-child(3){border-left:0!important;padding-left:0!important}.kpi:nth-child(n+3){border-top:1px solid var(--line)!important}}
.kpi .n{font:700 clamp(36px,4vw,48px)/1 var(--f-d);letter-spacing:-.03em}
.kpi .l{font-size:12px;color:var(--muted);letter-spacing:.02em}
.kpi .dl{font-size:12px;font-weight:500;color:var(--known)}
.kpi svg{margin-top:12px}
.pgrid{display:grid;gap:0;grid-template-columns:1fr;margin-top:0}
.pgrid>.card{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:32px 0}
@media (min-width:900px){.pgrid{grid-template-columns:repeat(2,1fr)}.pspan{grid-column:span 2}.pgrid>.card.pr{padding-left:32px;border-left:1px solid var(--line)}.pgrid>.card.pl{padding-right:32px}}
svg.ch{width:100%;height:auto;display:block;overflow:visible}
svg.ch text{fill:var(--muted);font:400 10px var(--f-u)}
svg.ch .gl{stroke:var(--line);stroke-width:1}
svg.ch .b{fill:var(--line-2)}
svg.ch .bt{fill:var(--ink)}
svg.ch .ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
svg.ch .ar{fill:url(#ga)}
svg.ch .pt{fill:var(--bg);stroke:var(--ink);stroke-width:1.6}
svg.ch text.em{fill:var(--ink);font-weight:600;font-size:11px}
svg.ch .gs1{stop-color:var(--ink);stop-opacity:.08}
svg.ch .gs2{stop-color:var(--ink);stop-opacity:0}
.heat-row{display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:3px;overflow-x:auto;padding-bottom:4px;max-width:100%}
.heat i{width:14px;height:14px;border-radius:2px;background:var(--line)}
.heat i.h1{background:color-mix(in srgb,var(--ink) 20%,var(--bg))}
.heat i.h2{background:color-mix(in srgb,var(--ink) 42%,var(--bg))}
.heat i.h3{background:color-mix(in srgb,var(--ink) 66%,var(--bg))}
.heat i.h4{background:var(--ink)}
.heat i.td{outline:1.5px solid var(--accent);outline-offset:1px}
.heat-st{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;flex:1;min-width:260px;align-self:center}
.heat-st .n{font:700 40px/1 var(--f-d);letter-spacing:-.02em}
.heat-st .l{font-size:12px;color:var(--muted);margin-top:6px}
.hl-leg{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.hl-leg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.hl-leg i:nth-of-type(2){background:color-mix(in srgb,var(--ink) 20%,var(--bg))!important}
.hl-leg i:nth-of-type(3){background:color-mix(in srgb,var(--ink) 42%,var(--bg))!important}
.hl-leg i:nth-of-type(4){background:color-mix(in srgb,var(--ink) 66%,var(--bg))!important}
.hl-leg i:nth-of-type(5){background:var(--ink)!important}
.cefr{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin-top:22px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cefr div{height:44px;background:transparent;border-left:1px solid var(--line);display:grid;place-items:center;font-weight:500;font-size:13px;color:var(--muted)}
.cefr div:first-child{border-left:0}
.cefr div.past{color:var(--ink)}
.cefr div.now{background:var(--ink);color:var(--bg)}
.cefr-bar{height:2px;border-radius:2px;background:var(--line);margin-top:14px;overflow:hidden}
.cefr-bar i{display:block;height:100%;background:var(--ink)!important}
.goalrow{display:grid;gap:16px;margin-top:8px}
.gbar{display:grid;gap:7px}
.gbar .gt{display:flex;justify-content:space-between;font-size:13px}
.gbar .gt b{font-weight:500}
.bar{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .4s}
.bar.ok i{background:var(--known)}
.eta{display:flex;gap:12px;align-items:flex-start;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:14px}
.eta .si{display:none}
.eta b{font:600 20px/1.2 var(--f-d)}
.tip{display:flex;gap:10px;align-items:flex-start;margin-top:6px;padding:0 0 0 14px;border-left:2px solid #D9B13B;color:var(--ink-2);font-size:13.5px}
.tip svg{display:none}
.th-row{display:grid;gap:7px}
.mk{display:grid;grid-template-columns:150px 1fr 34px;gap:12px;align-items:center;font-size:13px}
.mk b{text-align:right;font-weight:500}
.mk .bar{height:3px}
.lgrid{display:grid;gap:0;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));border-top:1px solid var(--line)}
.lcard{display:grid;gap:4px;padding:18px 18px 18px 0;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.lcard.on .ln{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.lcard .lst{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.lcard .lst b{color:var(--ink);font-weight:600}

/* ============ PRATICAR ============ */
.pmodes{grid-template-columns:repeat(3,1fr)!important}
@media (max-width:520px){.pmodes{grid-template-columns:1fr!important}.pmodes .mode{flex-direction:row;align-items:center;border-left:0!important;border-top:1px solid var(--line)}.pmodes .mode:first-child{border-top:0}.pmodes small{display:none}.pmodes .mi{margin:0}}
.pr-form{display:grid;gap:12px}
.pr-form textarea{width:100%;min-height:100px;padding:12px 2px;border:0;border-bottom:1.5px solid var(--line-2);background:transparent;font:400 21px/1.5 var(--f-r);resize:vertical;outline:none}
.pr-form textarea:focus{border-color:var(--ink)}
.dlab{font:500 10.5px/1 var(--f-u);letter-spacing:.02em;color:var(--muted);margin-bottom:-10px}
.diff{font:400 20px/1.9 var(--f-r)}
.diff span{padding:0 2px}
.diff .ok{background:none}
.diff .extra{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.diff .miss{background:linear-gradient(transparent 58%,var(--hl2) 58%,var(--hl2) 94%,transparent 94%);color:var(--ink)}
.score{font:700 44px/1 var(--f-d);letter-spacing:-.02em}
.rep-stage{display:grid;gap:10px;padding:26px 0 26px 20px;border-left:2px solid var(--line-2);transition:border-color .25s}
.rep-stage.listen{border-color:var(--accent)}
.rep-stage.repeat{border-color:#D9B13B}
.rep-txt{font:400 clamp(24px,3.2vw,30px)/1.45 var(--f-r);transition:filter .3s}
.rep-bar{height:2px;border-radius:2px;background:var(--line);overflow:hidden}
.rep-bar i{display:block;height:100%;width:0;background:#D9B13B}
.rep-lbl{font-weight:500;font-size:13.5px}

/* ============ páginas: superfícies agrupadas ============ */
.demo-bar{margin-top:22px;padding:14px 16px;border:0;border-radius:16px;background:var(--hl4);font-size:15px}
.home-grid{gap:14px;margin-top:28px;border:0}
.home-grid>.card,.home-grid>.card.span-2,.home-grid>.card.span-4{border:0!important;border-radius:20px;background:var(--surface);padding:20px!important;box-shadow:var(--shadow)}
.cont h2{font-size:clamp(24px,4vw,34px)}
.cont .blurb{font-size:16px;color:var(--muted)}
.due-card .n{font-size:64px;letter-spacing:-.05em}
.wod q{font-style:normal}
.wod q mark,.g-ctx mark,.face .fctx mark{background:var(--hl2);border-radius:.2em;padding:0 .1em}
.mini-list{gap:10px;border:0}
.mini-list .mini+.mini{border-left:0!important}
.mini{padding:12px!important;border-radius:16px!important;background:var(--surface)!important;box-shadow:var(--shadow)}
.mini h4{font-size:17px}
.mini:hover h4{text-decoration:none}
.search{height:40px;padding:0 12px;border:0;border-radius:12px;background:var(--fill)}
.search:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.search input{font-size:16px}
.book .cover{transition:transform .3s var(--ease)}
.book:active .cover{transform:scale(.97)}
.drop{border:0;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);min-height:180px}
.drop:hover,.drop.over{background:var(--surface);box-shadow:inset 0 0 0 2px var(--accent)}
.srcs{border:0;border-radius:14px;overflow:hidden;background:var(--surface)}
.src{padding:12px 16px;border:0}
.src+.src{box-shadow:inset 0 .5px 0 var(--line)}
.modes{gap:10px;border:0;overflow:visible}
.mode,.mode:first-child{border:0!important;border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.modes .mode.on{background:var(--accent);color:#fff;box-shadow:0 8px 20px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
.modes .mode.on small{color:rgba(255,255,255,.8)}
.stats3{gap:10px;border:0}
.stat,.stat+.stat{border:0;padding:16px;border-radius:16px;background:var(--surface)}
.face{border:0;border-radius:22px;box-shadow:var(--shadow-lg)}
.ans input{border:0;border-radius:12px;background:var(--fill);padding:0 14px;font-size:20px}
.ans input:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.opts{gap:8px;border:0}
.opts .opt:nth-child(even){border-left:0}
.opt{border:0;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-size:17px}
.qopt{gap:8px;border:0}
.grades{gap:8px;border:0;overflow:visible}
.grades button,.grades button:first-child{border:0;border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.wl{border:0;border-radius:16px;overflow:hidden;background:var(--surface)}
.wr{padding:14px 16px;border:0}
.wr+.wr{box-shadow:inset 0 .5px 0 var(--line)}
.kpis{gap:10px;margin-top:28px;border:0}
.kpi,.kpi+.kpi{border:0!important;border-radius:18px!important;background:var(--surface)!important;padding:18px!important;box-shadow:var(--shadow)}
.pgrid{gap:14px}
.pgrid>.card,.pgrid>.card.pr,.pgrid>.card.pl{border:0;border-radius:20px;background:var(--surface);padding:22px;box-shadow:var(--shadow)}
.heat i{border-radius:3px;background:var(--fill)}
.cefr{border:0;gap:4px;overflow:visible}
.cefr div,.cefr div:first-child{border:0;border-radius:10px;background:var(--fill)}
.cefr-bar,.bar{height:4px;background:var(--fill)}
.eta{border-top:.5px solid var(--line)}
.tip{border:0;padding:12px 14px;border-radius:12px;background:var(--hl4)}
.lgrid{gap:8px;border:0}
.lcard{border:0;border-radius:14px;background:var(--surface);padding:14px 16px}
.pr-form textarea{border:0;border-radius:14px;background:var(--fill);padding:14px;font-size:20px}
.pr-form textarea:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.rep-stage{border:0;border-radius:18px;background:var(--surface);padding:22px;box-shadow:inset 4px 0 0 var(--line-2)}
.rep-stage.listen{box-shadow:inset 4px 0 0 var(--accent)}
.rep-stage.repeat{box-shadow:inset 4px 0 0 #FFCC00}
.done-hero h2{font-size:28px}

/* ============ línguas ============ */
#text.nodrop p:first-child::first-letter{float:none;font-size:inherit;font-family:inherit;font-weight:inherit;padding:0;line-height:inherit}
#text[dir="rtl"]{font-family:var(--f-r),'Noto Naskh Arabic','Geeza Pro','Segoe UI',Tahoma,sans-serif;line-height:2.2}
#text.cjk{line-height:2.2;letter-spacing:.02em}
#text.cjk .w{margin:0}
#text[dir="rtl"] .sbtn{margin-left:0;margin-right:.1em}
.llist{display:grid;gap:0;max-height:52vh;overflow:auto;border-top:1px solid var(--line)}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.lrow:hover{background:var(--surface-2)}
.lrow.on .ln{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.lrow>svg{color:var(--muted)}
.lrow .ln,.lcard .ln{font:600 20px/1.2 var(--f-d)}
.lb{display:flex;gap:4px 12px;flex-wrap:wrap;margin-top:6px}

/* ============ modal / toast / forms ============ */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.32);display:grid;place-items:end center;padding:0;animation:fade .3s var(--ease)}
@media (min-width:640px){.modal{place-items:center;padding:24px}}
@keyframes fade{from{opacity:0}}
.mcard{width:100%;max-width:560px;max-height:92vh;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;box-shadow:var(--shadow-lg);animation:up .45s var(--ease)}
.mcard:has(.list){background:var(--bg)}
@media (min-width:640px){.mcard{border-radius:20px;padding:26px 24px;animation:pop .35s var(--ease)}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.mcard h2{font:700 26px/1.15 var(--f-d);letter-spacing:-.03em}
.mhead{display:flex;justify-content:space-between;gap:12px;align-items:center}
.mcard .stats3{margin-top:0}
.field{display:grid;gap:7px}
.field>label,.flbl{font-weight:500;font-size:14px;color:var(--ink-2)}
.field .hint{font-size:13px;color:var(--muted)}
.inp,.field select,.field input[type=text],.field input[type=password],.field input[type=number],.field textarea{width:100%;height:44px;padding:0 14px;border-radius:12px;border:0;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--line);outline:none;font-size:16px;transition:box-shadow .2s}
.inp:focus,.field select:focus,.field input:focus,.field textarea:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.field textarea{height:auto;min-height:150px;padding:12px 14px;font:400 16px/1.5 var(--f-u);resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

/* grouped lists (settings, Aa) */
.grp{display:grid;gap:7px}
.grp h4{font:400 13px/1.2 var(--f-u);letter-spacing:.01em;text-transform:uppercase;color:var(--muted);padding:0 16px}
.list{background:var(--surface);border-radius:12px;overflow:hidden}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:7px 16px;width:100%;text-align:left;font-size:16px;color:var(--ink);position:relative}
.li+.li,.li+.li-det,.li-det+.li{box-shadow:inset 0 .5px 0 var(--line)}
.li>span:first-child{display:grid;gap:1px;min-width:0}
.li small{font-size:13px;color:var(--muted);line-height:1.3}
.li-btn{transition:background .15s}
.li-btn:active{background:var(--fill)}
.li-btn>svg{color:var(--muted);opacity:.6;flex:none}
.li-btn .acc,.li-btn.acc{color:var(--accent)}
.li-btn.bad{color:var(--bad)}
.li-sel{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--muted);font-size:16px;text-align:right;text-align-last:right;padding:6px 18px 6px 4px;max-width:58%;outline:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 7px) 52%,calc(100% - 2px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.li-num{width:84px;border:0;background:var(--fill);border-radius:8px;height:32px;text-align:center;font-size:16px;outline:none;font-variant-numeric:tabular-nums}
.li-num:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.li .seg button{height:28px;padding:0 11px}
.li-det summary{list-style:none;cursor:pointer}
.li-det summary::-webkit-details-marker{display:none}
.li-det[open] summary svg{transform:rotate(90deg)}
.li-det summary svg{transition:transform .25s var(--ease)}
.li-body{display:grid;gap:10px;padding:4px 16px 16px}
.li-body .inp{background:var(--fill);box-shadow:none}
.foot{font-size:13px;color:var(--muted);padding:0 16px;line-height:1.4}
.ok-dot{width:10px;height:10px;border-radius:50%;background:var(--known);box-shadow:0 0 0 4px color-mix(in srgb,var(--known) 20%,transparent);flex:none}
.aa-size{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:8px}
.aa-size .btn{height:46px;background:var(--fill);color:var(--ink);font-weight:600}
.aa-val{display:grid;justify-items:center;line-height:1.1;min-width:64px}
.aa-val b{font:600 20px var(--f-u);font-variant-numeric:tabular-nums}
.aa-val span{font-size:12px;color:var(--muted)}
.tdots{display:inline-flex;gap:12px;padding:4px}
.tdots button{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2);transition:box-shadow .2s,transform .2s var(--ease)}
.tdots button:active{transform:scale(.9)}
.tdots button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.tdots .t-paper{background:linear-gradient(135deg,#fff 50%,#1C1C1E 50%)}.tdots .t-sepia{background:#F1E4C7}.tdots .t-night{background:#121214}
.aa-leg{justify-content:center;font-size:12.5px}
.sw.s0{background:var(--new-bg)}.sw.s2{background:var(--hl2)}.sw.sk{box-shadow:inset 0 0 0 1px var(--line-2)}.sw.sx{height:3px;border-radius:0;border-bottom:2px dashed var(--muted)}
.set-sec{display:grid;gap:14px}
.set-sec h3{font:600 20px/1.2 var(--f-d)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px;min-height:48px;padding:7px 16px}
.list .tog+.li,.list .li+.tog{box-shadow:inset 0 .5px 0 var(--line)}
.sw-t{position:relative;width:51px;height:31px;flex:none}
.sw-t input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.sw-t span{position:absolute;inset:0;border-radius:99px;background:var(--fill-2);transition:background .3s var(--ease);pointer-events:none}
.sw-t span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.08);transition:transform .3s var(--ease)}
.sw-t input:checked+span{background:#34C759}
.sw-t input:checked+span::after{transform:translateX(20px)}
.sw-t input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.road{display:grid;gap:10px;font-size:14px;color:var(--ink-2)}
.road div{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.ring-wrap{display:grid;place-items:center;position:relative}
.ring-wrap .c{position:absolute;text-align:center}
.rep-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rep-grid .stat{padding:14px;border-radius:14px;background:var(--surface)}
@media (max-width:520px){.rep-grid{grid-template-columns:repeat(2,1fr)}.mk{grid-template-columns:110px 1fr 30px}}
.btn.rec{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);animation:recp 1.4s ease-in-out infinite}
@keyframes recp{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--bad) 16%,transparent)}}
.toast{position:fixed;z-index:80;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);display:flex;align-items:center;gap:10px;background:var(--bar);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);color:var(--ink);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;pointer-events:none;transition:transform .45s var(--ease),opacity .3s;opacity:0;max-width:calc(100vw - 32px);box-shadow:0 10px 30px -8px rgba(0,0,0,.25),0 0 0 .5px var(--line)}
.toast svg{display:block;color:var(--known);flex:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* ============ identidade: glosa interlinear ============ */
body{background:var(--bg)}
h1,h2,h3{font-family:var(--f-d);font-weight:600;letter-spacing:-.012em}
.page-h h1{font:600 clamp(36px,6vw,58px)/1.02 var(--f-d);letter-spacing:-.02em}
.sec-h h2,.card h3,.mcard h2,.empty-state h2{font-family:var(--f-d);font-weight:600;letter-spacing:-.01em}
.eyebrow{font:500 13px/1.3 var(--f-u);color:var(--muted)}
/* logótipo: "Glosa" com um traço de ouro por cima do o, como as marcas de abreviatura dos copistas */
.logo{position:relative;font:600 24px/1 var(--f-d);letter-spacing:-.02em;color:var(--ink);padding-top:4px}
.logo .dot{position:absolute;top:-1px;left:1.16em;width:.46em;height:.11em;border-radius:.1em;background:var(--gold);transform:rotate(-8deg);margin:0}
/* botões: pílulas; principal em lápis-lazúli */
.btn{border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.btn:hover{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.btn.pri,.btn.blue{background:var(--accent);color:var(--accent-ink)}
.btn.sm{border-radius:999px}.btn.xs{border-radius:999px}
.card{box-shadow:none}
.chip{background:var(--surface);color:var(--ink-2)}
#tb-lang{background:var(--accent);color:var(--accent-ink)}
.ibtn{color:var(--ink-2)}
.seg{background:var(--fill)}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(22,27,68,.12)}
:root[data-theme="dark"] .seg button.on,:root[data-theme="dark"] .g-tabs button.on{background:var(--surface-2);color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button.on,:root:not([data-theme="light"]) .g-tabs button.on{background:var(--surface-2);color:var(--accent)}}
.g-tabs button.on{color:var(--accent)}
.m-l{background:var(--gold)}
.lvl i.on{background:var(--gold)}
.dot.d2{background:var(--gold)}
/* barra de baixo: o separador ativo ganha uma glosa de ouro por cima */
.tabbar{box-shadow:none;border-top:1px solid var(--line)}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:7px;left:50%;width:16px;height:3px;margin-left:-8px;border-radius:2px;background:var(--gold);transform:rotate(-8deg)}
.tabbar button[aria-current="page"] .ti{color:var(--accent)}
.topbar{box-shadow:none}
@media (min-width:1000px){
  .rail{box-shadow:none;border-bottom:1px solid var(--line)}
  .rnav button[aria-current="page"]{background:transparent;color:var(--accent);font-weight:600}
  .rnav button[aria-current="page"]::before{content:"";position:absolute;top:1px;left:50%;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:var(--gold);transform:rotate(-8deg)}
}
/* Hoje: o texto em curso é o bloco de lápis-lazúli */
.home-grid>.card.cont{background:var(--accent)!important;color:#fff;padding:24px!important}
.cont h2{color:#fff;font-weight:600}
.cont .blurb,.cont .muted,.cont .eyebrow{color:rgba(255,255,255,.72)!important}

/* tokenização para qualquer língua */
function segWords(text,lang){
  const out=[];
  const push=(w,isW)=>{if(isW)out.push({w:w});else if(out.length&&out[out.length-1].p!=null)out[out.length-1].p+=w;else out.push({p:w});};
  try{
    if(typeof Intl!=='undefined'&&Intl.Segmenter){const sg=new Intl.Segmenter(lang,{granularity:'word'});for(const s of sg.segment(text))push(s.segment,!!s.isWordLike);return out;}
  }catch(e){}
  let re;try{re=new RegExp("([\\p{L}\\p{M}\\p{N}]+(?:['’][\\p{L}]+)*)|([^\\p{L}\\p{M}\\p{N}]+)","gu");}catch(e){re=/([A-Za-zÀ-ÿ]+)|([^A-Za-zÀ-ÿ]+)/g;}
  let m;while((m=re.exec(text))){if(m[1]&&NOSPACE[lang])Array.from(m[1]).forEach(ch=>push(ch,true));else push(m[1]||m[2],!!m[1]);}
  return out;
}
function lowerL(w,lang){try{return w.toLocaleLowerCase(lang);}catch(e){return w.toLowerCase();}}
function buildTokAny(sid){
  const lang=SENT_LANG[sid]||'en';
  if(lang==='en'){buildTok(sid);return;}
  const toks=segWords(SENT[sid].en,lang);const words=[];
  toks.forEach((t,i)=>{if(t.w){t.l='@'+lang+':'+lowerL(t.w,lang);words.push(i);}});

    for(let a=0;a+x.w.length<=words.length;a++){
      let ok=true;for(let b=0;b<x.w.length;b++){if(lowerL(toks[words[a+b]].w,lang)!==x.w[b]){ok=false;break;}}
      if(ok){for(let b=0;b<x.w.length;b++)toks[words[a+b]].x=xi;break;}
    }
  });
  TOK[sid]=toks;
}
function langOfKey(l){
  if(l.charAt(0)==='@')return l.slice(1,l.indexOf(':'));

function rings(list,size){
  const sz=size||120,c=sz/2,sw=Math.max(2.5,Math.round(sz*.035*10)/10),step=sw+Math.max(5,Math.round(sz*.06));let s=`<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" role="img" aria-label="Metas de hoje">`;
  list.forEach((it,i)=>{const r=c-sw/2-1-i*step,C=2*Math.PI*r,p=Math.max(0,Math.min(1,it.p));
    s+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:var(--line)" stroke-width="${sw}"/>`;
    s+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:${it.c}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${c} ${c})"/>`;});
  return s+'</svg>';
}
function ring1(p,size,color,inner){const sz=size||140,c=sz/2,r=c-9,C=2*Math.PI*r;return`<div class="ring-wrap"><svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:var(--line)" stroke-width="3"/><circle cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:${color||'var(--ink)'}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${(C*Math.max(0,Math.min(1,p))).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${c} ${c})"/></svg><div class="c">${inner||''}</div></div>`;}

function fmt(n){return(Math.round(n*10)/10).toLocaleString('pt-PT');}
function spark(vals,w,h){
  const mx=Math.max.apply(null,vals.concat([1])),mn=0;const pts=vals.map((v,i)=>[i*(w/(vals.length-1)),h-3-((v-mn)/(mx-mn||1))*(h-8)]);

function phraseWords(txt,sid){const lg=SENT_LANG[sid]||'en';return segWords(String(txt),lg).filter(t=>t.w).map(t=>lowerL(t.w,lg).replace(/’/g,"'"));}
function phraseRanges(sid){
  const toks=TOK[sid];if(!toks)return[];const lg=SENT_LANG[sid]||'en';const wi=[];toks.forEach((t,i)=>{if(t.w)wi.push(i);});
  const lw=wi.map(i=>lowerL(toks[i].w,lg).replace(/’/g,"'"));const found=[];
  Object.keys(S.vocab).forEach(k=>{
    if(k.indexOf('phrase:')!==0)return;const v=S.vocab[k];if(!v||v.st===-1||v.st===0)return;

  });
  found.sort((x,y)=>y.n-x.n);const used={},out=[];
  found.forEach(f=>{for(let i=f.a;i<=f.b;i++)if(used[i])return;for(let i=f.a;i<=f.b;i++)used[i]=1;out.push(f);});
  return out;

/* traduções por baixo das frases: as que faltam pedem-se à IA, em lotes, só quando aparecem no ecrã */
let TRIO=null;const TRQ=[];let trBusy=false;
function trOn(){const s=S.settings;return s.layout!=='page'&&s.trans;}
function watchTr(){
  if(TRIO){TRIO.disconnect();TRIO=null;}
  if(!aiProvider()||!('IntersectionObserver' in window))return;
  TRIO=new IntersectionObserver(es=>{es.forEach(e=>{if(!e.isIntersecting)return;const sent=e.target,sid=sent.id;if(SENT[sid].pt){TRIO.unobserve(sent);return;}if(!trOn())return;TRIO.unobserve(sent);if(TRQ.indexOf(sid)<0)TRQ.push(sid);});pumpTr();},{rootMargin:'300px 0px'});
  $$('#text .str').forEach(x=>{if(!x.textContent)TRIO.observe(x.parentNode);});
}
function pumpTr(){
  if(trBusy||!TRQ.length||!aiProvider())return;trBusy=true;
  const ids=TRQ.splice(0,10);ids.forEach(id=>{const el=$(`#text .str[data-t="${id}"]`);if(el)el.classList.add('wait');});
  const done=()=>{trBusy=false;ids.forEach(id=>{const el=$(`#text .str[data-t="${id}"]`);if(el){el.classList.remove('wait');if(SENT[id].pt)el.textContent=SENT[id].pt;}});if(TRQ.length)setTimeout(pumpTr,400);};
  ensureAI();
  askAI(`Traduz para ${nat()} cada frase abaixo, em ${langName(lgOf(ids[0]))}, de forma natural. Responde só com as traduções, uma por linha, com o mesmo número à frente (1. 2. …), sem notas.\n\n`+ids.map((id,k)=>(k+1)+'. '+SENT[id].en.replace(/\s+/g,' ')).join('\n'))
  .then(t=>{String(t||'').split(/\n+/).forEach(line=>{const m=line.match(/^\s*(\d+)[.)]\s*(.+)$/);if(!m)return;const id=ids[+m[1]-1];if(id&&!SENT[id].pt){SENT[id].pt=m[2].trim();S.ai.s[id]=SENT[id].pt;}});save();done();})
  .catch(e=>{done();TRQ.length=0;toast(aiErrText(e));});
}
function revealTr(sid){
  const sent=document.getElementById(sid);if(!sent)return;sent.classList.toggle('rev');
  const el=sent.querySelector('.str');if(sent.classList.contains('rev')&&el&&!el.textContent){if(aiProvider()){if(TRQ.indexOf(sid)<0)TRQ.unshift(sid);pumpTr();}else openSent(sid);}
}

/* IA (pré-escrita) */
function aiMain(){
  if(G.kind==='phrase'){const txt=phraseText(G.sid,G.a,G.b),x=phraseExpr(G.sid,G.a,G.b),sd=SENT[G.sid];return x?`«${txt}» = ${x.pt}.\n\nÉ uma expressão: lê-a como um bloco, não palavra a palavra.`+(sd.ai?'\n\nSobre a frase: '+sd.ai:''):`Juntaste «${txt}». Esta combinação não tem explicação de exemplo. `+(inClaude()?'A IA do Claude explica-a quando estiver ligada.':'Para uma explicação real, adiciona uma chave grátis do Gemini em Definições → IA e voz.');}
  if(G.kind==='sent'){const sd=SENT[G.sid];return sd.ai?'Sobre esta frase: '+sd.ai:'Esta frase não tem explicação pré-escrita na demo. Na versão real, a IA recebe a frase e o parágrafo e explica a estrutura e o vocabulário aqui.';}
  const tk=TOK[G.sid][G.i],l=tk.l,e=info(l),x=tk.x!=null?EXPR[tk.x]:null;const sd=SENT[G.sid];
  if(!e.pt&&!x)return'Esta palavra não tem entrada na demo. Na versão real, a IA recebe a frase e o parágrafo à volta e explica aqui o sentido neste contexto, com um exemplo ao teu nível.';
  let t=e.pt?`Neste texto, «${tk.w}» quer dizer «${e.pt.split(';')[0]}».`:`«${tk.w}» faz parte de uma expressão.`;
  if(e.ai)t+='\n\n'+e.ai;
  else if(isBasic(l))t+='\n\nÉ uma palavra muito frequente. Vale a pena reconhecê-la sem traduzir.';
  if(!e.ai&&!isBasic(l)&&tl()!=='en')t+='\n\nNa versão real, a IA explica esta palavra em contexto para qualquer língua.';
  if(x)t+=`\n\nFaz parte da expressão «${x.w.join(' ')}» = ${x.pt}. Lê-a como um bloco.`;
  if(sd.ai)t+='\n\nSobre a frase: '+sd.ai;
  return t;
}
function aiFollow(k){
  if(G.kind==='phrase'){const txt=phraseText(G.sid,G.a,G.b);
    if(k==='pslow'){say(txt,{rate:.7});return`A ler «${txt}» devagar. Repete em voz alta: as expressões fixam-se melhor quando as dizes como um bloco.`;}
    const pw=phraseWords(txt,G.sid);const o=[];Object.keys(SENT).forEach(sid=>{if(sid===G.sid||!TOK[sid])return;const lw=TOK[sid].filter(t=>t.w).map(t=>lowerL(t.w,SENT_LANG[sid]||'en'));for(let s=0;s+pw.length<=lw.length;s++){if(pw.every((w,j)=>lw[s+j]===w)){o.push(sid);break;}}});
    return o.length?'Noutro texto da tua biblioteca:\n\n'+o.slice(0,2).map(sid=>`«${SENT[sid].en}»\n→ ${SENT[sid].pt||'(sem tradução)'}`).join('\n\n'):`«${txt}» só aparece neste texto. `+(aiProvider()?'':'Com a IA ligada, aparece aqui um exemplo novo.');}
  if(G.kind!=='word'){
    if(k==='words'){const o=[];TOK[G.sid].forEach(t=>{if(t.w&&status(t.l)!==5&&status(t.l)!==-1&&o.indexOf(t.l)<0)o.push(t.l);});return o.length?'Palavras que ainda estás a aprender nesta frase:\n'+o.map(l=>`• ${l}: ${info(l).pt||'sem entrada'}`).join('\n'):'Já conheces todas as palavras desta frase.';}
    if(k==='slow'){say(SENT[G.sid].en,{rate:.7});return'A ler a frase a 70% da velocidade. Repete em voz alta logo a seguir (shadowing): ajuda a fixar o ritmo.';}
  }
  const tk=TOK[G.sid][G.i],l=tk.l,e=info(l);
  if(k==='ex'){
    const o=[];Object.keys(SENT).forEach(sid=>{if(sid===G.sid||!TOK[sid])return;if(TOK[sid].some(t=>t.w&&t.l===l))o.push(sid);});
    if(!o.length)return`«${l}» só aparece neste texto. Na versão real, a IA cria uma frase nova com esta palavra e só com vocabulário que já conheces.`;
    return'Noutro texto da tua biblioteca:\n\n'+o.slice(0,2).map(sid=>`«${SENT[sid].en}»\n→ ${SENT[sid].pt||'(sem tradução)'}`).join('\n\n');
  }
  if(k==='pron'){say(tk.w,{rate:.7});return(e.ipa?`${tk.w} ${e.ipa}\n\n`:'')+(e.ipa&&e.ipa.indexOf('ˈ')>=0?'O sinal ˈ marca a sílaba tónica: a que se diz com mais força. ':'')+'Estás a ouvir a palavra devagar. Toca no altifalante para a velocidade normal.';}
  if(k==='fam'){const f={};Object.keys(TOK).forEach(sid=>TOK[sid].forEach(t=>{if(t.w&&t.l===l)f[t.w.toLowerCase()]=1;}));const forms=Object.keys(f);return`Forma base: ${l}.\nFormas que já encontraste: ${forms.join(', ')}.`+(e.pos==='verbo'?'\n\nComo verbo, repara nas terminações -s (presente), -ed (passado) e -ing.':'');}
  if(k==='where'){const o=LESSONS.map(L=>({L:L,n:sentsOf(L).reduce((a,sid)=>a+TOK[sid].filter(t=>t.w&&t.l===l).length,0)})).filter(x=>x.n);return'Onde aparece na tua biblioteca:\n'+o.map(x=>`• ${x.L.title}: ${x.n}×`).join('\n');}
  return'';
}
function askReply(q){const s=SENT[G.sid].en;return`Recebi a pergunta. Nesta demo as respostas são pré-escritas, por isso não consigo responder a perguntas livres.\n\nNa versão real, a pergunta segue para o modelo junto com a frase «${s}» e o parágrafo, e a resposta aparece aqui.`;}
function startAI(){if(!G.chat.length){const key=(G.kind==='word'?TOK[G.sid][G.i].l:G.kind==='phrase'?'P:'+phraseText(G.sid,G.a,G.b).toLowerCase():'S')+'|'+G.sid;if(aiProvider())realAI(G.kind==='word'?pWordExplain():G.kind==='phrase'?pPhraseExplain():pSentExplain(),null,'ai:'+(S.settings.native||'pt')+':'+key);else runAI(aiMain(),null,key);}}
function runAI(text,q,key){
  const g=G;if(q)g.chat.push({me:q});
  const cached=key&&AIC[key];const m={ai:text,state:'load',n:0,cached:!!cached};g.chat.push(m);renderGloss();scrollGloss();
  setTimeout(()=>{if(G!==g)return;if(key)AIC[key]=1;m.state='type';renderGloss();typeStep(g,m);},cached?120:650);
}
function typeStep(g,m){
  clearInterval(typeTimer);
  if(reduced){m.state='done';renderGloss();return;}

    if(G!==g){clearInterval(typeTimer);return;}

  },16);

function scrollGloss(){const s=$('#gscroll');if(s&&G&&G.tab==='ai')s.scrollTop=s.scrollHeight;}
function glossAct(a,b){
  if(!G)return;
  if(a==='close'){closeGloss();return;}
  if(a==='tab'){G.tab=b.dataset.v;renderGloss();if(G.tab==='ai')startAI();return;}
  if(a==='trs'){G.tr=!G.tr;renderGloss();return;}
  if(a==='say-w'){say(TOK[G.sid][G.i].w);return;}
  if(a==='say-s'){say(SENT[G.sid].en);return;}
  if(a==='say-slow'){say(SENT[G.sid].en,{rate:.7});return;}
  if(a==='say-p'){say(phraseText(G.sid,G.a,G.b));return;}
  if(a==='fu'){const pr=aiProvider()&&pFollow(b.dataset.v);if(pr)realAI(pr,b.textContent);else runAI(aiFollow(b.dataset.v),b.textContent);return;}
  if(a==='st'){setWordStatus(+b.dataset.v);return;}
  if(a==='xsel'){const tk=TOK[G.sid][G.i];const r=exprRange(G.sid,tk.x);openPhrase(G.sid,r[0],r[1]);return;}
  if(a==='xsave'){const tk=TOK[G.sid][G.i];const r=exprRange(G.sid,tk.x);savePhrase(G.sid,r[0],r[1]);renderText();refreshWords();renderGloss();return;}
  if(a==='psave'){savePhrase(G.sid,G.a,G.b);renderText();refreshWords();renderGloss();return;}
  if(a==='pst'){setPhraseStatus(+b.dataset.v);return;}
  if(a==='phopen'){openPhrase(G.sid,+b.dataset.a,+b.dataset.b);return;}
  if(a==='join'){const j=adjW(G.sid,G.i,+b.dataset.v);if(j>=0)openPhrase(G.sid,Math.min(G.i,j),Math.max(G.i,j));return;}
  if(a==='ext'){let A=G.a,B=G.b;const v=b.dataset.v;
    if(v==='l+'){const j=adjW(G.sid,A,-1);if(j>=0)A=j;}else if(v==='r+'){const j=adjW(G.sid,B,1);if(j>=0)B=j;}
    else if(v==='l-'){const j=adjW(G.sid,A,1);if(j>=0&&j<=B)A=j;}else if(v==='r-'){const j=adjW(G.sid,B,-1);if(j>=0&&j>=A)B=j;}
    if(A===B)openWord(G.sid,A);else openPhrase(G.sid,A,B);return;}
  if(a==='goword'){const l=b.dataset.v;const i=TOK[G.sid].findIndex(t=>t.w&&t.l===l);if(i>=0)openWord(G.sid,i);return;}
}
function setWordStatus(v){
  if(!G||G.kind!=='word')return;const tk=TOK[G.sid][G.i];const before=status(tk.l);

  if(v>=1&&v<=4&&!(before>=1&&before<=4))toast('Cartão criado com esta frase','cards');

}
function savePhrase(sid,a,b,quiet){

function setPhraseStatus(v){

let VOICES=[];
function loadVoices(){try{ALLV=speechSynthesis.getVoices()||[];VOICES=ALLV.filter(v=>/^en/i.test(v.lang));}catch(e){}}
var ALLV=[];
function voicesFor(lg){const b=(lg||'en').split('-')[0].toLowerCase();return ALLV.filter(v=>String(v.lang).toLowerCase().replace('_','-').split('-')[0]===b);}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}
function pickVoice(lg){lg=lg||'en';if(lg!=='en'){const vs=voicesFor(lg);const pref=BCP[lg];return vs.find(v=>pref&&String(v.lang).replace('_','-').toLowerCase()===pref.toLowerCase())||vs[0]||null;}if(S.settings.voice){const v=VOICES.find(x=>x.name===S.settings.voice);if(v)return v;}return VOICES.find(v=>/en[-_]GB/i.test(v.lang))||VOICES[0]||null;}
function say(text,o){
  o=o||{};
  if(useClaudeVoice())return claudeSay(text,o);
  if(inAndroid())return androidSay(text,o);
  try{
    if(!('speechSynthesis' in window))throw new Error('no tts');
    const lg=o.lang||tl();const u=new SpeechSynthesisUtterance(text);u.lang=BCP[lg]||lg;u.rate=o.rate||S.settings.rate||1;const v=pickVoice(lg);if(v)u.voice=v;else if(lg!=='en'&&ALLV.length&&!o.quiet)toast('Este dispositivo não tem voz para '+langName(lg).toLowerCase()+'. Instala uma nas definições do sistema.');
    u.onend=()=>{if(o.end)o.end();};u.onerror=()=>{if(o.err)o.err();};if(o.bd)u.onboundary=o.bd;
    speechSynthesis.cancel();speechSynthesis.speak(u);return true;
  }catch(e){toast('A voz não está disponível neste navegador.');return false;}
}
const PL={on:false,k:0};

function playFrom(k){
  if(!PL.on)return;const ids=sentsOf(lessonById(cur));
  if(k>=ids.length){stopPlay();PL.k=0;toast('Chegaste ao fim do texto','check');return;}

  const t0=Date.now();

function applyGrade(c,g){
  if(g===1){c.lapses++;c.reps=0;c.ivl=0;c.ease=Math.max(1.3,c.ease-0.2);c.due=TD();return;}
  if(g===2){c.ivl=Math.max(1,Math.round((c.ivl||1)*1.2));c.ease=Math.max(1.3,c.ease-0.15);}
  else if(g===3){c.ivl=c.reps===0?1:c.reps===1?3:Math.round(c.ivl*c.ease);}
  else{c.ivl=c.reps===0?3:Math.max(4,Math.round((c.ivl||1)*c.ease*1.3));c.ease+=0.1;}
  c.reps++;c.due=TD()+c.ivl;
}
function ivlLabel(c,g){const k=JSON.parse(JSON.stringify(c));applyGrade(k,g);return g===1?'<10 min':k.ivl+(k.ivl===1?' dia':' dias');}
function grade(g){
  const l=R.q[R.i];const v=S.vocab[l];
  const since=v.srs.last!=null?Math.max(0,TD()-v.srs.last):(v.srs.ivl||0);
  (S.log=S.log||[]).push([TD(),since,g>=2?1:0,l]);v.srs.last=TD();
  R.recent=(R.recent||[]).concat([g]).slice(-6);
  applyGrade(v.srs,g);
  if(g===1){R.q.push(l);if(v.st>1)v.st--;}
  else if(g>=3&&v.srs.ivl>=3){v.st=Math.min(5,v.st+1);if(v.st===5){R.promo.push(l);toast('«'+label(l)+'» passou a conhecida','check');}}
  R.done++;if(g>=3)R.ok++;R.i++;R.rev=false;R.res=null;R.opts=null;
  logDay('r',1);
  if(R.i>=R.q.length)R.phase='end';
  else if(!R.pauseShown&&R.recent.length>=5&&R.recent.filter(x=>x===1).length>=4){R.pauseShown=true;R.phase='pause';}
  renderReview();
}
function distractors(correct){
  const pool=[];const src=tl()==='en'?DICT:Object.assign({},...Object.keys(DICTX).map(k=>DICTX[k]));Object.keys(src).forEach(k=>{const p=src[k].pt;if(p)pool.push(p.split(/[;,(]/)[0].trim());});
  const c=String(correct||'—').split(/[;,(]/)[0].trim();const out=[];let guard=0;
  while(out.length<3&&guard++<300){const p=pool[Math.floor(Math.random()*pool.length)];if(p&&p!==c&&out.indexOf(p)<0)out.push(p);}
  const all=out.concat([c]);for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=all[i];all[i]=all[j];all[j]=t;}
  return{c:c,all:all};
}

function heatmap(){

function cefr(){

/* Android: as barras do sistema (relógio em cima, navegação em baixo) acompanham a cor da app */
function syncBars(){
  const A=window.GlosaAndroid;if(!A||typeof A.setBars!=='function')return;
  requestAnimationFrame(()=>{try{
    const rgb=c=>{c=String(c).trim();if(c[0]==='#'){const h=c.length===4?c.slice(1).split('').map(x=>x+x).join(''):c.slice(1,7);return[0,2,4].map(i=>parseInt(h.substr(i,2),16));}const m=c.match(/[\d.]+/g)||[0,0,0];return m.map(Number);};
    const solid=(fg,bg)=>{const f=rgb(fg),b=rgb(bg),a=f.length>3?f[3]:1;return[0,1,2].map(i=>Math.round(f[i]*a+b[i]*(1-a)));};
    const hex=c=>'#'+c.map(x=>x.toString(16).padStart(2,'0')).join('');
    const light=c=>(c[0]*299+c[1]*587+c[2]*114)/1000>150;
    const inRead=view==='read'&&!window.matchMedia('(min-width:1000px)').matches;
    const sh=inRead&&document.getElementById('sheet');
    const base=sh||document.documentElement;const cs=getComputedStyle(base);
    const bg=cs.getPropertyValue('--bg').trim()||'#000';
    const bar=cs.getPropertyValue('--bar').trim()||bg;
    const top=solid(bar,bg),bottom=inRead?solid(bg,bg):top;
    const k=hex(top)+hex(bottom);if(syncBars.k===k)return;syncBars.k=k;
    A.setBars(hex(top),hex(bottom),light(top),light(bottom));
  }catch(e){}});
}
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>syncBars());}catch(e){}
